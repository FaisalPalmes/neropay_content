<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=660, height=1434">
<title>NeroPay App Store stills</title>
<!-- NeroPay — App Store carousel stills, iPhone 6.9", v2, 23 Sep 2026. Laid out at 660 × 1434 CSS px and captured at
     2× = 1320 × 2868, Apple's 6.9" portrait size. One frame per page load: stills/index.html#1 … #6 (render.cjs).
     Faisal, v2: keep our own layout and copy — wordmark, rule, kicker, headline with the marker, sub, chips, exactly
     as his v1 export — and take only the art from the SumUp reference: some screens inside a phone, some bare in a
     heavy yellow glass outline, with a piece of the screen lifted out over it. Frame 1 is his Higgsfield photograph
     with the keyed phone screen replaced by the app. -->
<style>
@font-face{font-family:Poppins;src:url(../fonts/poppins-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(../fonts/poppins-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(../fonts/poppins-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(../fonts/poppins-latin-400-normal.woff2)format("woff2");font-weight:400;font-display:block}
:root{--yel:#FFCF24;--ink:#111114}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:660px;height:1434px;overflow:hidden;background:#EFEEEC}
/* his v1 ground: cool grey-white on the left warming to a soft yellow on the right */
.frame{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(120% 60% at 100% 0%,rgba(255,221,120,.38),rgba(255,221,120,0) 70%),
             linear-gradient(100deg,#EEEEEC 0%,#EFECE3 55%,#F1E8CF 100%)}

/* ── the copy block, his v1 layout ── */
.wm{position:absolute;left:49px;top:66px;width:114px}
.rule{position:absolute;left:49px;top:122px;width:40px;height:5px;border-radius:3px;background:var(--yel)}
.kick{position:absolute;left:49px;top:144px;font:500 13px Poppins;letter-spacing:.16em;text-transform:uppercase;color:#66666C}
h1{position:absolute;left:49px;right:30px;top:176px;font:700 58px/1.0 Poppins;letter-spacing:-.035em;color:var(--ink)}
h1 span{display:block}
h1 .two{position:relative;display:inline-block;isolation:isolate}
h1 .two::before{content:"";position:absolute;left:-6px;right:-8px;bottom:.05em;height:.40em;background:var(--yel);border-radius:3px;z-index:-1}
.blk{position:absolute;left:49px;right:34px;top:310px}
.sub{font:400 15.5px/1.45 Poppins;color:#56565C}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.95);
  font:600 12px Poppins;color:#1E1E22;box-shadow:0 6px 14px -8px rgba(17,18,20,.28),inset 0 0 0 1px rgba(17,17,20,.05)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--yel)}

/* ── the art: a bare screenshot in a heavy yellow liquid-glass outline ── */
.glass{position:absolute;padding:15px;border-radius:50px;
  background:linear-gradient(150deg,#FFE789 0%,#FFCF24 30%,#F4BE0C 58%,#FFD94A 80%,#FFF0B0 100%);
  box-shadow:0 50px 90px -40px rgba(17,17,20,.40),0 14px 30px -18px rgba(17,17,20,.25),
    inset 0 3px 0 rgba(255,255,255,.85),inset 0 -3px 4px rgba(150,105,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 70%,rgba(255,255,255,.35) 100%)}
.glass .shot{position:relative;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(120,90,0,.25)}
.glass .shot img{display:block;width:100%}

/* ── …or inside a flat, unbranded phone: the same front face as the video, no maker's mark ── */
.phone{position:absolute;border-radius:74px;padding:12px;
  background:linear-gradient(145deg,#4A4C51 0%,#26272B 40%,#17181B 64%,#3C3E43 100%);
  box-shadow:0 60px 100px -45px rgba(17,17,20,.55),0 16px 34px -20px rgba(17,17,20,.35),
    inset 0 0 0 2px rgba(255,255,255,.26),inset 0 0 0 7px #0F1012}
.phone .scr{position:relative;border-radius:62px;overflow:hidden;background:#fff}
.sbar{height:64px;position:relative;background:#fff}
.sbar .t{position:absolute;left:42px;top:24px;font:600 19px Poppins;color:#111}
.sbar .isl{position:absolute;left:50%;top:18px;width:132px;height:38px;margin-left:-66px;border-radius:20px;background:#050506}
.sbar .r{position:absolute;right:38px;top:28px;display:flex;gap:5px;align-items:flex-end}
.sbar .r b{display:block;background:#111;border-radius:2px;width:4px}
.sbar .r b.bat{width:24px;height:12px;border-radius:4px;margin-left:6px}
.phone .scr img{display:block;width:100%}

/* ── a piece of the screen lifted out over the art ── */
.lift{position:absolute;overflow:hidden;border-radius:20px;background:#fff;
  box-shadow:0 40px 70px -30px rgba(17,17,20,.50),0 10px 22px -12px rgba(17,17,20,.30),inset 0 0 0 1px rgba(17,17,20,.06)}
.lift img{position:absolute;display:block}

/* ── frame 1: his photograph, cover-scaled (1116 × 2000 → 800 × 1434, 70px off each side). The app sits in the
   keyed screen rectangle, x 374–739, y 590–1393 of the source ── */
.photo{position:absolute;left:-70px;top:0;width:800px;height:1434px}
.photo > img{position:absolute;inset:0;width:100%;height:100%}
/* the keyed screen, x 372–741 / y 588–1396 of the source, at the photo's scale (.717) */
.hscr{position:absolute;left:266.7px;top:421.6px;width:265.3px;height:579.3px;background:#fff;overflow:hidden}
/* the screen is built like a real one: the app, the bottom of its CHARGE / TAP buttons (his export cuts them),
   the home-indicator safe area, then matched to the photograph — a touch soft, a touch dimmer, lit from the left,
   a glass reflection, the bezel's inner shadow and the card's shadow falling across the screen */
.hscr .ui{position:absolute;left:0;right:0;bottom:0;filter:blur(.35px) contrast(.95) brightness(.97) saturate(.95)}
.hscr .ui .crop{overflow:hidden}
.hscr .ui img{display:block;width:100%;margin-top:-36px}   /* drops the Keypad / POS switch: only a sliver of it showed past the card */
.hscr .ext{position:relative;height:10px}
.hscr .ext b{position:absolute;top:-1px;height:11px;border-radius:0 0 7px 7px}
.hscr .ext .c{left:2.55%;width:46.3%;background:#000}
.hscr .ext .t{left:51.5%;width:46.2%;background:#EEEEEE}
.hscr .safe{height:22px;position:relative;background:#fff}
.hscr .safe i{position:absolute;left:50%;bottom:7px;width:92px;height:4px;margin-left:-46px;border-radius:3px;background:#111}
/* the tap-ready screen (Faisal, 23 Sep): CHARGE has just been pressed, so the screen shows only the amount in an oval
   with the contactless signal going out from it, on a white ground with a soft yellow and a soft blue bloom */
.hscr .tap{position:absolute;inset:0;overflow:hidden;background:#FBFAF7;filter:blur(.35px) contrast(.95) brightness(.97) saturate(.95)}
.hscr .tap .bloom{position:absolute;border-radius:50%}
.hscr .tap .by{left:-60px;top:170px;width:330px;height:330px;background:radial-gradient(closest-side,rgba(255,207,36,.45),rgba(255,207,36,0))}
.hscr .tap .bb{left:90px;top:360px;width:300px;height:300px;background:radial-gradient(closest-side,rgba(110,150,255,.30),rgba(110,150,255,0))}
.hscr .tap .bb2{left:-90px;top:420px;width:220px;height:220px;background:radial-gradient(closest-side,rgba(150,180,255,.22),rgba(150,180,255,0))}
.hscr .tap svg.rings{position:absolute;left:0;top:0;width:265.3px;height:579.3px;overflow:visible}
.hscr .tap .oval{position:absolute;left:37.6px;top:300px;width:190px;height:104px;border-radius:52px;
  background:linear-gradient(160deg,#FFFFFF,#FFF8DD);
  box-shadow:0 0 0 3px #FFCF24,0 18px 34px -16px rgba(120,90,0,.45),0 0 40px rgba(255,207,36,.35),inset 0 2px 0 #fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hscr .tap .oval svg{width:30px;height:30px}
.hscr .tap .oval b{font:700 34px/1 Poppins;letter-spacing:-.03em;color:#111114}
.hscr .tap .home{position:absolute;left:50%;bottom:7px;width:92px;height:4px;margin-left:-46px;border-radius:3px;background:#111}
.hscr .lit{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 35%,rgba(40,30,20,0) 60%,rgba(40,30,20,.07) 100%),
             linear-gradient(118deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.10) 52%,rgba(255,255,255,0) 64%);
  box-shadow:inset 0 0 7px rgba(0,0,0,.28),inset 0 0 2px rgba(0,0,0,.35)}
/* the card's bottom edge runs (390,783)→(806,818) in the source: 4.8deg; its shadow falls on the glass below it */
.hscr .cs{position:absolute;left:-20px;top:136px;width:330px;height:30px;transform-origin:0 0;transform:rotate(4.8deg);
  background:linear-gradient(to bottom,rgba(12,14,30,.34),rgba(12,14,30,0));filter:blur(3px)}

/* ── frame 1 variants, #1-1 … #1-8 (Faisal, 23 Sep): the hands, phone and card cut off the wall (cut-hero.py) and set
   on a blurred liquid-glass ground of soft mixed light; eight tap-ready screen designs, the yellow toned down ── */
.gbg{position:absolute;inset:0;overflow:hidden;background:#F3F1EE}
.gbg .bl{position:absolute;border-radius:50%}
.gbg .disc{position:absolute;left:40px;top:430px;width:600px;height:600px;border-radius:50%;
  background:linear-gradient(150deg,rgba(255,255,255,.42),rgba(255,255,255,.12));backdrop-filter:blur(26px) saturate(140%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 0 0 1.5px rgba(255,255,255,.45),0 50px 90px -50px rgba(40,40,70,.25)}
.cut{position:absolute;left:-70px;top:0;width:800px;height:1434px}
.cut > img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 28px 36px rgba(30,30,60,.22)) drop-shadow(0 6px 10px rgba(30,30,60,.12))}
.scrn{position:absolute;inset:0;overflow:hidden;filter:blur(.35px) contrast(.96) brightness(.98) saturate(.96)}
.scrn .home{position:absolute;left:50%;bottom:7px;width:92px;height:4px;margin-left:-46px;border-radius:3px;background:#111}
.scrn.dark .home{background:#EDEDED}
.scrn .amt{font:700 34px/1 Poppins;letter-spacing:-.03em;color:#111114}
.scrn svg.fx{position:absolute;left:0;top:0;width:265.3px;height:579.3px;overflow:visible}
.scrn .ctr{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>
<div class="frame" id="f"></div>
<script>
/* app-card crops from make-assets.sh: 785 × 1320, cut from his 923 × 2000 export */
const A = k => `../assets/app/app${k}.png`;
/* his v1 copy, verbatim; frame 1's copy is new and waits on his approval */
const COPY = {
  1: { kick:'Contactless', a:'Take card payments', b:'on your phone.', sub:'Your customer taps their card on your phone.', chips:[] },
  2: { kick:'Take a payment', a:'Charge it in', b:'three taps.', sub:'Type the amount and hit charge.', chips:['Card','Tap','Payment link'] },
  3: { kick:'NeroPOS', a:'Your menu,', b:'on the till.', sub:'Photos, descriptions and prices. Tap the dish and it goes to the kitchen.', chips:['Photos','Modifiers','Table map'] },
  4: { kick:'Transactions', a:'Every sale,', b:'one list.', sub:'Terminal, till, web and bookings, as they happen.', chips:['Terminal','Till','Web','Bookings'] },
  5: { kick:'Reports', a:'See what sold,', b:'and where.', sub:'Split by channel, for any date range.', chips:['By channel','Card & cash','Any dates'] },
  6: { kick:'Payment links', a:'Send a link.', b:'Get paid.', sub:'The customer does not have to be in front of you.', chips:['72-hour expiry','One-time use','By email'] }
};
const copy = c => `<img class="wm" src="assets/wordmark-light.png" alt="neropay"><div class="rule"></div>
  <div class="kick">${c.kick}</div><h1><span>${c.a}</span><span class="two">${c.b}</span></h1>
  <div class="blk"><div class="sub">${c.sub}</div>
  ${c.chips.length ? `<div class="chips">${c.chips.map(t=>`<div class="chip"><i></i>${t}</div>`).join('')}</div>` : ''}</div>`;
const glass = (k,x,y,w) => `<div class="glass" style="left:${x}px;top:${y}px;width:${w}px"><div class="shot"><img src="${A(k)}" alt=""></div></div>`;
const sbar = `<div class="sbar"><div class="t">9:41</div><div class="isl"></div><div class="r"><b style="height:7px"></b><b style="height:10px"></b><b style="height:13px"></b><b style="height:16px"></b><b class="bat"></b></div></div>`;
const phone = (k,x,y,w) => `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px"><div class="scr">${sbar}<img src="${A(k)}" alt=""></div></div>`;
/* lift(k, crop x,y,w,h in app-card px, placed at X,Y with width W) */
const lift = (k,cx,cy,cw,ch,X,Y,W) => { const s = W/cw;
  return `<div class="lift" style="left:${X}px;top:${Y}px;width:${W}px;height:${(ch*s).toFixed(1)}px">
    <img src="${A(k)}" style="width:${(785*s).toFixed(1)}px;left:${(-cx*s).toFixed(1)}px;top:${(-cy*s).toFixed(1)}px" alt=""></div>`; };

/* the art sits where his v1 device sat. Phone: 488 wide at x 86, top 492 (screen image from y 568, scale .591).
   Glass: 560 wide at x 50, top 486 (image from x 65 / y 501, scale .675). Each lift covers its own original. */
const ART = {
  1: () => `<div class="photo"><div class="hscr">
      <div class="tap">
        <div class="bloom by"></div><div class="bloom bb"></div><div class="bloom bb2"></div>
        <svg class="rings" viewBox="0 0 265.3 579.3">${[1.32,1.66,2.04,2.46].map((k,i)=>
          `<ellipse cx="132.65" cy="352" rx="${(95*k).toFixed(1)}" ry="${(52*k).toFixed(1)}" fill="none"
             stroke="rgba(245,190,20,${[.75,.5,.3,.16][i]})" stroke-width="${[2.4,2,1.6,1.3][i]}"/>`).join('')}</svg>
        <div class="oval">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round">
            <path d="M6.5 8.5a5 5 0 0 1 0 7"/><path d="M10 6a9 9 0 0 1 0 12"/><path d="M13.5 3.5a13 13 0 0 1 0 17"/></svg>
          <b>£45.75</b></div>
        <div class="home"></div>
      </div>
      <div class="lit"></div><div class="cs"></div></div><img src="assets/hero-keyed.png" alt=""></div>`,
  2: () => glass(1,50,486,560),
  3: () => phone(2,86,492,488) + lift(2,402,543,345,377,320,872,270),
  4: () => glass(3,50,486,560) + lift(3,0,335,785,190,35,716,590),
  5: () => phone(4,86,492,488) + lift(4,20,752,370,132,50,998,300) + lift(4,254,282,300,66,240,727,260),
  6: () => phone(5,86,492,488) + lift(5,25,150,735,125,80,642,500)
};

/* ── frame 1 variants ── */
const CL = (c='#111114', w=2) => `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"><path d="M6.5 8.5a5 5 0 0 1 0 7"/><path d="M10 6a9 9 0 0 1 0 12"/><path d="M13.5 3.5a13 13 0 0 1 0 17"/></svg>`;
const CX = 132.65, CY = 360;                       /* the screen's visible centre, below the card */
const ell = (ks, rx, ry, col, ws, dash='') => `<svg class="fx" viewBox="0 0 265.3 579.3">${ks.map((k,i)=>
  `<ellipse cx="${CX}" cy="${CY}" rx="${(rx*k).toFixed(1)}" ry="${(ry*k).toFixed(1)}" fill="none" stroke="${col[i]}" stroke-width="${ws[i]}" ${dash}/>`).join('')}</svg>`;
const bloom = (x,y,w,c) => `<div class="bl" style="position:absolute;border-radius:50%;left:${x}px;top:${y}px;width:${w}px;height:${w}px;background:radial-gradient(closest-side,${c},rgba(255,255,255,0))"></div>`;
const SCREENS = {
  /* 1 — calm pill: white, ink outline, grey ripples, one small yellow dot */
  1: () => `<div class="scrn" style="background:#FAFAF8">${bloom(-40,220,300,'rgba(255,214,90,.16)')}${bloom(80,380,280,'rgba(130,160,255,.14)')}
      ${ell([1.3,1.62,1.98,2.4],95,52,['rgba(17,17,20,.16)','rgba(17,17,20,.11)','rgba(17,17,20,.07)','rgba(17,17,20,.045)'],[1.4,1.2,1.1,1])}
      <div class="ctr" style="top:${CY-52}px;height:104px"><div style="width:190px;height:104px;border-radius:52px;background:#fff;box-shadow:0 0 0 1.5px #111114,0 16px 30px -18px rgba(17,17,20,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${CL()}<b class="amt">£45.75</b></div></div>
      <i style="position:absolute;left:${CX-4}px;top:${CY+66}px;width:8px;height:8px;border-radius:50%;background:#FFCF24"></i><div class="home"></div></div>`,
  /* 2 — round: a white disc, soft lilac-blue ripples */
  2: () => `<div class="scrn" style="background:#F5F6FB">${bloom(-60,250,320,'rgba(170,150,255,.22)')}${bloom(60,330,300,'rgba(120,170,255,.18)')}
      <svg class="fx" viewBox="0 0 265.3 579.3">${[1.35,1.75,2.2,2.7].map((k,i)=>`<circle cx="${CX}" cy="${CY}" r="${(70*k).toFixed(1)}" fill="none" stroke="rgba(110,120,230,${[.28,.18,.11,.06][i]})" stroke-width="1.4"/>`).join('')}</svg>
      <div class="ctr" style="top:${CY-70}px;height:140px"><div style="width:140px;height:140px;border-radius:50%;background:#fff;box-shadow:0 18px 36px -18px rgba(60,60,140,.4),inset 0 0 0 1px rgba(17,17,20,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${CL('#4A55C8')}<b class="amt" style="font-size:30px">£45.75</b></div></div><div class="home"></div></div>`,
  /* 3 — dark: ink screen, a thin warm outline, white ripples */
  3: () => `<div class="scrn dark" style="background:#141418">${bloom(-70,240,320,'rgba(255,200,60,.14)')}${bloom(70,360,300,'rgba(110,140,255,.18)')}
      ${ell([1.3,1.62,1.98,2.4],95,52,['rgba(255,255,255,.22)','rgba(255,255,255,.14)','rgba(255,255,255,.08)','rgba(255,255,255,.045)'],[1.4,1.2,1.1,1])}
      <div class="ctr" style="top:${CY-52}px;height:104px"><div style="width:190px;height:104px;border-radius:52px;background:rgba(255,255,255,.06);box-shadow:0 0 0 1.5px rgba(255,207,36,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${CL('#FFFFFF')}<b class="amt" style="color:#fff">£45.75</b></div></div><div class="home"></div></div>`,
  /* 4 — the symbol large in a pale disc, the amount under it as plain type */
  4: () => `<div class="scrn" style="background:#FBFAF6">${bloom(-20,200,300,'rgba(255,214,90,.20)')}${bloom(70,420,260,'rgba(140,170,255,.14)')}
      <div class="ctr" style="top:215px;height:250px"><div style="width:120px;height:120px;border-radius:50%;background:#FFF4CF;box-shadow:0 0 0 12px rgba(255,236,170,.35),0 0 0 26px rgba(255,236,170,.16);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#111114" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a5 5 0 0 1 0 7"/><path d="M10 6a9 9 0 0 1 0 12"/><path d="M13.5 3.5a13 13 0 0 1 0 17"/></svg></div>
      <b class="amt" style="margin-top:34px;font-size:40px">£45.75</b></div><div class="home"></div></div>`,
  /* 5 — pastel pink to blue, a frosted pill, white signal arcs rising towards the card */
  5: () => `<div class="scrn" style="background:linear-gradient(170deg,#FBEFF4 0%,#F2EEFA 45%,#E9F0FD 100%)">${bloom(-60,230,300,'rgba(255,170,205,.30)')}${bloom(60,360,320,'rgba(140,175,255,.28)')}
      <svg class="fx" viewBox="0 0 265.3 579.3">${[60,88,116].map((r,i)=>`<path d="M ${CX-r} ${CY-40} A ${r} ${r*.7} 0 0 1 ${CX+r} ${CY-40}" fill="none" stroke="rgba(255,255,255,${[.95,.75,.5][i]})" stroke-width="${[3,2.6,2.2][i]}" stroke-linecap="round"/>`).join('')}</svg>
      <div class="ctr" style="top:${CY-10}px;height:90px"><div style="width:200px;height:84px;border-radius:42px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);box-shadow:inset 0 1.5px 0 #fff,0 0 0 1px rgba(255,255,255,.7),0 16px 30px -16px rgba(90,80,160,.35);display:flex;align-items:center;justify-content:center"><b class="amt">£45.75</b></div></div><div class="home"></div></div>`,
  /* 6 — halo: a soft light behind a large amount, nothing else but the symbol */
  6: () => `<div class="scrn" style="background:#FAFAFA">
      <div style="position:absolute;left:${CX-170}px;top:${CY-170}px;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,221,120,.55),rgba(255,221,120,.18) 45%,rgba(150,175,255,.20) 70%,rgba(250,250,250,0))"></div>
      <div class="ctr" style="top:${CY-60}px;height:120px">${CL('#111114',1.8)}<b class="amt" style="font-size:44px">£45.75</b></div><div class="home"></div></div>`,
  /* 7 — a black pill, dashed grey ripples */
  7: () => `<div class="scrn" style="background:#F2F2F4">${bloom(-40,240,300,'rgba(255,214,90,.14)')}${bloom(80,380,280,'rgba(130,160,255,.14)')}
      ${ell([1.3,1.62,1.98,2.4],95,52,['rgba(17,17,20,.28)','rgba(17,17,20,.2)','rgba(17,17,20,.13)','rgba(17,17,20,.08)'],[1.4,1.3,1.2,1.1],'stroke-dasharray="3 6" stroke-linecap="round"')}
      <div class="ctr" style="top:${CY-48}px;height:96px"><div style="width:186px;height:96px;border-radius:48px;background:#111114;box-shadow:0 18px 32px -16px rgba(17,17,20,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">${CL('#FFCF24',2)}<b class="amt" style="color:#fff">£45.75</b></div></div><div class="home"></div></div>`,
  /* 8 — big signal arcs in a soft yellow-to-pink gradient, a small amount pill under them */
  8: () => `<div class="scrn" style="background:#FBFAF8">${bloom(-40,230,300,'rgba(255,200,170,.18)')}${bloom(70,400,280,'rgba(140,170,255,.14)')}
      <svg class="fx" viewBox="0 0 265.3 579.3"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7C948"/><stop offset="1" stop-color="#F29BB8"/></linearGradient></defs>
      ${[34,62,90].map((r,i)=>`<path d="M ${CX-r*.9} ${CY-10-r*.55} A ${r} ${r} 0 0 1 ${CX+r*.9} ${CY-10-r*.55}" transform="rotate(0)" fill="none" stroke="url(#ag)" stroke-opacity="${[1,.75,.5][i]}" stroke-width="${[7,6,5][i]}" stroke-linecap="round"/>`).join('')}</svg>
      <div class="ctr" style="top:${CY+20}px;height:70px"><div style="padding:12px 26px;border-radius:40px;background:#fff;box-shadow:0 0 0 1px rgba(17,17,20,.08),0 14px 26px -16px rgba(17,17,20,.35)"><b class="amt" style="font-size:32px">£45.75</b></div></div><div class="home"></div></div>`
};
/* four grounds of mixed, blurred light; every one stays pale behind the copy, top left */
const THEMES = {
  a: `${bloom(260,-200,700,'rgba(255,214,90,.55)')}${bloom(-260,700,760,'rgba(255,196,120,.35)')}${bloom(320,900,620,'rgba(255,236,170,.4)')}`,
  b: `${bloom(300,-160,660,'rgba(255,170,205,.45)')}${bloom(-280,640,780,'rgba(140,175,255,.40)')}${bloom(260,980,620,'rgba(200,170,255,.35)')}`,
  c: `${bloom(280,-200,680,'rgba(255,214,90,.45)')}${bloom(-300,560,760,'rgba(195,165,255,.35)')}${bloom(250,960,660,'rgba(130,170,255,.38)')}`,
  d: `${bloom(300,-180,660,'rgba(140,180,255,.40)')}${bloom(-280,700,760,'rgba(255,214,110,.40)')}${bloom(280,960,620,'rgba(255,175,200,.28)')}`
};
const HERO_THEME = { 1:'a', 2:'b', 3:'c', 4:'a', 5:'b', 6:'d', 7:'c', 8:'d' };

/* ── frame 1, screen 5 with the mark (Faisal picked #1-5; #1-5-1 … #1-5-10 place the two bars) ── */
const MARKP = ['21.3,0 36.1,0 83.5,49.2 83.5,70.1', '16.7,33.2 16.7,50.4 63.9,100 80.9,100'];   /* from brand/favicon */
let gid = 0;
const mark = (x, y, w, fill, opts = {}) => { const id = 'mg' + (gid++);
  const glass = fill === 'glass';
  const f = glass ? `url(#${id})` : fill;
  return `<svg viewBox="0 0 100 100" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${w}px;overflow:visible;${opts.style||''}">
    ${glass ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient></defs>` : ''}
    ${MARKP.map(pt => `<polygon points="${pt}" fill="${f}" ${glass ? 'stroke="rgba(255,255,255,.95)" stroke-width="1.2" stroke-linejoin="round"' : ''} ${opts.op ? `opacity="${opts.op}"` : ''}/>`).join('')}</svg>`; };
const GLOW = 'filter:drop-shadow(0 3px 6px rgba(90,80,160,.28))';
const PILL = (inner, extra='') => `<div style="width:200px;height:84px;border-radius:42px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);box-shadow:inset 0 1.5px 0 #fff,0 0 0 1px rgba(255,255,255,.7),0 16px 30px -16px rgba(90,80,160,.35);display:flex;align-items:center;justify-content:center;gap:10px;position:relative;${extra}">${inner}</div>`;
const ARCS = (op=1) => `<svg class="fx" viewBox="0 0 265.3 579.3">${[60,88,116].map((r,i)=>`<path d="M ${CX-r} ${CY-40} A ${r} ${r*.7} 0 0 1 ${CX+r} ${CY-40}" fill="none" stroke="rgba(255,255,255,${[.95,.75,.5][i]*op})" stroke-width="${[3,2.6,2.2][i]}" stroke-linecap="round"/>`).join('')}</svg>`;
const S5 = (under, arcs, pill, over='') => `<div class="scrn" style="background:linear-gradient(170deg,#FBEFF4 0%,#F2EEFA 45%,#E9F0FD 100%)">${bloom(-60,230,300,'rgba(255,170,205,.30)')}${bloom(60,360,320,'rgba(140,175,255,.28)')}
  ${under}${arcs}<div class="ctr" style="top:${CY-10}px;height:90px">${pill}</div>${over}<div class="home"></div></div>`;
const AMT = '<b class="amt">£45.75</b>';
const MARKS = {
  /* 1 — a small white glass mark leading the amount inside the pill */
  1: () => S5('', ARCS(), PILL(`<span style="position:relative;width:28px;height:28px">${mark(0,0,28,'#D9D4F2',{style:'filter:drop-shadow(0 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 2px 4px rgba(90,80,160,.35))'})}</span>${AMT}`)),
  /* 2 — a large glass mark behind everything, a watermark in the glass */
  2: () => S5(mark(22,190,220,'glass',{op:.55,style:'filter:drop-shadow(0 6px 14px rgba(90,80,160,.18))'}), ARCS(.8), PILL(AMT)),
  /* 3 — the mark in yellow, small, sitting on top of the pill like a badge */
  3: () => S5('', ARCS(), PILL(AMT), mark(CX-15, CY-26, 30, '#FFCF24', {style:'filter:drop-shadow(0 2px 4px rgba(150,110,0,.3))'})),
  /* 4 — the signal comes out of the mark: yellow mark at the arcs' origin */
  4: () => S5('', ARCS(), PILL(AMT), mark(CX-17, CY-62, 34, '#FFCF24', {style:'filter:drop-shadow(0 2px 5px rgba(150,110,0,.3))'})),
  /* 5 — a quiet white glass mark above the home indicator */
  5: () => S5('', ARCS(), PILL(AMT), mark(CX-15, 516, 30, 'glass', {style:'filter:drop-shadow(0 2px 5px rgba(90,80,160,.45))'})),
  /* 6 — a liquid glass tile with the yellow bars, the app icon, where the arcs start */
  6: () => S5('', ARCS(), PILL(AMT), `<div style="position:absolute;left:${CX-26}px;top:${CY-88}px;width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.5));backdrop-filter:blur(6px);box-shadow:inset 0 1.5px 0 #fff,0 0 0 1px rgba(255,255,255,.8),0 10px 20px -10px rgba(90,80,160,.4)">${mark(9,9,34,'#FFCF24')}</div>`),
  /* 7 — the two bars replace the arcs: big glass bars over the pill */
  7: () => S5('', mark(CX-70, CY-160, 140, 'glass', {style:'filter:drop-shadow(0 8px 16px rgba(90,80,160,.25))'}), PILL(AMT)),
  /* 8 — the yellow mark trailing the amount in the pill */
  8: () => S5('', ARCS(), PILL(`${AMT}<span style="position:relative;width:24px;height:24px">${mark(0,0,24,'#FFCF24')}</span>`)),
  /* 9 — a big faint yellow mark washed into the screen's light */
  9: () => S5(mark(-10,150,290,'#FFCF24',{op:.13}), ARCS(), PILL(AMT)),
  /* 10 — embossed into the pill's glass, white on white, the amount beside it */
  10: () => S5('', ARCS(), PILL(`<span style="position:relative;width:30px;height:30px">${mark(0,0,30,'#F4F2FB',{style:'filter:drop-shadow(0 1.5px 0 rgba(255,255,255,1)) drop-shadow(0 -1.5px 1px rgba(90,80,160,.55))'})}</span>${AMT}`))
};
const heroVariant = (v, m) => `<div class="gbg">${THEMES[HERO_THEME[v]]}<div class="disc"></div></div>
  <div class="cut"><div class="hscr">${m ? MARKS[m]() : SCREENS[v]()}<div class="lit"></div><div class="cs"></div></div><img src="assets/hero-cut.png" alt=""></div>`;
const [n, v, m] = (location.hash.slice(1) || '1').split('-').map(Number);
const fr = document.getElementById('f');
fr.className = 'frame is' + n;
/* frame 1 draws the art first so the copy sits above the hands; #1-k is one of the cut-out variants */
fr.innerHTML = n === 1 ? (v ? heroVariant(v, m) : ART[1]()) + copy(COPY[1]) : copy(COPY[n]) + ART[n]();
</script>
</body>
</html>
