<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=886, height=1920" />
<script src="vendor/gsap.min.js"></script>
<script src="stills/assets/photo-quads.js"></script>
<style>
/* NeroPay — App Store app preview, iPhone portrait 886x1920, 29s. v6, 23 Sep 2026.
   Built on the carousel stills Faisal signed off the same day: every section is one of those slides, laid out at
   the stills' own 660 x 1434 and scaled to the frame (the two share Apple's 0.46 aspect). The film swipes through
   them like the carousel itself: the slide pulls back into a card, slides across to the next one on its own
   pink-and-blue ground, and pushes back in; the art trails the copy a little, so the swipe has depth.
   Inside each slide something happens — the contactless signal goes out, keys are pressed, a finger taps a dish and
   the card lifts out of the screen, a row, a total and a field lift out. The hands and the glass outlines are baked
   from the stills page (node stills/render.cjs layers → assets/v6/), because their shadows and the photo screen's
   softening are CSS filters, and a filter on anything that moves is what made v1 flicker. The grounds, the copy,
   the hero's screen, the taps and the lifts are live, with no filter on any of them.
   Kept from v5: the Shutter up at the head, the swish that draws down into the mark on the glass tile, and the
   white close. */
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-400-normal.woff2)format("woff2");font-weight:400;font-display:block}
:root{--ang:46.5deg;--yel:#FFCF24;--ink:#111114}
html,body{width:886px;height:1920px;overflow:hidden;background:#E9E7EC}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;width:886px;height:1920px;overflow:hidden}
.clip{position:absolute;inset:0}

/* behind the cards, seen only while the film pulls back between slides */
.back{background:radial-gradient(60% 40% at 90% 8%,rgba(255,170,205,.35),rgba(255,170,205,0)),
  radial-gradient(70% 45% at 5% 92%,rgba(140,175,255,.35),rgba(140,175,255,0)),linear-gradient(170deg,#EDEBEF,#E4E4EA)}

/* the stage: the stills' 660 x 1434, scaled to 886 wide (1925 tall, 2.5px lost top and bottom) */
#stage{position:absolute;left:0;top:-2.5px;width:660px;height:1434px;transform-origin:0 0;transform:scale(1.342424)}
#deck{position:absolute;left:0;top:0;width:660px;height:1434px;transform-origin:0 0}
.sl{position:absolute;top:0;width:660px;height:1434px;overflow:hidden;background:#F3F1EE}
.gr{position:absolute;inset:0}
.bl{position:absolute;border-radius:50%}
.disc{position:absolute;border-radius:50%;
  background:linear-gradient(150deg,rgba(255,255,255,.46),rgba(255,255,255,.14));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 0 0 1.5px rgba(255,255,255,.45),0 50px 90px -50px rgba(40,40,70,.25)}
.artp,.cpp{position:absolute;inset:0}
.art{position:absolute;inset:0}
.lay{position:absolute;left:-120px;top:0;width:900px;height:1434px}

/* the copy, the stills' layout */
.wm{position:absolute;left:49px;top:66px;width:114px}
.rule{position:absolute;left:49px;top:122px;width:40px;height:5px;border-radius:3px;background:var(--yel);transform-origin:0 50%}
.kick{position:absolute;left:49px;top:144px;font:500 13px Poppins;letter-spacing:.16em;text-transform:uppercase;color:#66666C}
h1{position:absolute;left:39px;right:30px;top:176px;font:700 58px/1.0 Poppins;letter-spacing:-.035em;color:var(--ink)}
h1 .ln{display:block;overflow:hidden;padding:0 0 .08em 10px;margin-bottom:-.08em}
h1 .ln > span{display:inline-block;position:relative}
h1 .ln.two > span{isolation:isolate}
h1 .mk{position:absolute;left:-6px;right:-8px;bottom:.05em;height:.40em;background:var(--yel);border-radius:3px;z-index:-1;transform-origin:0 50%}
.blk{position:absolute;left:49px;right:34px;top:310px}
.sub{font:400 15.5px/1.45 Poppins;color:#56565C}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.95);
  font:600 12px Poppins;color:#1E1E22;box-shadow:0 6px 14px -8px rgba(17,18,20,.28),inset 0 0 0 1px rgba(17,17,20,.05)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--yel)}

/* the hero's screen, live: the white tap screen Faisal picked (stills #1-5-2) */
.hs{position:absolute;left:196.7px;top:421.6px;width:265.3px;height:579.3px;background:#fff;overflow:hidden}
.hs svg{position:absolute;left:0;top:0;width:265.3px;height:579.3px;overflow:visible}
.hs .pill{position:absolute;left:32.65px;top:290px;width:200px;height:84px;border-radius:42px;background:#fff;
  box-shadow:0 0 0 1px rgba(17,17,20,.10),0 14px 28px -18px rgba(17,17,20,.30);display:flex;align-items:center;justify-content:center}
.hs .pill b{font:700 34px/1 Poppins;letter-spacing:-.03em;color:#111114}
.hs .mark{position:absolute;left:112.65px;top:448px;width:40px;height:40px}
.hs .home{position:absolute;left:50%;bottom:7px;width:92px;height:4px;margin-left:-46px;border-radius:3px;background:#111}

/* taps: a press on a key, a ring going out from a fingertip */
.press{position:absolute;border-radius:14px;background:rgba(17,17,20,.16);opacity:0}
#kc{background:rgba(255,255,255,.30);border-radius:0 0 14px 14px}   /* CHARGE is black: its press lightens */
.ring{position:absolute;border-radius:50%;border:2.5px solid rgba(255,207,36,.95);opacity:0;
  box-shadow:0 0 0 3px rgba(255,207,36,.25)}

/* a piece of the screen lifted out over the art; on the flat glass screens the place it came from goes blank */
.hole{position:absolute;background:#fff;opacity:0}
.lift{position:absolute;overflow:hidden;border-radius:14px;background:#fff;transform-origin:0 0;opacity:0;
  box-shadow:0 40px 70px -30px rgba(17,17,20,.50),0 10px 22px -12px rgba(17,17,20,.30),inset 0 0 0 1px rgba(17,17,20,.06)}
.lift img{position:absolute;display:block}

/* the keypad's amount, live: it starts at £0.00 and fills in with each key, over a blank where the export's figure was */
.amtpatch{position:absolute;background:#fff}
.amt{position:absolute;text-align:center;font:700 86px/1 Poppins;letter-spacing:-.035em;color:#2A2F38;transform-origin:50% 60%}
/* pop-ups: short notes that come up around the phone, one feature each */
.pop{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 17px 9px 9px;border-radius:19px;white-space:nowrap;
  background:rgba(255,255,255,.95);font:600 16px/1.1 Poppins;letter-spacing:-.01em;color:#111114;opacity:0;transform-origin:50% 50%;
  box-shadow:0 22px 40px -18px rgba(17,17,20,.38),0 5px 12px -7px rgba(17,17,20,.22),inset 0 0 0 1px rgba(17,17,20,.05),inset 0 1.5px 0 #fff}
.pop i{width:34px;height:34px;border-radius:11px;background:var(--yel);display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.pop i svg{width:19px;height:19px;fill:none;stroke:#111114;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ── the Shutter: the seam is the mark's own 46.5deg ── */
.shut{position:absolute;left:50%;top:50%;width:4400px;height:4400px;margin:-2200px 0 0 -2200px;transform:rotate(var(--ang));transform-origin:50% 50%;z-index:40;pointer-events:none}
.shut .half{position:absolute;left:0;width:100%;height:calc(50% + 2px);background:var(--yel)}
.shut .half.t{top:0}.shut .half.b{top:50%}

/* ── the close (v5): white, a clear liquid glass tile carrying the mark's two yellow bars, the wordmark ── */
.close{background:#FBFAF7;z-index:38;overflow:hidden}
.swish{z-index:45;pointer-events:none}.swish svg{position:absolute;left:0;top:0;overflow:visible}.swish polygon{fill:var(--yel)}
.close .tile{position:absolute;left:233px;top:650px;width:420px;height:420px;border-radius:24%;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.92) 0%,rgba(246,246,248,.55) 48%,rgba(236,237,241,.62) 100%);
  box-shadow:0 60px 110px -40px rgba(17,17,20,.30),0 18px 36px -18px rgba(17,17,20,.16),
    inset 0 2px 0 rgba(255,255,255,1),inset 0 0 0 1.5px rgba(255,255,255,.85),inset 0 0 0 14px rgba(255,255,255,.30),
    inset 0 0 34px rgba(17,17,20,.08),inset 0 -3px 6px rgba(17,17,20,.05);
  outline:1px solid rgba(17,17,20,.07);outline-offset:-1px}
.close .tile::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%)}
.close .tile::after{content:"";position:absolute;left:12%;right:12%;bottom:5px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,1),rgba(255,255,255,0))}
.close .tile .sheen{position:absolute;inset:-10%;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 62%);transform:translateX(-120%)}
.close .wm{position:absolute;left:213px;top:1150px;width:460px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="29" data-width="886" data-height="1920">

  <div class="clip back" id="back" data-start="0" data-duration="26.4" data-track-index="0">
    <div id="stage" data-layout-allow-overflow><div id="deck" data-layout-allow-overflow></div></div>
  </div>

  <div class="clip close" id="close" data-start="25.75" data-duration="3.25" data-track-index="2">
    <div class="tile" id="ctile"><div class="sheen" id="csheen"></div></div>
    <img class="wm" id="cwm" src="assets/wordmark-light.png" alt="neropay">
  </div>

  <!-- the outro in one motion: two yellow bands swish in over the last slide, cover the frame, and draw down
       into the two bars of the mark on the glass tile -->
  <div class="clip swish" id="swish" data-start="24.8" data-duration="4.2" data-track-index="5">
    <svg viewBox="0 0 886 1920" width="886" height="1920" data-layout-allow-overflow>
      <polygon id="mb1" points="0,0 0,0 0,0 0,0"/>
      <polygon id="mb2" points="0,0 0,0 0,0 0,0"/>
    </svg>
  </div>

  <!-- the Shutter, up at the head -->
  <div class="clip shut" id="shut" data-start="0" data-duration="29" data-track-index="4">
    <div class="half t" id="sht" data-layout-allow-overflow></div>
    <div class="half b" id="shb" data-layout-allow-overflow></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const A = k => `assets/app/app${k}.png`;
/* the stills' copy, verbatim */
const COPY = [
  { kick:'Contactless', a:'Take card payments', b:'on your phone.', sub:'Your customer taps their card on your phone.', chips:[] },
  { kick:'Take a payment', a:'Charge it in', b:'three taps.', sub:'Type the amount and hit charge.', chips:['Card','Tap','Payment link'] },
  { kick:'NeroPOS', a:'Your menu,', b:'on the till.', sub:'Photos, descriptions and prices. Tap the dish and it goes to the kitchen.', chips:['Photos','Modifiers','Table map'] },
  { kick:'Transactions', a:'Every sale,', b:'one list.', sub:'Terminal, till, web and bookings, as they happen.', chips:['Terminal','Till','Web','Bookings'] },
  { kick:'Reports', a:'See what sold,', b:'and where.', sub:'Split by channel, for any date range.', chips:['By channel','Card & cash','Any dates'] },
  { kick:'Payment links', a:'Send a link.', b:'Get paid.', sub:'The customer does not have to be in front of you.', chips:['72-hour expiry','One-time use','By email'] }
];
/* the stills' grounds: blurred pink-and-blue light, each slide mixed differently, the top-left pale behind the copy */
const bloom = (x,y,w,c) => `<div class="bl" data-layout-allow-overflow style="left:${x}px;top:${y}px;width:${w}px;height:${w}px;background:radial-gradient(closest-side,${c},rgba(255,255,255,0))"></div>`;
const disc = (x,y,d) => `<div class="disc bl" data-layout-allow-overflow style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"></div>`;
const GROUND = [
  bloom(300,-160,660,'rgba(255,170,205,.45)') + bloom(-280,640,780,'rgba(140,175,255,.40)') + bloom(260,980,620,'rgba(200,170,255,.35)') + disc(40,430,600),
  bloom(360,-180,640,'rgba(255,170,205,.42)') + bloom(-300,700,760,'rgba(140,175,255,.40)') + bloom(300,1000,600,'rgba(200,170,255,.32)') + disc(60,560,560),
  bloom(340,-150,620,'rgba(140,175,255,.40)') + bloom(-320,520,700,'rgba(255,170,205,.36)') + bloom(280,1050,560,'rgba(255,214,110,.26)') + disc(-160,820,520),
  bloom(380,-100,560,'rgba(200,170,255,.40)') + bloom(260,560,700,'rgba(140,175,255,.34)') + bloom(-260,1000,680,'rgba(255,170,205,.38)') + disc(200,420,560),
  bloom(300,300,700,'rgba(255,170,205,.34)') + bloom(0,1050,800,'rgba(140,175,255,.38)') + bloom(420,-220,520,'rgba(255,214,110,.26)') + disc(90,700,620),
  bloom(360,-200,680,'rgba(140,175,255,.42)') + bloom(240,880,700,'rgba(255,170,205,.38)') + bloom(-340,420,640,'rgba(200,170,255,.30)') + disc(-120,500,540)
];

/* ── the photo slides' geometry, exactly as stills/index.html places it ── */
function hcoef(w, h, q) {
  const src = [[0,0],[w,0],[w,h],[0,h]], M = [], B = [];
  for (let i = 0; i < 4; i++) { const [x,y] = src[i], [u,v] = q[i];
    M.push([x,y,1,0,0,0,-u*x,-u*y]); B.push(u); M.push([0,0,0,x,y,1,-v*x,-v*y]); B.push(v); }
  for (let c = 0; c < 8; c++) { let m = c; for (let r = c+1; r < 8; r++) if (Math.abs(M[r][c]) > Math.abs(M[m][c])) m = r;
    [M[c],M[m]] = [M[m],M[c]]; [B[c],B[m]] = [B[m],B[c]];
    for (let r = 0; r < 8; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k < 8; k++) M[r][k] -= f*M[c][k]; B[r] -= f*B[c]; } }
  return B.map((b,i) => b / M[i][i]);
}
const PHOTO = { 2:'pos', 4:'reports', 5:'links' };        /* slide index → photo */
function geo(name) {
  const Q = PHOTOQ[name].quad, q = [Q.tl, Q.tr, Q.br, Q.bl];
  const top = Math.min(Q.tl[1], Q.tr[1]), bot = Math.max(Q.bl[1], Q.br[1]);
  const s = Math.max(640 / (bot - top), 954 / (2000 - top) + .005);
  const cx = (Q.tl[0] + Q.tr[0] + Q.br[0] + Q.bl[0]) / 4;
  const ox = 330 - cx * s, oy = 480 - top * s;
  const wq = (Math.hypot(Q.tr[0]-Q.tl[0], Q.tr[1]-Q.tl[1]) + Math.hypot(Q.br[0]-Q.bl[0], Q.br[1]-Q.bl[1])) / 2;
  const hq = (Math.hypot(Q.bl[0]-Q.tl[0], Q.bl[1]-Q.tl[1]) + Math.hypot(Q.br[0]-Q.tr[0], Q.br[1]-Q.tr[1])) / 2;
  const CW = 400, CH = Math.round(CW * hq / wq), h = hcoef(CW, CH, q);
  /* an app-card pixel (784 wide) → the stage: the screen's status bar is 44px, the card 400/784 of its own size */
  const map = (ax, ay) => { const x = ax * 400/784, y = 44 + ay * 400/784, d = h[6]*x + h[7]*y + 1;
    const X = (h[0]*x + h[1]*y + h[2]) / d, Y = (h[3]*x + h[4]*y + h[5]) / d; return [ox + X*s, oy + Y*s]; };
  return { map };
}
/* the bounding box on the stage of an app-card rectangle */
function box(g, cx, cy, cw, ch) {
  const p = [g.map(cx,cy), g.map(cx+cw,cy), g.map(cx+cw,cy+ch), g.map(cx,cy+ch)];
  const xs = p.map(v=>v[0]), ys = p.map(v=>v[1]);
  return { x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) };
}
/* the glass slides: glass(k,x,y,w,{top}) in the stills — the screenshot's origin and scale on the stage */
const GLASS = { 1:{ x:80, y:501 + 22*(500/784), s:500/784 }, 3:{ x:73, y:501 + 14*(514/784), s:514/784 } };
const gmap = (k, ax, ay) => [GLASS[k].x + ax*GLASS[k].s, GLASS[k].y + ay*GLASS[k].s];

/* lift(k, crop in app-card px, target x,y,w on the stage, source box on the stage) */
let LIFTS = [];
function lift(slide, k, cx, cy, cw, ch, X, Y, W, src, at, rot = 0) {
  const s = W/cw, id = `lf${slide}_${LIFTS.length}`;
  LIFTS.push({ id, slide, X, Y, W, src, at, rot });
  return `<div class="lift" id="${id}" data-layout-allow-overflow style="left:${X}px;top:${Y}px;width:${W}px;height:${(ch*s).toFixed(1)}px">
    <img src="${A(k)}" style="width:${(784*s).toFixed(1)}px;left:${(-cx*s).toFixed(1)}px;top:${(-cy*s).toFixed(1)}px" alt=""></div>`;
}
const ring = (id, x, y, d = 70) => `<div class="ring" id="${id}" data-layout-allow-overflow style="left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px"></div>`;
const press = (id, x, y, w, h) => `<div class="press" id="${id}" data-layout-allow-overflow style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`;

/* ── timing: the swipes, and when each slide lands ── */
const SW = [4.2, 8.45, 12.7, 16.95, 21.2], D = 1.05;
const LAND = [0.45, ...SW.map(t => t + D)];

/* ── build the slides ── */
const GAP = 48, PITCH = 660 + GAP;
const deck = $('deck');
const G = { 2:geo('pos'), 4:geo('reports'), 5:geo('links') };
COPY.forEach((c, k) => {
  const L = LAND[k];
  let art = '', over = '';
  if (k === 0) {
    const CX = 132.65, PY = 332;
    art = `<div class="hs" id="hs">
        <svg viewBox="0 0 265.3 579.3">${[60,88,116].map((r,i)=>`<path id="arc${i}" d="M ${CX-r} ${PY-48} A ${r} ${r*.7} 0 0 1 ${CX+r} ${PY-48}" fill="none" stroke="rgba(17,17,20,${[.16,.10,.06][i]*1.7})" stroke-width="${[3,2.6,2.2][i]}" stroke-linecap="round"/>`).join('')}</svg>
        ${ring('hring', CX, PY, 200)}
        <div class="pill" id="hpill"><b>£45.75</b></div>
        <svg class="mark" id="hmark" viewBox="0 0 100 100"><polygon points="21.3,0 36.1,0 83.5,49.2 83.5,70.1" fill="#FFCF24"/><polygon points="16.7,33.2 16.7,50.4 63.9,100 80.9,100" fill="#FFCF24"/></svg>
        <div class="home"></div></div>
      <img class="lay" src="assets/v6/L1h.png" alt="">`;
  } else if (k === 1) {
    const K = [['k4',20,568,173,180],['k5',225,568,173,180],['k7',20,780,173,180],['kc',20,1207,363,147]];
    art = `<img class="lay" src="assets/v6/L2a.png" alt="">` +
      K.map(([id,x,y,w,h]) => { const [X,Y] = gmap(1,x,y); const s = GLASS[1].s;
        return press(id, X, Y, w*s, h*s) + ring('r'+id, X + w*s/2, Y + h*s/2, 64); }).join('');
    const [px, py] = gmap(1, 100, 160), gs = GLASS[1].s;
    art += `<div class="amtpatch" style="left:${px}px;top:${py}px;width:${500*gs}px;height:${150*gs}px"></div>
      <div class="amt" id="amt" style="left:${px}px;top:${py + 12}px;width:${500*gs}px">£0.00</div>`;
    const [sx, sy] = gmap(1, 110, 165);
    art += `<div class="hole" id="ho1" style="left:${sx}px;top:${sy}px;width:${470*GLASS[1].s}px;height:${135*GLASS[1].s}px"></div>`;
    over = lift(1, 1, 110, 165, 470, 135, sx - 470*GLASS[1].s*.1, sy - 135*GLASS[1].s*.1 - 4, 470*GLASS[1].s*1.2, { x:sx, y:sy, w:470*GLASS[1].s }, L + 2.25, -2);
  } else if (k === 3) {
    art = `<img class="lay" src="assets/v6/L4a.png" alt="">`;
    const [sx, sy] = gmap(3, 0, 335);
    art += `<div class="hole" id="ho3" style="left:${sx}px;top:${sy}px;width:${784*GLASS[3].s}px;height:${190*GLASS[3].s}px"></div>`;
    over = lift(3, 3, 0, 335, 784, 190, 38, 712, 584, { x:sx, y:sy, w:784*GLASS[3].s }, L + 0.95);
  } else {
    const name = PHOTO[k], g = G[k];
    let fx = '';
    if (k === 2) {
      const [x, y] = g.map(560, 1190); fx = ring('ptap', x, y, 60);
      over = lift(2, 2, 402, 936, 344, 376, 360, 800, 250, box(g, 402, 936, 344, 376), L + 1.15, 3);
    } else if (k === 4) {
      over = lift(4, 4, 20, 752, 370, 132, 36, 1010, 300, box(g, 20, 752, 370, 132), L + 0.85, -2)
           + lift(4, 4, 254, 282, 300, 66, 360, 690, 250, box(g, 254, 282, 300, 66), L + 1.3, 2);
    } else {
      const [x, y] = g.map(546, 1208); fx = ring('ltap', x, y, 60);
      over = lift(5, 5, 25, 150, 735, 125, 70, 612, 520, box(g, 25, 150, 735, 125), L + 1.3, -1.5);
    }
    art = `<img class="lay" src="assets/v6/L${k+1}s.png" alt="">${fx}<img class="lay" src="assets/v6/L${k+1}h.png" alt="">`;
  }
  const el = document.createElement('div');
  el.className = 'sl'; el.id = 'sl' + k; el.style.left = (k * PITCH) + 'px';
  el.setAttribute('data-layout-allow-overflow', '');
  el.innerHTML = `<div class="gr" id="gr${k}">${GROUND[k]}</div>
    <div class="artp" id="ap${k}"><div class="art" id="art${k}">${art}</div>${over}</div>
    <div class="cpp" id="cp${k}">
      <img class="wm" src="assets/wordmark-light.png" alt="neropay"><div class="rule" id="ru${k}"></div>
      <div class="kick" id="ki${k}" data-layout-allow-overlap>${c.kick}</div>
      <h1><span class="ln"><span id="la${k}" data-layout-allow-overlap>${c.a}</span></span><span class="ln two"><span id="lb${k}" data-layout-allow-overlap><i class="mk" id="mk${k}"></i>${c.b}</span></span></h1>
      <div class="blk"><div class="sub" id="su${k}" data-layout-allow-overlap>${c.sub}</div>
      ${c.chips.length ? `<div class="chips">${c.chips.map((t,j)=>`<div class="chip" id="ch${k}_${j}" data-layout-allow-overlap><i></i>${t}</div>`).join('')}</div>` : ''}</div>
    </div>`;
  deck.appendChild(el);
});

/* ── the pop-ups: stage position, when (after the slide lands), icon, words. Product facts only: no rate, no price,
   and nothing Eray has not confirmed (the flat rate and Amex are open questions, generation-pack.md) ── */
const IC = {
  pay:   '<path d="M8 9.5a4 4 0 0 1 0 5"/><path d="M11.5 7a8 8 0 0 1 0 10"/><path d="M15 4.5a12 12 0 0 1 0 15"/>',
  keys:  '<circle cx="6" cy="6" r="1.2"/><circle cx="12" cy="6" r="1.2"/><circle cx="18" cy="6" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="6" cy="18" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/>',
  card:  '<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10.5h18"/><path d="M7 15h3"/>',
  grid:  '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  bag:   '<path d="M6 8h12l-1.2 12H7.2L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  phone: '<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 17.5h2"/>',
  bolt:  '<path d="M13 3L5.5 13.5H11L10 21l7.5-10.5H12L13 3z"/>',
  sync:  '<path d="M19.5 12a7.5 7.5 0 0 1-13 5"/><path d="M4.5 12a7.5 7.5 0 0 1 13-5"/><path d="M17.5 3.5V7H14"/><path d="M6.5 20.5V17H10"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.6 2.5 14.4 0 17"/><path d="M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>'
};
const POPS = [
  [0, 196, 912, 2.20, 'pay',   'Take payments anywhere'],
  [1, 400, 452, 0.25, 'keys',  'Type any amount'],
  [1, 40, 1210, 2.35, 'card',  'Card, tap or link'],
  [2, 26, 610, 0.35, 'grid',   'POS built in'],
  [2, 418, 548, 1.75, 'bag',   'Online orders'],
  [2, 36, 1190, 2.15, 'phone', 'Take orders from your phone'],
  [3, 330, 512, 0.30, 'bolt',  'Updates as you sell'],
  [3, 300, 1220, 1.80, 'card', 'Visa & Mastercard'],
  [4, 236, 1260, 1.90, 'sync', 'Works with Xero & QuickBooks'],
  [5, 380, 1110, 1.05, 'check','Link sent'],
  [5, 44, 1246, 1.85, 'globe', 'Customer pays online']
];
POPS.forEach(([k, x, y, dt, ic, txt], j) => {
  $('ap' + k).insertAdjacentHTML('beforeend', `<div class="pop" id="pop${j}" data-layout-allow-overflow style="left:${x}px;top:${y}px"><i><svg viewBox="0 0 24 24">${IC[ic]}</svg></i><span data-layout-allow-overlap>${txt}</span></div>`);
});

/* the keypad's amount as the keys go in: the pence first, the way a till fills */
const L1 = LAND[1];
const AMT = [[L1 + 0.5, '£0.04'], [L1 + 0.8, '£0.45'], [L1 + 1.1, '£4.57'], [L1 + 1.4, '£45.75']];
const amtEl = $('amt');

/* ── the swipe: a pure function of time ── */
const eio = u => u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
const clamp = u => Math.max(0, Math.min(1, u));
const slides = [...document.querySelectorAll('.sl')];
const blooms = slides.map(s => [...s.querySelectorAll('.bl')]);
function apply(t) {
  let v = '£0.00'; AMT.forEach(([at, s]) => { if (t >= at) v = s; });
  if (amtEl.textContent !== v) amtEl.textContent = v;
  amtEl.style.visibility = t >= L1 + 2.3 ? 'hidden' : 'visible';        /* the lift carries it from here */
  let p = 0, pull = 0;
  SW.forEach(s => { const u = clamp((t - s) / D); p += eio(u); pull += Math.sin(Math.PI * u); });
  const z = 1 - 0.17 * pull;                    /* the card pulls back to 83% mid-swipe and pushes back in */
  deck.style.transform = `translate(330px,717px) scale(${z.toFixed(4)}) translate(${(-330 - p*PITCH).toFixed(2)}px,-717px)`;
  slides.forEach((el, k) => {
    const o = k - p;
    el.style.visibility = Math.abs(o) < 1.3 ? 'visible' : 'hidden';
    /* clip-path, not only overflow:hidden with a radius: the renderer let a composited child escape that clip
       during the first swipe (a yellow sliver at the top of the frame), and clip-path cuts every layer */
    el.style.borderRadius = (pull * 60).toFixed(1) + 'px';
    el.style.clipPath = `inset(0 round ${(pull * 60).toFixed(1)}px)`;
    el.style.boxShadow = `0 ${(pull*40).toFixed(1)}px ${(pull*80).toFixed(1)}px -${(pull*30).toFixed(1)}px rgba(40,40,70,${(pull*.35).toFixed(3)})`;
    /* depth: the art trails the card, the copy a little less */
    $('ap' + k).style.transform = `translateX(${(o * 78).toFixed(2)}px)`;
    $('cp' + k).style.transform = `translateX(${(o * 26).toFixed(2)}px)`;
    /* the light drifts, each bloom on its own clock */
    blooms[k].forEach((b, j) => { const f = .23 + j*.07, ph = k*1.7 + j*2.1;
      b.style.transform = `translate(${(Math.sin(t*f+ph)*34 + o*-30).toFixed(1)}px,${(Math.cos(t*f*.8+ph)*28).toFixed(1)}px)`; });
  });
}

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const clock = { t:0 };
tl.to(clock, { t:29, duration:29, ease:'none', onUpdate:() => apply(clock.t) }, 0);
apply(0);

/* ── each slide as it lands: the copy builds, the art settles, then the slide's own moment ── */
COPY.forEach((c, k) => {
  const L = LAND[k], c0 = k === 0 ? 0.55 : L - 0.3;
  tl.fromTo('#ru'+k, { scaleX:0 }, { scaleX:1, duration:0.45, ease:'power3.out' }, c0)
    .fromTo('#ki'+k, { y:10, opacity:0 }, { y:0, opacity:1, duration:0.45, ease:'power3.out' }, c0+0.05)
    .fromTo('#la'+k, { yPercent:115 }, { yPercent:0, duration:0.7, ease:'power4.out' }, c0+0.10)
    .fromTo('#lb'+k, { yPercent:115 }, { yPercent:0, duration:0.7, ease:'power4.out' }, c0+0.22)
    .fromTo('#mk'+k, { scaleX:0 }, { scaleX:1, duration:0.55, ease:'power3.inOut' }, c0+0.62)
    .fromTo('#su'+k, { y:12, opacity:0 }, { y:0, opacity:1, duration:0.5, ease:'power3.out' }, c0+0.42);
  c.chips.forEach((_, j) => tl.fromTo(`#ch${k}_${j}`, { y:12, opacity:0, scale:.9 },
    { y:0, opacity:1, scale:1, duration:0.45, ease:'back.out(1.7)' }, c0+0.6+j*0.07));
  /* the art: photographs punch in from a touch closer and ease back, then drift in through the hold; the glass
     outlines rise and turn into place. Photographs only ever scale up from their foot, so the arms never leave
     the frame's bottom edge */
  const glassy = k === 1 || k === 3;
  const next = k < SW.length ? SW[k] + D*0.6 : 26;
  if (glassy) {
    tl.fromTo('#art'+k, { y:170, rotation:5, scale:.93, transformOrigin:'330px 900px' },
                        { y:0, rotation:0, scale:1, duration:1.15, ease:'back.out(1.3)' }, L - 0.75)
      .to('#art'+k, { scale:1.025, duration: next - (L + 0.4), ease:'none' }, L + 0.4);
  } else {
    tl.fromTo('#art'+k, { scale:1.09, transformOrigin:'330px 1434px' },
                        { scale:1, duration:1.4, ease:'power3.out' }, k === 0 ? 0 : L - 0.7)
      .to('#art'+k, { scale:1.035, duration: next - (L + 0.7), ease:'none' }, L + 0.7);
  }
});

/* the hero: the amount comes up, the contactless signal goes out from it three times, the mark lands */
tl.fromTo('#hpill', { scale:.7, opacity:0 }, { scale:1, opacity:1, duration:0.55, ease:'back.out(2)' }, 0.75);
[0,1,2].forEach(i => tl.fromTo('#arc'+i, { opacity:0 }, { opacity:1, duration:0.2 }, 1.05 + i*0.12));
for (let c = 0; c < 3; c++) {
  const t0 = 1.35 + c*0.95;
  [0,1,2].forEach(i => tl.to('#arc'+i, { opacity:.25, duration:0.22, ease:'power1.in' }, t0 + i*0.12)
                         .to('#arc'+i, { opacity:1, duration:0.35, ease:'power1.out' }, t0 + i*0.12 + 0.22));
  tl.fromTo('#hring', { scale:.45, opacity:.9 }, { scale:1.55, opacity:0, duration:0.85, ease:'power2.out', immediateRender:c===0 }, t0);
}
tl.fromTo('#hmark', { scale:.5, opacity:0, transformOrigin:'50% 50%' }, { scale:1, opacity:1, duration:0.5, ease:'back.out(2.2)' }, 1.5);

/* the keypad: 4, 5, 7, 5, then CHARGE; the amount fills in live and lifts off the screen */
AMT.forEach(([at]) => tl.fromTo('#amt', { scale:1.06 }, { scale:1, duration:0.25, ease:'power2.out', immediateRender:false }, at));
[['k4',0.5],['k5',0.8],['k7',1.1],['k5',1.4],['kc',1.9]].forEach(([id,dt],i) => {
  const t0 = L1 + dt;
  tl.fromTo('#'+id, { opacity:0 }, { opacity:1, duration:0.07, immediateRender:false }, t0)
    .to('#'+id, { opacity:0, duration:0.28, ease:'power1.out' }, t0 + 0.12)
    .fromTo('#r'+id, { scale:.35, opacity:.95 }, { scale:1.5, opacity:0, duration:0.55, ease:'power2.out', immediateRender:false }, t0);
});
LIFTS.forEach(({ slide, at }) => { if ($('ho'+slide)) tl.fromTo('#ho'+slide, { opacity:0 }, { opacity:1, duration:0.25, ease:'power1.out' }, at + 0.05); });
/* the pop-ups come up one at a time, then drift */
POPS.forEach(([k, x, y, dt], j) => {
  const at = LAND[k] + dt;
  tl.fromTo('#pop'+j, { opacity:0, scale:.6, y:18 }, { opacity:1, scale:1, y:0, duration:0.55, ease:'back.out(1.9)' }, at)
    .to('#pop'+j, { y:-7, duration:2.4, ease:'sine.inOut' }, at + 0.55);
});
/* taps on the photographs */
tl.fromTo('#ptap', { scale:.3, opacity:.95 }, { scale:1.7, opacity:0, duration:0.6, ease:'power2.out' }, LAND[2] + 0.75)
  .fromTo('#ltap', { scale:.3, opacity:.95 }, { scale:1.7, opacity:0, duration:0.6, ease:'power2.out' }, LAND[5] + 0.85);
/* the lifts: each starts over its own place on the screen and comes forward, larger, turned a little */
LIFTS.forEach(({ id, X, Y, W, src, at, rot }) => {
  tl.fromTo('#'+id, { x:src.x - X, y:src.y - Y, scale:src.w / W, rotation:0, opacity:0 },
    { x:0, y:0, scale:1, rotation:rot, opacity:1, duration:0.75, ease:'back.out(1.4)' }, at)
    .to('#'+id, { y:-10, duration:2.2, ease:'sine.inOut' }, at + 0.75);
});

/* ── the Shutter: up at the head ── */
tl.set('#sht',{y:'0%'},0).set('#shb',{y:'0%'},0)
  .to('#sht',{ y:'-105%', duration:0.60, ease:'power2.inOut' }, 0.0)
  .to('#shb',{ y:'105%',  duration:0.60, ease:'power2.inOut' }, 0.0);

/* ── the swish and the close, from v5 ── */
const AN = 46.5*Math.PI/180, DIR = [Math.cos(AN), Math.sin(AN)], NRM = [Math.sin(AN), -Math.cos(AN)], C = [443, 960];
const at = (along, across) => [C[0]+DIR[0]*along+NRM[0]*across, C[1]+DIR[1]*along+NRM[1]*across];
const mk = (u,v) => [283+u*3.2, 700+v*3.2];
const str = pts => pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const B1 = [mk(21.3,0), mk(36.1,0), mk(83.5,49.2), mk(83.5,70.1)];
const B2 = [mk(16.7,33.2), mk(16.7,50.4), mk(63.9,100), mk(80.9,100)];
const toAC = p => [(p[0]-C[0])*DIR[0]+(p[1]-C[1])*DIR[1], (p[0]-C[0])*NRM[0]+(p[1]-C[1])*NRM[1]];
function swishBand(B, sgn, off){
  const ac = B.map(toAC);
  const am = ac.reduce((m,q)=>m+q[0],0)/ac.length;
  const inner = sgn>0 ? Math.min(...ac.map(q=>q[1])) : Math.max(...ac.map(q=>q[1]));
  return ac.map(([a,c],i) => at((a-am)*26, (i===0||i===3 ? 0 : (c-inner)*44) - sgn*3 + sgn*off));
}
const B1cover = swishBand(B1, 1, 0),  B1off = swishBand(B1, 1, 1500);
const B2cover = swishBand(B2,-1, 0),  B2off = swishBand(B2,-1, 1500);
tl.set('#mb1', { attr:{ points:str(B1off) } }, 0).set('#mb2', { attr:{ points:str(B2off) } }, 0)
  .to('#mb1', { attr:{ points:str(B1cover) }, duration:0.8, ease:'power1.in' }, 24.95)
  .to('#mb2', { attr:{ points:str(B2cover) }, duration:0.8, ease:'power1.in' }, 24.95)
  .to('#mb1', { attr:{ points:str(B1) }, duration:1.0, ease:'power3.out' }, 25.75)
  .to('#mb2', { attr:{ points:str(B2) }, duration:1.0, ease:'power3.out' }, 25.75);
tl.fromTo('#ctile', { y:40, scale:.9, opacity:0 }, { y:0, scale:1, opacity:1, duration:0.6, ease:'power3.out' }, 26.05)
  .fromTo('#csheen', { xPercent:-120 }, { xPercent:120, duration:0.9, ease:'power2.inOut' }, 26.75)
  .fromTo('#cwm', { y:18, opacity:0 }, { y:0, opacity:1, duration:0.5, ease:'power3.out' }, 26.75);

window.__timelines['main'] = tl;
</script>
