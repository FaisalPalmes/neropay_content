<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=886, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
/* NeroPay — App Store app preview, iPhone portrait 886x1920, 26s.
   Built from Faisal's five exported carousel screens. Each screen is split into three bands
   (wordmark / copy / device) so the layout can move without re-typesetting his artwork.
   The Shutter (BRAND-MOTION.md) opens, cuts between screens and closes: seam at 46.5deg, never 45. */
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
html,body{width:886px;height:1920px;overflow:hidden;background:#EFEFEC}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
:root{
  /* the mark's geometry, copied from social/templates/stage.css — do not round to 45 */
  --ang:46.5deg; --tile-r:15.5%;
  --yel:#FFCF24; --ink:#111114;
}
#root{position:relative;width:886px;height:1920px;overflow:hidden}
.clip{position:absolute;inset:0}

/* ── the ground the bands sit on: the screens' own paper, so a moving band never shows a hole ── */
.ground{background:
  radial-gradient(120% 70% at 96% 12%, rgba(255,207,36,.22), rgba(255,207,36,0) 62%),
  radial-gradient(90% 50% at 4% 40%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
  linear-gradient(168deg,#F1F0EC 0%,#EFEEE9 42%,#E7E8EA 100%)}
.bloom{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.bloom.b{width:520px;height:520px;left:-160px;top:980px;background:rgba(120,160,255,.22)}
.bloom.p{width:460px;height:460px;left:560px;top:1380px;background:rgba(255,150,190,.16)}
.bloom.y{width:620px;height:620px;left:420px;top:-160px;background:rgba(255,207,36,.30)}

/* ── the three bands, at the proportions they were cut at (923px source → 886px frame) ── */
.head{position:absolute;left:0;top:0;width:886px;height:173px;z-index:6}
.head img{width:100%;display:block}
.bodyband{position:absolute;left:0;top:163px;width:886px;height:466px;z-index:5;will-change:transform,opacity}
.bodyband img{width:100%;display:block}
.devwrap{position:absolute;left:0;top:629px;width:886px;height:1291px;z-index:4;
  perspective:1700px;perspective-origin:50% 26%}
.dev{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform,opacity}
.devzoom{position:absolute;inset:0;overflow:hidden;will-change:transform}
.devzoom img{width:100%;display:block;filter:drop-shadow(0 46px 60px rgba(17,18,20,.18))}

/* ── the Shutter: a rotated wrapper, so the seam is the mark's own 46.5deg ── */
.shut{position:absolute;left:-60%;top:-60%;width:220%;height:220%;transform:rotate(var(--ang));
  transform-origin:50% 50%;z-index:40;pointer-events:none}
.shut .half{position:absolute;left:0;width:100%;height:50%;background:var(--yel);will-change:transform}
.shut .half.t{top:0}
.shut .half.b{top:50%}
.sweep{position:absolute;left:-60%;top:-60%;width:220%;height:220%;transform:rotate(var(--ang));
  transform-origin:50% 50%;z-index:41;pointer-events:none}
.sweep .panel.dark{background:var(--ink)}
.sweep .panel{position:absolute;left:0;top:-100%;width:100%;height:100%;background:var(--yel);will-change:transform}

/* ── the close: the mark lands on the join, ink on yellow (the one ground yellow may be) ── */
.markwrap{position:absolute;left:0;top:0;width:886px;height:1920px;z-index:52;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.tile{width:404px;height:404px;border-radius:var(--tile-r);overflow:hidden;position:relative;
  background:linear-gradient(150deg,#FCFCFD 0%,#E8EAEE 52%,#DDE0E6 100%);
  box-shadow:0 40px 70px -24px rgba(17,18,20,.42), inset 0 0 0 2px rgba(255,255,255,.75);
  will-change:transform,opacity}
.tile img{position:absolute;left:-2%;top:-2%;width:104%;height:104%;object-fit:cover}
.tile .sheen{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 34%,rgba(255,255,255,.72) 50%,rgba(255,255,255,0) 66%);
  transform:translateX(-120%);will-change:transform}

/* ── the end card ── */
.endcard{background:var(--ink);z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:40px;padding-top:1112px}
.endcard .wm{width:500px;will-change:transform,opacity}
.endcard .line{font-size:34px;font-weight:500;line-height:1.45;color:rgba(255,255,255,.80);
  text-align:center;max-width:620px;will-change:transform,opacity}
.endcard .rule{width:96px;height:7px;border-radius:4px;background:var(--yel);will-change:transform}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="886" data-height="1920">

  <div class="clip ground" id="ground" data-start="0" data-duration="26" data-track-index="0">
    <div class="bloom y" id="by" data-layout-allow-overflow></div>
    <div class="bloom b" id="bb" data-layout-allow-overflow></div>
    <div class="bloom p" id="bp" data-layout-allow-overflow></div>
  </div>

  <!-- the wordmark band is one object across all five screens: it never re-enters -->
  <div class="clip" id="headclip" data-start="0" data-duration="24.4" data-track-index="1">
    <div class="head" id="head"><img src="assets/bands/head1.png" alt=""></div>
  </div>

  <div class="clip" id="sc1" data-start="0.30" data-duration="4.67" data-track-index="2">
    <div class="bodyband" id="b1"><img src="assets/bands/body1.png" alt=""></div>
    <div class="devwrap"><div class="dev" id="d1"><div class="devzoom" id="z1"><img src="assets/bands/dev1.png" alt=""></div></div></div>
  </div>
  <div class="clip" id="sc2" data-start="4.85" data-duration="4.72" data-track-index="2">
    <div class="bodyband" id="b2"><img src="assets/bands/body2.png" alt=""></div>
    <div class="devwrap"><div class="dev" id="d2"><div class="devzoom" id="z2"><img src="assets/bands/dev2.png" alt=""></div></div></div>
  </div>
  <div class="clip" id="sc3" data-start="9.45" data-duration="4.72" data-track-index="2">
    <div class="bodyband" id="b3"><img src="assets/bands/body3.png" alt=""></div>
    <div class="devwrap"><div class="dev" id="d3"><div class="devzoom" id="z3"><img src="assets/bands/dev3.png" alt=""></div></div></div>
  </div>
  <div class="clip" id="sc4" data-start="14.05" data-duration="4.72" data-track-index="2">
    <div class="bodyband" id="b4"><img src="assets/bands/body4.png" alt=""></div>
    <div class="devwrap"><div class="dev" id="d4"><div class="devzoom" id="z4"><img src="assets/bands/dev4.png" alt=""></div></div></div>
  </div>
  <div class="clip" id="sc5" data-start="18.65" data-duration="5.75" data-track-index="2">
    <div class="bodyband" id="b5"><img src="assets/bands/body5.png" alt=""></div>
    <div class="devwrap"><div class="dev" id="d5"><div class="devzoom" id="z5"><img src="assets/bands/dev5.png" alt=""></div></div></div>
  </div>

  <!-- the cut: one panel sweeping the seam, between every screen -->
  <div class="clip sweep" id="sw" data-start="4.85" data-duration="20.8" data-track-index="3">
    <div class="panel" id="swp" data-layout-allow-overflow></div>
  </div>
  <div class="clip sweep" id="swk" data-start="25.0" data-duration="1.0" data-track-index="3" style="z-index:48">
    <div class="panel dark" id="swkp" data-layout-allow-overflow></div>
  </div>

  <!-- shutter up at the head, shutter down at the tail -->
  <div class="clip shut" id="shut" data-start="0" data-duration="26" data-track-index="4">
    <div class="half t" id="sht" data-layout-allow-overflow></div>
    <div class="half b" id="shb" data-layout-allow-overflow></div>
  </div>

  <div class="clip markwrap" id="mw" data-start="24.2" data-duration="1.8" data-track-index="5">
    <div class="tile" id="tile"><img src="assets/mark.png" alt=""><div class="sheen" id="sheen" data-layout-allow-overflow></div></div>
  </div>

  <div class="clip endcard" id="end" data-start="25.05" data-duration="0.95" data-track-index="6">
    <img class="wm" id="wm" src="assets/wordmark-white.png" alt="neropay">
    <div class="rule" id="erule"></div>
    <div class="line" id="eline">Card payments and your till,<br>in one app.</div>
  </div>

</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

/* The five screens. `at` is when the screen takes the frame — for screens two to five that is the
   instant the cut panel starts its sweep, so the screen is already standing when the panel clears it;
   the screen it replaces leaves 0.12s later, while the panel is still over it.
   `zx/zy` is the point the push-in is aimed at. */
const SCENES = [
  { i:1, at:0.30,  dur:4.67, zx:'50%', zy:'17%', first:true  },  /* the amount on the keypad   */
  { i:2, at:4.85,  dur:4.72, zx:'30%', zy:'58%'              },  /* a dish on the product grid */
  { i:3, at:9.45,  dur:4.72, zx:'50%', zy:'19%'              },  /* the first transaction row  */
  { i:4, at:14.05, dur:4.72, zx:'29%', zy:'63%'              },  /* the sales total            */
  { i:5, at:18.65, dur:5.75, zx:'66%', zy:'92%'              }   /* send payment link          */
];
const CUTS = [4.85, 9.45, 14.05, 18.65];
const REST = { rotateY:-9, rotateX:4.5, y:0, scale:1, opacity:1 };

/* the world breathes the whole way through */
tl.fromTo('#by',{x:0,y:0},{x:-70,y:60,duration:26,ease:'sine.inOut'},0)
  .fromTo('#bb',{x:0,y:0},{x:90,y:-80,duration:26,ease:'sine.inOut'},0)
  .fromTo('#bp',{x:0,y:0},{x:-60,y:-40,duration:26,ease:'sine.inOut'},0);

/* the wordmark band settles once behind the opening shutter and then holds */
tl.fromTo('#head',{y:-26,opacity:0},{y:0,opacity:1,duration:0.5,ease:'power3.out'},0.42);

SCENES.forEach(s => {
  const d = '#d'+s.i, z = '#z'+s.i, b = '#b'+s.i, t = s.at;

  if (s.first) {
    /* only the first screen is seen arriving: it rises out of the paper as the shutter opens */
    tl.fromTo(d, { y:96, rotateX:10, rotateY:-17, scale:0.93, opacity:0 },
                 { ...REST, duration:0.78, ease:'power3.out' }, t);
    tl.fromTo(b, { y:40, opacity:0, clipPath:'inset(0% 0% 100% 0%)' },
                 { y:0, opacity:1, clipPath:'inset(0% 0% 0% 0%)', duration:0.62, ease:'power3.out' }, t+0.14);
  } else {
    /* the rest are already standing when the panel wipes off them — a wipe reveals a shot, not a hole */
    tl.set(d, REST, t);
    /* the copy lands just after the panel clears, so the words read as arriving */
    tl.fromTo(b, { y:34, opacity:0, clipPath:'inset(0% 0% 100% 0%)' },
                 { y:0, opacity:1, clipPath:'inset(0% 0% 0% 0%)', duration:0.56, ease:'power3.out' }, t+0.30);
  }

  /* it keeps turning towards the viewer for the whole hold — never flat front-on, never still */
  const turnFrom = s.first ? t+0.78 : t+0.02;
  tl.to(d, { rotateY:-3.4, rotateX:2.6, y:-16, duration:(t+s.dur)-turnFrom-0.1, ease:'sine.inOut' }, turnFrom);

  /* one push-in per screen: quick in, hold, smooth out */
  const zin = s.first ? t+2.30 : t+1.95;
  tl.set(z, { transformOrigin:s.zx+' '+s.zy }, t)
    .to(z, { scale:1.46, duration:0.40, ease:'power4.out' }, zin)
    .to(z, { scale:1.0,  duration:0.68, ease:'power2.inOut' }, zin+1.30);
});

/* ── the Shutter ──────────────────────────────────────────────────────────────
   Up: the frame is the solid yellow tile and the two halves travel apart, perpendicular
   to the 46.5deg seam. Nothing else happens in those 0.6s.
   Down: 1.0s in, they meet, and the mark lands on the join. Screen five is still standing
   underneath while they close.                                                          */
tl.set('#sht',{y:'0%'}).set('#shb',{y:'0%'})
  .to('#sht',{ y:'-105%', duration:0.60, ease:'power2.inOut' }, 0.0)
  .to('#shb',{ y:'105%',  duration:0.60, ease:'power2.inOut' }, 0.0)
  .to('#sht',{ y:'0%', duration:1.00, ease:'power2.inOut' }, 23.30)
  .to('#shb',{ y:'0%', duration:1.00, ease:'power2.inOut' }, 23.30);

/* the cut: one panel sweeps the same seam between every screen */
CUTS.forEach(t => {
  tl.fromTo('#swp', { y:'0%' }, { y:'212%', duration:0.30, ease:'power2.inOut' }, t);
});

/* the mark lands on the join at the instant the halves meet, and rides through to the black card */
tl.fromTo('#tile', { y:24, opacity:0, scale:1.06 },
                   { y:0, opacity:1, scale:1, duration:0.44, ease:'power3.out' }, 24.28)
  .fromTo('#sheen', { x:'-120%' }, { x:'120%', duration:0.78, ease:'power2.inOut' }, 24.44)
  .to('#tile', { y:-340, scale:0.86, duration:0.55, ease:'power2.inOut' }, 25.05);

/* the black card arrives on the same seam, and the wordmark follows the mark in */
tl.fromTo('#swkp', { y:'0%' }, { y:'212%', duration:0.34, ease:'power2.inOut' }, 25.05)
  .fromTo('#wm', { y:18, opacity:0 }, { y:0, opacity:1, duration:0.42, ease:'power3.out' }, 25.34)
  .fromTo('#erule', { scaleX:0, transformOrigin:'50% 50%' }, { scaleX:1, duration:0.38, ease:'power3.out' }, 25.48)
  .fromTo('#eline', { y:14, opacity:0 }, { y:0, opacity:1, duration:0.40, ease:'power3.out' }, 25.56);

window.__timelines['main'] = tl;
</script>
</body>
</html>
