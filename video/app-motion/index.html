<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
/* v5 (24 Sep 2026), Faisal's notes on v4: the clear-glass look only; no flip anywhere (the menu swipes in); a fast
   entrance that eases into the middle; the glass behind is the mark's two bars, huge and cropped; a thicker phone.
   v4 (24 Sep 2026), Faisal's notes on v3: the phone stopped and started again (after it came in, and between moves),
   so the phone and camera now run on one continuous monotone spline through their poses; the finale is keypad in
   the centre, reports left, transactions right; the pink, blue and lilac light is gone for blurred yellow light
   moving behind glass, in two variants (textured reeded glass, and clear angled panes).
   NeroPay — app motion, light, v2 (24 Sep 2026). Faisal's notes on v1: too fast; make it 20–30s; let the tap
   screen hold with a subtle contactless animation; no screen cut off at the bottom; more time and slower,
   deliberate touches on every screen; after the transactions close-up, pull out to the whole screen; the payment
   link slower and seamless; the finale slower; end on the locked outro with "neropay.app" under the mark.
   So the moves between screens are now the app's own where they can be (a push, a swipe, a sheet), with one
   spin kept, and every export is finished off in code where it was cut: the CHARGE and TAP buttons, the
   snapshot card, the sheet's edge, and a home indicator on every screen.
   Rails: demo figures only, no rate, no price, no coins or counters of money. The phone's back is plain (a
   branded phone would be a prop). Nothing lifted out of a screen is a total. */
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-400-normal.woff2)format("woff2");font-weight:400;font-display:block}
:root{--yel:#FFCF24;--ink:#111114}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F1EA}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F1EA}
.clip{position:absolute;inset:0}

/* the ground: warm off-white, blurred yellow light that moves to a new place for every screen, seen through glass.
   Two variants from one file (window.BG): 'reeded' is textured liquid glass, the light broken up by vertical ribs
   (each rib shows the light magnified about its own centre, no filters) with grain; 'pane' is clear glass, three
   angled panes whose rims and a moving specular streak catch the light */
.ground{background:linear-gradient(170deg,#F6F3EC 0%,#EEEAE1 100%)}
.lset{position:absolute;left:0;top:0;width:1080px;height:1920px}
.lb{position:absolute;left:0;top:0;border-radius:50%}
.reed{position:absolute;top:0;height:1920px;overflow:hidden}
.reed .lset{transform-origin:0 0}
#ribs{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,rgba(255,255,255,.55) 3px,rgba(255,255,255,.14) 12px,rgba(255,255,255,0) 26px,rgba(90,70,20,.03) 44px,rgba(90,70,20,.085) 52px,rgba(255,255,255,0) 54px)}
#grain{position:absolute;inset:0;background:url(assets/grain.png) 0 0/1080px 1920px;mix-blend-mode:soft-light;opacity:.5}
#panes{position:absolute;inset:0;perspective:1600px}
.pn,#gmark{position:absolute;left:-380px;top:-300px;width:2400px;height:2400px;transform-origin:1300px 1200px}
.pn{border-radius:44px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.05) 45%,rgba(255,255,255,.16));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),inset 0 3px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(160,125,40,.16),0 50px 100px -50px rgba(120,95,30,.28)}
.pn i{position:absolute;top:-20%;bottom:-20%;left:-60%;width:220%;background:linear-gradient(105deg,rgba(255,255,255,0) 44%,rgba(255,255,255,.7) 49.5%,rgba(255,255,255,.18) 51%,rgba(255,255,255,0) 56%)}

/* the headline: the carousel's type, over a scrim of the ground so a close-up never fights it */
#hdz{z-index:10;pointer-events:none}
#scrim{position:absolute;left:0;right:0;top:0;height:470px;background:linear-gradient(180deg,rgba(246,243,236,.96) 0%,rgba(246,243,236,.9) 62%,rgba(246,243,236,0) 100%);opacity:0}
.hd{position:absolute;left:74px;right:60px;top:150px}
.kick{display:flex;align-items:center;gap:14px;font:600 22px/1 Poppins;letter-spacing:.16em;text-transform:uppercase;color:#6B6B75}
.kick i{display:block;width:34px;height:5px;border-radius:3px;background:var(--yel)}
h1{margin-top:22px;font:700 78px/1.0 Poppins;letter-spacing:-.035em;color:var(--ink)}
h1 .ln{display:block;overflow:hidden;padding:0 0 .08em 8px;margin:0 0 -.08em -8px}
h1 .ln > span{display:inline-block;position:relative;isolation:isolate}
h1 .mk{position:absolute;left:-6px;right:-8px;bottom:.06em;height:.38em;background:var(--yel);border-radius:3px;z-index:-1;transform-origin:0 50%}

/* the camera and the phone: a solid, front and back and a rounded metal band. Never opacity on a preserve-3d
   element (it flattens: video/LESSONS.md) */
.cam{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 52%}
#rig{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1050px}
.ph{position:absolute;left:270px;top:480px;width:540px;height:1140px;transform-style:preserve-3d;transform-origin:50% 50%}
.slice{position:absolute;inset:0;border-radius:88px}
.btn{position:absolute;width:8px;border-radius:4px}
.slice.sh{box-shadow:0 70px 110px -40px rgba(38,36,70,.42),0 20px 40px -20px rgba(38,36,70,.25)}
.front{position:absolute;inset:0;transform-style:flat;transform:translateZ(32px)}
.body{position:absolute;inset:0;border-radius:88px;background:#0B0B0D;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 0 7px #151517}
.body::after{content:"";position:absolute;inset:2px;border-radius:86px;box-shadow:inset 0 2px 1px rgba(255,255,255,.30),inset 0 -2px 2px rgba(0,0,0,.5)}
.back{position:absolute;inset:0;border-radius:88px;transform:translateZ(-32px) rotateY(180deg);
  background:linear-gradient(155deg,#2E2F34 0%,#18191C 55%,#26272B 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.10)}
.back .cams{position:absolute;left:44px;top:44px;width:190px;height:190px;border-radius:52px;background:linear-gradient(150deg,#34353A,#1C1D20);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.4)}
.back .cams i{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a4560,#07080c 65%);box-shadow:0 0 0 6px #0f1012}
.scr{position:absolute;left:16px;top:16px;width:508px;height:1108px;border-radius:72px;overflow:hidden;background:#fff;clip-path:inset(0 round 72px)}
.sbar{position:absolute;left:0;right:0;top:0;height:64px;z-index:5;background:#fff}
.sbar .t{position:absolute;left:52px;top:22px;font:600 22px Poppins;color:#111}
.sbar .isl{position:absolute;left:50%;top:14px;width:150px;height:44px;margin-left:-75px;border-radius:24px;background:#050506}
.sbar .r{position:absolute;right:46px;top:26px;display:flex;gap:5px;align-items:flex-end}
.sbar .r b{display:block;background:#111;border-radius:2px;width:5px}
.sbar .r b.bat{width:28px;height:13px;border-radius:4px;margin-left:6px}
.home{position:absolute;left:50%;bottom:13px;width:170px;height:6px;margin-left:-85px;border-radius:3px;background:rgba(17,17,20,.82);z-index:8}
.glare{position:absolute;inset:0;border-radius:72px;pointer-events:none;z-index:9;
  background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.14) 44%,rgba(255,255,255,0) 58%)}
.pane{position:absolute;inset:0;background:#fff}
.pane > img{position:absolute;left:0;top:64px;width:508px;display:block}
.cut{position:absolute;left:0;top:64px;width:508px;overflow:hidden}
.cut img{display:block;width:508px}
.dim{position:absolute;inset:0;background:#111114;opacity:0;z-index:4}

/* live pieces on the screens */
.patch{position:absolute;background:#fff}
.ext{position:absolute}
#amt{position:absolute;text-align:center;font:700 87px/1 Poppins;letter-spacing:-.035em;color:#2A2F38;transform-origin:50% 60%}
.press{position:absolute;border-radius:16px;background:rgba(17,17,20,.16);opacity:0}
.press.lt{background:rgba(255,255,255,.32)}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,207,36,.95);opacity:0;box-shadow:0 0 0 3px rgba(255,207,36,.25)}
.ring.soft{border-width:2px;border-color:rgba(255,207,36,.8);box-shadow:none}
svg.arcs{position:absolute;left:0;top:0;width:508px;height:1108px;overflow:visible}
.pill{position:absolute;left:84px;top:560px;width:340px;height:140px;border-radius:70px;background:#fff;
  box-shadow:0 0 0 1.5px rgba(17,17,20,.10),0 22px 44px -26px rgba(17,17,20,.35);display:flex;align-items:center;justify-content:center}
.pill b{font:700 58px/1 Poppins;letter-spacing:-.03em;color:#111114}
.mk2{position:absolute;left:220px;top:800px;width:68px;height:68px}
.note{position:absolute;left:18px;right:18px;top:78px;height:104px;border-radius:30px;z-index:6;
  background:rgba(24,24,28,.92);box-shadow:0 20px 40px -18px rgba(0,0,0,.55);display:flex;align-items:center;gap:16px;padding:0 22px}
.note i{width:56px;height:56px;border-radius:15px;background:var(--yel);flex:none;display:flex;align-items:center;justify-content:center}
.note .tx{display:flex;flex-direction:column;gap:4px}
.note .a{font:600 20px Poppins;color:#fff}
.note .b{font:400 18px Poppins;color:rgba(255,255,255,.72)}
#list{position:absolute;left:0;top:64px;width:508px}
#list img{display:block;width:508px}
#hl{position:absolute;left:0;width:508px;border-left:6px solid var(--yel);background:rgba(255,207,36,.10);opacity:0}
#cover{position:absolute;background:#fff;transform-origin:100% 50%}
#typed{position:absolute;font:400 17.5px/1 Poppins;color:#1F2430;white-space:nowrap}
#caret{display:inline-block;width:2px;height:20px;margin-left:1px;vertical-align:-3px;background:#2F6FEB}

/* what lifts out of the screen: a copy of the screen's own pixels, in the phone's 3D space */
.lift{position:absolute;background-repeat:no-repeat;background-size:508px auto;opacity:0;
  box-shadow:0 0 0 rgba(17,17,20,0)}

/* the finale: the two side phones, each in its own camera behind the main one */
.fcam{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 50%}

/* the end: the off-white wash that the outro plays on */
#fade{background:#FBF9F7;z-index:20;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="31.5" data-width="1080" data-height="1920">

  <div class="clip ground" id="ground" data-start="0" data-duration="31.5" data-track-index="0">
    <div class="lset" id="lights" data-layout-allow-overflow></div>
    <div id="reeds" data-layout-allow-overflow></div>
    <div id="panes" data-layout-allow-overflow></div>
  </div>

  <div class="clip" id="fin" data-start="23.0" data-duration="3.5" data-track-index="1">
    <div class="fcam" id="fcL" data-layout-allow-overflow></div>
    <div class="fcam" id="fcR" data-layout-allow-overflow></div>
  </div>

  <div class="clip cam" id="cam" data-start="0" data-duration="26.5" data-track-index="2">
    <div id="rig" data-layout-allow-overflow></div>
  </div>

  <div class="clip" id="hdz" data-start="0" data-duration="23.5" data-track-index="3">
    <div id="scrim"></div>
  </div>

  <!-- the end: the frame washes to the outro's off-white and stays up underneath it, the phones are gone before it
       starts, and the locked outro (brand/sting/outro.html, yellow, subtext "neropay.app") plays opaque with its
       letters meeting on beat 54, then the tile rises and the subtext slides out under it -->
  <div class="clip" id="fade" data-start="25.8" data-duration="5.7" data-track-index="4"></div>
  <video class="clip" id="outro" src="assets/outro-yellow-9x16-neropay-app.mp4" data-start="26.54" data-duration="4.96" data-track-index="5" muted playsinline style="width:100%;height:100%;object-fit:contain;z-index:21;background:#FBF9F7"></video>
</div>

<script>
const $ = id => document.getElementById(id);

/* store formats (make-formats.mjs sets window.FMT and the frame size): the ground and the wash fill the whole frame,
   the phones and headlines are the 1080 x 1920 layout scaled to fit and centred, and the outro is contained on its
   own off-white, so nothing is cropped at 886 x 1920 (iPhone) or 1200 x 1600 (iPad) */
if (window.FMT) { const [W, H] = window.FMT, k = Math.min(W / 1080, H / 1920), ox = (W - 1080*k) / 2, oy = (H - 1920*k) / 2;
  ['cam', 'fin', 'hdz'].forEach(id => Object.assign($(id).style, { width:'1080px', height:'1920px', right:'auto', bottom:'auto',
    transformOrigin:'0 0', transform:`translate(${ox}px,${oy}px) scale(${k})` })); }
const B = 60 / 118;                                   /* one beat of the bed */
const b = n => n * B;                                 /* beat n */
const S = 508 / 784;                                  /* the app-card export onto the screen */
const MARK = '<polygon points="21.3,0 36.1,0 83.5,49.2 83.5,70.1"/><polygon points="16.7,33.2 16.7,50.4 63.9,100 80.9,100"/>';
const TICK = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#111114" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const px = (x, y) => [x * S, 64 + y * S];            /* a point on an export, in screen space */
const box = (x, y, w, h) => { const [a, c] = px(x, y); return `left:${a}px;top:${c}px;width:${w*S}px;height:${h*S}px`; };
const ringAt = (id, x, y, d, cls = '') => { const [a, c] = px(x, y); return `<div class="ring ${cls}" id="${id}" style="left:${a-d/2}px;top:${c-d/2}px;width:${d}px;height:${d}px"></div>`; };

/* ── the headlines: the approved carousel copy, one per screen ── */
const COPY = [
  ['Take a payment', 'Charge it in', 'three taps.'],
  ['Contactless', 'Take card payments', 'on your phone.'],
  ['NeroPOS', 'Your menu,', 'on the till.'],
  ['Transactions', 'Every sale,', 'one list.'],
  ['Reports', 'See what sold,', 'and where.'],
  ['Payment links', 'Send a link.', 'Get paid.']
];
$('hdz').insertAdjacentHTML('beforeend', COPY.map(([k, a, c], i) =>
  `<div class="hd"><div class="kick" id="hk${i}" data-layout-allow-overlap><i></i>${k}</div>
   <h1><span class="ln" data-layout-allow-overflow><span id="ha${i}" data-layout-allow-overlap data-layout-allow-occlusion>${a}</span></span><span class="ln" data-layout-allow-overflow><span id="hb${i}" data-layout-allow-overlap data-layout-allow-occlusion><i class="mk" id="hm${i}"></i>${c}</span></span></h1></div>`).join(''));

/* ── the ground ── */
const BG = window.BG || 'pane';
/* the light: two yellows, a pale gold and a warm white, each moving to a new place on every screen change */
const LIGHT = [
  [1100, 'rgba(255,207,36,.50)', [[0,900,280],[3.3,820,560],[7.3,240,380],[10.6,880,1380],[13.7,280,1520],[15.6,800,420],[19.3,230,1260],[23.1,540,880],[31.5,540,960]]],
  [ 820, 'rgba(255,196,40,.36)', [[0,140,1520],[3.3,260,1300],[7.3,900,1540],[10.6,180,520],[13.7,860,380],[15.6,180,1520],[19.3,900,600],[23.1,180,1480],[31.5,880,1500]]],
  [ 640, 'rgba(255,226,120,.42)', [[0,560,1000],[3.3,420,860],[7.3,700,900],[10.6,520,980],[13.7,600,1000],[15.6,440,980],[19.3,660,1000],[23.1,860,420],[31.5,300,1200]]],
  [ 900, 'rgba(255,255,255,.70)', [[0,200,500],[3.3,160,700],[7.3,860,640],[10.6,300,1100],[13.7,760,1200],[15.6,300,760],[19.3,760,1100],[23.1,300,300],[31.5,540,1500]]]
];
const lset = () => LIGHT.map(([d, c], j) => `<div class="lb" data-j="${j}" style="width:${d}px;height:${d}px;background:radial-gradient(closest-side,${c},${c.replace(/[\d.]+\)$/, '0)')})"></div>`).join('');
const RIB = 54, NR = Math.ceil(1080 / RIB);
if (BG === 'reeded') {
  $('reeds').innerHTML = [...Array(NR)].map((_, i) => { const c = i*RIB + RIB/2, k = 1.28 + 0.07*Math.sin(i*1.7), dy = 7*Math.sin(i*0.9);
    return `<div class="reed" style="left:${i*RIB}px;width:${RIB}px"><div class="lset" style="transform:translate(${(RIB/2 - k*c).toFixed(2)}px,${dy.toFixed(2)}px) scaleX(${k.toFixed(3)})">${lset()}</div></div>`; }).join('')
    + '<div id="ribs"></div><div id="grain"></div>';
} else {
  $('lights').innerHTML = lset();
  /* the glass is the mark's two bars at 24x, tilted and cropped by the frame, so it reads as glass first and the
     logo only if you look for it: one bar's square end shows at the left edge, the rest runs off the frame */
  $('panes').innerHTML = `<div id="gmark"><svg viewBox="0 0 100 100" width="2400" height="2400" overflow="visible">
    <defs><linearGradient id="gfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".44"/><stop offset=".45" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity=".30"/></linearGradient>
      <linearGradient id="gspec" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="40"><stop offset=".44" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset=".52" stop-color="#fff" stop-opacity=".2"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="gclip">${MARK}</clipPath></defs>
    <g fill="none" stroke="rgba(160,120,20,.22)" stroke-width="0.12" transform="translate(0.14,0.2)">${MARK}</g>
    <g fill="url(#gfill)" stroke="rgba(255,255,255,.92)" stroke-width="0.14" stroke-linejoin="round">${MARK}</g>
    <g clip-path="url(#gclip)"><rect id="gsr" x="-100" y="-100" width="300" height="300" fill="url(#gspec)"/></g>
  </svg></div>`;
}
const LB = [...document.querySelectorAll('.lb')], GM = $('gmark'), GSR = $('gsr');

/* ── smooth motion: every continuous move is a monotone cubic through its poses, so speed ramps up and down
   without the dead stops that one tween easing into the next produced ── */
const mono = pts => { const n = pts.length, T = pts.map(p => p[0]), V = pts.map(p => p[1]), d = [], m = [];
  for (let i = 0; i < n - 1; i++) d[i] = (V[i+1] - V[i]) / (T[i+1] - T[i]);
  m[0] = d[0]; m[n-1] = d[n-2];
  for (let i = 1; i < n - 1; i++) { const h0 = T[i] - T[i-1], h1 = T[i+1] - T[i];
    m[i] = d[i-1] * d[i] <= 0 ? 0 : 3 * (h0 + h1) / ((2*h1 + h0) / d[i-1] + (h1 + 2*h0) / d[i]); }
  return t => { if (t <= T[0]) return V[0]; if (t >= T[n-1]) return V[n-1];
    let i = 0; while (t > T[i+1]) i++;
    const h = T[i+1] - T[i], u = (t - T[i]) / h, u2 = u*u, u3 = u2*u;
    return (2*u3 - 3*u2 + 1)*V[i] + (u3 - 2*u2 + u)*h*m[i] + (-2*u3 + 3*u2)*V[i+1] + (u3 - u2)*h*m[i+1]; }; };
const LP = LIGHT.map(([d, , w]) => [mono(w.map(p => [p[0], p[1]])), mono(w.map(p => [p[0], p[2]])), d]);

/* ── the phone ── */
/* v5: 64px deep (was 40), 26 layers so the band never shows gaps as it turns. The band is graphite with a polished
   chamfer caught at each edge and a softer sheen between; the last layers step in a touch so the edges round off.
   Side buttons are small stacks of their own. The front face and screen are unchanged, so every screen sits as before */
const T = 64, N = 26;
const band = () => [...Array(N)].map((_, i) => { const u = i/(N-1), z = -T/2 + 1 + u*(T-2), e = Math.abs(2*u - 1),
    k = 2.6 * Math.max(0, (e - 0.78) / 0.22) ** 2,
    c = Math.round(30 + 20*Math.sin(u*Math.PI) + 78*Math.exp(-(((u-0.12)/0.055)**2)) + 52*Math.exp(-(((u-0.88)/0.06)**2)) + 14*Math.exp(-(((u-0.5)/0.12)**2)));
  return `<div class="slice${i ? '' : ' sh'}" style="inset:${k.toFixed(2)}px;border-radius:${(88-k).toFixed(2)}px;transform:translateZ(${z.toFixed(1)}px);background:rgb(${c},${c+2},${c+5})"></div>`; }).join('')
  + [...Array(7)].map((_, i) => { const z = -T*0.2 + i*(T*0.4/6), c = 58 + Math.round(26*Math.sin(i/6*Math.PI));
    return [[-5,178,52],[-5,262,92],[-5,370,92],[537,300,138]].map(([x, y, h]) =>
      `<div class="btn" style="left:${x}px;top:${y}px;height:${h}px;transform:translateZ(${z.toFixed(1)}px);background:rgb(${c},${c+2},${c+5})"></div>`).join(''); }).join('');
const phone = (id, panes, extra = '') => `<div class="ph" id="${id}" data-layout-allow-overflow>
  <div class="back"><div class="cams"><i style="left:22px;top:22px"></i><i style="left:98px;top:98px"></i></div></div>
  ${band()}
  <div class="front"><div class="body"></div><div class="scr">
    <div class="sbar"><div class="t">9:41</div><div class="isl"></div><div class="r"><b style="height:8px"></b><b style="height:11px"></b><b style="height:14px"></b><b style="height:17px"></b><b class="bat"></b></div></div>
    ${panes}<div class="home"></div><div class="glare"></div></div></div>${extra}</div>`;
const tapPane = (sx, live) => `
  <svg class="arcs" viewBox="0 0 508 1108">${[110,160,210].map((r,i)=>`<path id="arc${i}${sx}" d="M ${254-r} 540 A ${r} ${r*.7} 0 0 1 ${254+r} 540" fill="none" stroke="rgba(17,17,20,${[.28,.17,.10][i]})" stroke-width="${[5,4.4,3.8][i]}" stroke-linecap="round"/>`).join('')}</svg>
  ${live ? [0,1,2].map(n => `<div class="ring soft" id="tring${n}" style="left:${254-170}px;top:${630-170}px;width:340px;height:340px"></div>`).join('') : ''}
  <div class="pill" id="pill${sx}"><b>£45.75</b></div>
  <svg class="mk2" id="mk2${sx}" viewBox="0 0 100 100" fill="#FFCF24">${MARK}</svg>
  <div class="note" id="note${sx}"><i><svg viewBox="0 0 100 100" width="30" height="30" fill="#111114">${MARK}</svg></i>
    <div class="tx"><div class="a">NeroPay</div><div class="b">Payment received · £45.75</div></div></div>`;
const keypad = extra => `<img src="assets/app1.png" alt="">
    <div class="ext" style="${box(20,1316,363,32)};background:#010101;border-radius:0 0 16px 16px"></div>
    <div class="ext" style="${box(403,1316,363,32)};background:#EFEFEF;border-radius:0 0 16px 16px"></div>${extra}`;
const menu = () => `<img src="assets/app2.png" alt="">`;

/* the pieces that lift, in the phone's own coordinates (the screen sits 16px in) */
const lift = (id, img, x, y, w, h, r) => { const [sx, sy] = px(x, y);
  return `<div class="lift" id="${id}" style="left:${16+sx}px;top:${16+sy}px;width:${w*S}px;height:${h*S}px;border-radius:${r}px;
    background-image:url(assets/${img});background-position:${-sx}px ${-sy+64}px"></div>`; };

const KEYS = [['k4',20,568,173,180],['k5',225,568,173,180],['k7',20,780,173,180],['kc',20,1207,363,113]];

$('rig').innerHTML = phone('ph', `
  <div class="pane" id="s1">${keypad(`
    <div class="patch" style="${box(100,160,500,150)}"></div>
    <div id="amt" style="left:${100*S}px;top:${64+172*S}px;width:${500*S}px">£0.00</div>
    ${KEYS.map(([id,x,y,w,h]) => `<div class="press${id==='kc'?' lt':''}" id="${id}" style="${box(x,y,w,h)}"></div>${ringAt('r'+id, x+w/2, y+h/2, 80)}`).join('')}`)}
    <div class="dim" id="d1"></div></div>
  <div class="pane" id="s2" style="visibility:hidden">${tapPane('', true)}<div class="dim" id="d2"></div></div>
  <div class="pane" id="s4" style="visibility:hidden">${menu()}
    <div class="press" id="card" style="${box(402,544,344,376)};border-radius:10px"></div>${ringAt('rcard', 574, 700, 90)}
    <div class="dim" id="d4"></div></div>
  <div class="pane" id="s3" style="visibility:hidden"><div id="list"><img src="assets/app3.png" alt="">
    <div id="hl" style="top:${335*S}px;height:${190*S}px"></div></div>
    <div class="dim" id="d3"></div></div>
  <div class="pane" id="s5" style="visibility:hidden;background:#F6F7FA"><img src="assets/app4.png" alt="">
    <div class="ext" style="${box(28,1316,733,30)};background:#fff;border:1px solid #E9EAED;border-top:0;border-radius:0 0 10px 10px"></div>
    <div id="cover" style="${box(142,196,600,354)}"></div>
    <div class="dim" id="d5"></div></div>
  <div class="pane" id="s6" style="visibility:hidden"><div class="cut" style="height:${1262*S}px"><img src="assets/app5.png" alt=""></div>
    <div class="patch" style="${box(46,650,560,46)}"></div>
    <div id="typed" style="left:${56*S}px;top:${64+659*S}px"><span id="tx"></span><i id="caret"></i></div>
    <div class="press lt" id="send" style="${box(342,1166,410,84)};border-radius:8px"></div>${ringAt('rsend', 547, 1208, 90)}
    <div class="note" id="note2" style="opacity:0"><i>${TICK}</i>
      <div class="tx"><div class="a">Link sent</div><div class="b">Table 12 — balance · £82.40</div></div></div></div>`,
  lift('lcard', 'app2.png', 402, 544, 344, 376, 10) +
  lift('ltip', 'app4.png', 258, 282, 294, 66, 8) +
  lift('lsnap', 'app4.png', 30, 906, 728, 404, 12));

/* the side phones: reports on the left, transactions on the right; the keypad comes back to the centre one */
$('fcL').innerHTML = phone('fpL', `<div class="pane" style="background:#F6F7FA"><img src="assets/app4.png" alt="">
  <div class="ext" style="${box(28,1316,733,30)};background:#fff;border:1px solid #E9EAED;border-top:0;border-radius:0 0 10px 10px"></div></div>`);
$('fcR').innerHTML = phone('fpR', `<div class="pane"><img src="assets/app3.png" alt=""></div>`);

/* the poses. Phone (x, y, turn, tilt, roll), the camera's push into the corner (p) and step back for the finale (q),
   and the two side phones. Times are the screen changes below */
const PH = {
  x:  mono([[0,-1150],[0.9,-40],[2.2,-8],[5.3,20],[7.32,10],[8.62,0],[15.33,0],[31.5,0]]),
  y:  mono([[0,60],[0.9,12],[2.2,4],[4,-15],[7.32,-30],[8.62,-15],[12.8,-5],[15.33,-10],[23.14,-12],[24.54,0],[31.5,0]]),
  rotationY: mono([[0,62],[0.9,32],[2.2,20],[3.3,13],[5.3,2],[7.32,-6],[8.2,-12],[10.6,-8],[11.29,-10],[12.79,-24],[13.73,-22],[15.33,-8],[17.3,6],[19.3,10],[23.14,4],[24.54,0],[26.6,-3]]),
  rotationX: mono([[0,14],[0.9,10],[2.2,8],[5.3,5],[8.62,6],[11.29,6],[12.79,8],[13.73,7],[15.33,5],[23.14,4],[24.54,3],[31.5,3]]),
  rotationZ: mono([[0,-12],[0.9,-6],[2.2,-3],[3.3,-2],[5.3,0],[7.32,1],[8.62,2],[11.29,1],[12.79,3],[13.73,2],[15.33,1],[17.3,-2],[23.14,-1],[24.54,0],[31.5,0]])
};
const CP = mono([[0,0],[11.29,0],[12.79,0.9],[13.73,1],[15.33,0],[31.5,0]]);
const CQ = mono([[0,0],[23.14,0],[24.54,1],[26.6,1.35]]);
const FL = { x: mono([[23.39,-1300],[24.9,-300],[26.6,-262]]), rotationY: mono([[23.39,70],[24.9,26],[26.6,18]]) };
const FR = { x: mono([[23.7,1300],[25.2,300],[26.6,266]]), rotationY: mono([[23.7,-70],[25.2,-26],[26.6,-19]]) };
const PHE = $('ph'), RIG = $('rig'), FPL = $('fpL'), FPR = $('fpR');
const pose = t => {
  gsap.set(PHE, { x:PH.x(t), y:PH.y(t), rotationY:PH.rotationY(t), rotationX:PH.rotationX(t), rotationZ:PH.rotationZ(t) });
  const p = CP(t), q = CQ(t);
  gsap.set(RIG, { scale:(1.04 + p*1.86) * (1 - 0.23*q), x:-680*p, y:1330*p - 40*q });
  gsap.set(FPL, { x:FL.x(t), y:-40, z:-300, scale:.72, rotationY:FL.rotationY(t), rotationZ:-4 });
  gsap.set(FPR, { x:FR.x(t), y:-40, z:-300, scale:.72, rotationY:FR.rotationY(t), rotationZ:4 });
  LB.forEach(e => { const [fx, fy, d] = LP[+e.dataset.j]; e.style.transform = `translate(${(fx(t) - d/2).toFixed(1)}px,${(fy(t) - d/2).toFixed(1)}px)`; });
  if (BG !== 'reeded') { const w = Math.sin(t*0.19);
    GM.style.transform = `rotateY(${-16 + 5*w}deg) rotateX(${9 + 2.5*Math.sin(t*0.13 + 1)}deg)`;
    const k = ((t*0.075) % 1.3) - 0.65; GSR.setAttribute('transform', `translate(${(k*200).toFixed(2)},${(k*80).toFixed(2)})`); }
};
pose(0);

/* ── the timeline ── */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const LIFT = (z, s) => ({ z, scale:s, boxShadow:'0 44px 64px -20px rgba(17,17,20,.42)' });
const SETTLE = { z:32.5, scale:1, boxShadow:'0 0 0 rgba(17,17,20,0)' };


/* headlines: the lines rise in through a mask, the marker draws, and they leave up before the next screen */
const HD = [[0.3, b(6.3)], [b(7.2), b(14.1)], [b(15.4), b(20.7)], [b(21.8), b(30.3)], [b(31.2), b(37.5)], [b(38.5), b(45.2)]];
tl.fromTo('#scrim', { opacity:0 }, { opacity:1, duration:0.5 }, 0.1).to('#scrim', { opacity:0, duration:0.5 }, b(45.3));
HD.forEach(([s, e], i) => {
  tl.fromTo(`#hk${i}`, { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:'power2.out' }, s)
    .fromTo(`#ha${i}`, { yPercent:115 }, { yPercent:0, duration:0.65, ease:'power3.out' }, s + 0.05)
    .fromTo(`#hb${i}`, { yPercent:115 }, { yPercent:0, duration:0.65, ease:'power3.out' }, s + 0.16)
    .fromTo(`#hm${i}`, { scaleX:0 }, { scaleX:1, duration:0.55, ease:'power2.out' }, s + 0.55)
    .to(`#ha${i}`, { yPercent:-115, duration:0.3, ease:'power2.in' }, e)
    .to(`#hb${i}`, { yPercent:-115, duration:0.3, ease:'power2.in' }, e + 0.05)
    .to(`#hk${i}`, { opacity:0, duration:0.25 }, e);
});

/* a press: the key darkens and a ring goes out from under the finger */
const tap = (k, at, big) => tl.fromTo('#'+k, { opacity:0 }, { opacity:1, duration:0.06, immediateRender:false }, at)
  .to('#'+k, { opacity:0, duration:0.3 }, at + 0.14)
  .fromTo('#r'+k, { scale:.35, opacity:.95 }, { scale:big || 1.5, opacity:0, duration:0.6, ease:'power2.out', immediateRender:false }, at);

/* the live text: the keyed amount and the typed note, as functions of time */
const AMT = [[b(2), '£0.04', 'k4'], [b(2.5), '£0.45', 'k5'], [b(3), '£4.57', 'k7'], [b(3.5), '£45.75', 'k5']];
const NOTE = 'Table 12 — balance', T0 = b(39.2), T1 = b(41.8), SEND = b(42.8);
const amt = $('amt'), tx = $('tx'), caret = $('caret'), clock = { t:0 };
tl.to(clock, { t:31.5, duration:31.5, ease:'none', onUpdate:() => { const t = clock.t; pose(t);
  let v = '£0.00'; AMT.forEach(([at, s]) => { if (t >= at) v = s; }); if (amt.textContent !== v) amt.textContent = v;
  const n = Math.max(0, Math.min(NOTE.length, Math.floor((t - T0) / (T1 - T0) * NOTE.length)));
  const w = NOTE.slice(0, n); if (tx.textContent !== w) tx.textContent = w;
  caret.style.opacity = (t < SEND && (t < T1 || Math.floor((t - T1) * 2.4) % 2 === 0)) ? 1 : 0; } }, 0);

/* 1 · the keypad. The phone swings in, settles, the amount is keyed and charged */
AMT.forEach(([at, , k]) => { tl.fromTo('#amt', { scale:1.07 }, { scale:1, duration:0.25, ease:'power2.out', immediateRender:false }, at); tap(k, at); });
tap('kc', b(4.5), 1.6);

/* 2 · CHARGE opens the tap screen the way the app would: it slides in over the keypad as the phone turns */
tl.set('#s2', { visibility:'visible', x:508, zIndex:2 }, b(6.5))
  .to('#s2', { x:0, duration:0.7, ease:'power3.inOut' }, b(6.5))
  .to('#s1', { x:-150, duration:0.7, ease:'power3.inOut' }, b(6.5))
  .to('#d1', { opacity:.18, duration:0.7 }, b(6.5))
  .set('#s1', { visibility:'hidden' }, b(6.5) + 0.75);

/* the tap screen holds: the amount, then the contactless signal breathing out, slow and quiet, on every other beat */
tl.fromTo('#pill', { scale:.75, opacity:0 }, { scale:1, opacity:1, duration:0.55, ease:'back.out(1.6)' }, b(7.3));
[0,1,2].forEach(i => tl.fromTo('#arc'+i, { opacity:0 }, { opacity:.35, duration:0.3 }, b(7.7) + i*0.1));
tl.fromTo('#mk2', { scale:.4, opacity:0, transformOrigin:'50% 50%' }, { scale:1, opacity:1, duration:0.5, ease:'back.out(2)' }, b(8.2));
for (let c = 0; c < 4; c++) { const at = b(8.5 + c*2);
  [0,1,2].forEach(i => tl.to('#arc'+i, { opacity:1, duration:0.28, ease:'sine.out' }, at + i*0.14)
                        .to('#arc'+i, { opacity:.35, duration:0.5, ease:'sine.in' }, at + i*0.14 + 0.28));
  tl.fromTo('#tring'+(c%3), { scale:.55, opacity:.5 }, { scale:1.5, opacity:0, duration:b(2.6), ease:'sine.out', immediateRender:false }, at);
}
tl.fromTo('#note', { y:-150, opacity:0 }, { y:0, opacity:1, duration:0.6, ease:'back.out(1.4)' }, b(11.5));

/* 3 · the menu swipes in over the tap screen, as the other screens do; the phone never turns past a gentle angle */
tl.set('#s4', { visibility:'visible', x:508, zIndex:3 }, b(14.4))
  .to('#s4', { x:0, duration:0.7, ease:'power3.inOut' }, b(14.4))
  .to('#s2', { x:-150, duration:0.7, ease:'power3.inOut' }, b(14.4))
  .to('#d2', { opacity:.18, duration:0.7 }, b(14.4))
  .set('#s2', { visibility:'hidden' }, b(14.4) + 0.75);

/* the menu: a tap on the dish, the card lifts off the screen and grows, holds, and settles back */
tap('card', b(17.5), 1.7);
tl.set('#lcard', { opacity:1, z:32.5 }, b(18))
  .to('#lcard', { ...LIFT(132, 1.12), duration:0.85, ease:'power3.out' }, b(18))
  .to('#lcard', { z:147, scale:1.14, duration:b(19.9) - b(18) - 0.85, ease:'sine.inOut' }, b(18) + 0.85)
  .to('#lcard', { ...SETTLE, duration:0.6, ease:'power2.inOut' }, b(19.9))
  .set('#lcard', { opacity:0 }, b(19.9) + 0.62);

/* 4 · the transactions screen slides in while the phone is still wide, then the camera pushes into its corner */
tl.set('#s3', { visibility:'visible', x:508, zIndex:4 }, b(20.9))
  .to('#s3', { x:0, duration:0.7, ease:'power3.inOut' }, b(20.9))
  .to('#s4', { x:-150, duration:0.7, ease:'power3.inOut' }, b(20.9))
  .to('#d4', { opacity:.18, duration:0.7 }, b(20.9))
  .set('#s4', { visibility:'hidden' }, b(20.9) + 0.75);

/* the close-up: the list drifts up under the corner and the NeroWeb row lights */
tl.to('#list', { y:-150, duration:b(27) - b(24.2), ease:'power1.inOut' }, b(24.2))
  .fromTo('#hl', { opacity:0 }, { opacity:1, duration:0.2, immediateRender:false }, b(25))
  .to('#hl', { opacity:0.55, duration:0.8 }, b(25) + 0.25);

/* 5 · the pull out to the whole screen, the list easing back to the top */
tl.to('#list', { y:0, duration:1.6, ease:'power2.inOut' }, b(27));

/* 6 · reports swipes in; the trend draws on, the tooltip lifts, then the channel split, and both settle */
tl.set('#s5', { visibility:'visible', x:508, zIndex:5 }, b(30.6))
  .to('#s5', { x:0, duration:0.7, ease:'power3.inOut' }, b(30.6))
  .to('#s3', { x:-150, duration:0.7, ease:'power3.inOut' }, b(30.6))
  .to('#d3', { opacity:.18, duration:0.7 }, b(30.6))
  .set('#s3', { visibility:'hidden' }, b(30.6) + 0.75)
  .fromTo('#cover', { scaleX:1 }, { scaleX:0, duration:1.3, ease:'power2.inOut' }, b(31.6))
  .set('#ltip', { opacity:1, z:32.5 }, b(34))
  .to('#ltip', { ...LIFT(112, 1.06), duration:0.6, ease:'back.out(1.4)' }, b(34))
  .set('#lsnap', { opacity:1, z:32.5 }, b(35))
  .to('#lsnap', { ...LIFT(102, 1.04), duration:0.7, ease:'power3.out' }, b(35))
  .to(['#ltip', '#lsnap'], { ...SETTLE, duration:0.5, ease:'power2.inOut' }, b(37))
  .set(['#ltip', '#lsnap'], { opacity:0 }, b(37) + 0.52);

/* 7 · the payment link comes up as a sheet over reports; the note is typed, Send, and the link-sent toast */
tl.set('#s6', { visibility:'visible', y:1108, zIndex:6 }, b(37.9))
  .to('#s6', { y:0, duration:0.8, ease:'power3.out' }, b(37.9))
  .to('#d5', { opacity:.25, duration:0.6 }, b(37.9))
  .set('#s5', { visibility:'hidden' }, b(37.9) + 0.85);
tap('send', SEND, 1.8);
tl.fromTo('#note2', { y:-150, opacity:0 }, { y:0, opacity:1, duration:0.6, ease:'back.out(1.4)' }, SEND + b(0.6));

/* 8 · the finale: the phone steps back to the centre (the poses above), the keypad slides back onto it as the app's
   home screen, and reports and transactions come in beside it */
tl.set('#s1', { visibility:'visible', x:-508, zIndex:8 }, b(45.5))
  .set('#d1', { opacity:0 }, b(45.5))
  .to('#s1', { x:0, duration:0.9, ease:'power2.inOut' }, b(45.5));

/* out · the three pull back into the off-white, which is fully up before the phones' clips end at 26.5s */
tl.to(['#fcL', '#fcR'], { scale:0.88, duration:0.9, ease:'power2.in', transformOrigin:'50% 52%' }, 25.7)
  .fromTo('#fade', { opacity:0 }, { opacity:1, duration:0.55, ease:'power1.inOut' }, 25.85);

window.__timelines['main'] = tl;
</script>
</body>
</html>
