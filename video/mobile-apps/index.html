<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
/* NeroPay Mobile Apps — "Order. Book. Join. Pay." (MA01), 24 Sep 2026.
   The storyboard and the four merchant apps are Cowork's handover (/brag-slim, 24 Sep), kept as built: four invented
   businesses, each doing one thing in one tap. What changed, on Faisal's word: the charcoal frame is gone for the
   light look he approved on AM02 (warm off-white, yellow light moving behind clear glass, the mark's bars as the
   glass, the thick 3D phone on one continuous curve), NeroPay's own type is Poppins in the house headline style,
   the pace is about 30 s instead of 21, "Available on Android & iOS" is the highlight line, and it ends on the locked
   outro (brand/sting/outro.html) with neropay.app. The merchant screens keep their own fonts and colours: four
   businesses looking nothing alike is the point.
   Rails: no NeroPay price, rate or fee; the prices in the apps are the invented merchants' own; no real merchant,
   person or data; nothing AI-generated; the only claims are Android and iOS, the merchant's own brand, their
   existing booking, ordering and checkout, and set up in the NeroPay dashboard (Faisal confirmed, 24 Sep). */
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-400-normal.woff2)format("woff2");font-weight:400;font-display:block}
@font-face{font-family:Inter;font-weight:400;src:url(merchant-fonts/inter-latin-400-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:500;src:url(merchant-fonts/inter-latin-500-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:600;src:url(merchant-fonts/inter-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:700;src:url(merchant-fonts/inter-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Inter;font-weight:800;src:url(merchant-fonts/inter-latin-800-normal.woff2);font-display:block}
@font-face{font-family:Fraunces;font-weight:500;src:url(merchant-fonts/fraunces-latin-500-normal.woff2);font-display:block}
@font-face{font-family:Fraunces;font-weight:600;src:url(merchant-fonts/fraunces-latin-600-normal.woff2);font-display:block}
@font-face{font-family:Fraunces;font-weight:500;font-style:italic;src:url(merchant-fonts/fraunces-latin-500-italic.woff2);font-display:block}
@font-face{font-family:Bebas;font-weight:400;src:url(merchant-fonts/bebas-neue-latin-400-normal.woff2);font-display:block}
@font-face{font-family:Archivo;font-weight:700;src:url(merchant-fonts/archivo-latin-700-normal.woff2);font-display:block}
@font-face{font-family:Archivo;font-weight:800;src:url(merchant-fonts/archivo-latin-800-normal.woff2);font-display:block}
@font-face{font-family:Archivo;font-weight:900;src:url(merchant-fonts/archivo-latin-900-normal.woff2);font-display:block}
@font-face{font-family:DMSerif;font-weight:400;src:url(merchant-fonts/dm-serif-display-latin-400-normal.woff2);font-display:block}
@font-face{font-family:DMSerif;font-weight:400;font-style:italic;src:url(merchant-fonts/dm-serif-display-latin-400-italic.woff2);font-display:block}
:root{--yel:#FFCF24;--ink:#111114}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F1EA}
body{font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F1EA}
.clip{position:absolute;inset:0}

/* the ground: AM02's, warm off-white, yellow light that moves to a new place for every scene, behind clear glass
   cut in the shape of the mark's two bars at 24x */
.ground{background:linear-gradient(170deg,#F6F3EC 0%,#EEEAE1 100%)}
.lset{position:absolute;left:0;top:0;width:1080px;height:1920px}
.lb{position:absolute;left:0;top:0;border-radius:50%}
#panes{position:absolute;inset:0;perspective:1600px}
#gmark{position:absolute;left:-380px;top:-300px;width:2400px;height:2400px;transform-origin:1300px 1200px}

/* NeroPay's own type: the carousel headline style */
#hdz{z-index:10;pointer-events:none}
#scrim{position:absolute;left:-600px;right:-600px;top:-500px;height:970px;background:linear-gradient(180deg,rgba(246,243,236,.96) 0%,rgba(246,243,236,.9) 81.6%,rgba(246,243,236,0) 100%);opacity:0}
.hlw{position:absolute;left:74px;right:60px;top:150px}
.kick{display:flex;align-items:center;gap:14px;font:600 22px/1 Poppins;letter-spacing:.16em;text-transform:uppercase;color:#6B6B75}
.kick i{display:block;width:34px;height:5px;border-radius:3px;background:var(--yel)}
h1{margin-top:22px;font:700 78px/1.0 Poppins;letter-spacing:-.035em;color:var(--ink)}
h1.sm{font-size:62px}
h1.word{font-size:150px;line-height:.98;letter-spacing:-.05em;margin-top:14px}
h1 .ln{display:block;overflow:hidden;padding:0 0 .08em 8px;margin:0 0 -.08em -8px}
h1 .ln > span{display:inline-block;position:relative;isolation:isolate}
h1 .mk{position:absolute;left:-6px;right:-8px;bottom:.06em;height:.38em;background:var(--yel);border-radius:3px;z-index:-1;transform-origin:0 50%}
h1.word .mk{height:.26em;bottom:.1em}

/* the highlight line on the reveal */
#avail{position:absolute;left:0;right:0;top:1432px;text-align:center;z-index:11}
#avail .row{display:inline-flex;align-items:baseline;gap:16px;font:500 40px/1 Poppins;letter-spacing:-.02em;color:#55555E}
#avail .ln{display:inline-block;overflow:hidden;padding:0 8px .12em;vertical-align:bottom}
#av1{display:inline-block}
#avail b{display:inline-block;position:relative;isolation:isolate;font:700 64px/1 Poppins;letter-spacing:-.035em;color:var(--ink)}
#avail b .mk{position:absolute;left:-8px;right:-10px;bottom:.04em;height:.36em;background:var(--yel);border-radius:4px;z-index:-1;transform-origin:0 50%}
#dash{position:absolute;left:0;right:0;top:1540px;text-align:center;font:500 30px/1 Poppins;letter-spacing:-.01em;color:#6B6B75;z-index:11}

/* the phone: AM02 v5's, 64px deep with a polished chamfer and side buttons */
.cam{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 52%}
#rig{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 1050px}
.ph{position:absolute;left:270px;top:480px;width:540px;height:1140px;transform-style:preserve-3d;transform-origin:50% 50%}
.slice{position:absolute;inset:0;border-radius:88px}
.slice.sh{box-shadow:0 70px 110px -40px rgba(38,36,70,.42),0 20px 40px -20px rgba(38,36,70,.25)}
.btn{position:absolute;width:8px;border-radius:4px}
.front{position:absolute;inset:0;transform-style:flat;transform:translateZ(32px)}
.body{position:absolute;inset:0;border-radius:88px;background:#0B0B0D;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 0 7px #151517}
.body::after{content:"";position:absolute;inset:2px;border-radius:86px;box-shadow:inset 0 2px 1px rgba(255,255,255,.30),inset 0 -2px 2px rgba(0,0,0,.5)}
.back{position:absolute;inset:0;border-radius:88px;transform:translateZ(-32px) rotateY(180deg);background:linear-gradient(155deg,#2E2F34 0%,#18191C 55%,#26272B 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.10)}
.back .cams{position:absolute;left:44px;top:44px;width:190px;height:190px;border-radius:52px;background:linear-gradient(150deg,#34353A,#1C1D20);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.4)}
.back .cams i{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a4560,#07080c 65%);box-shadow:0 0 0 6px #0f1012}
.scr{position:absolute;left:16px;top:16px;width:508px;height:1108px;border-radius:72px;overflow:hidden;background:#000;clip-path:inset(0 round 72px)}
.isl{position:absolute;left:50%;top:14px;width:150px;height:44px;margin-left:-75px;border-radius:24px;background:#050506;z-index:40}
.hbar{position:absolute;left:50%;bottom:13px;width:170px;height:6px;margin-left:-85px;border-radius:3px;background:rgba(17,17,20,.82);z-index:40}
.glare{position:absolute;inset:0;border-radius:72px;pointer-events:none;z-index:45;background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.14) 44%,rgba(255,255,255,0) 58%)}
/* the merchant apps are laid out at 390 wide, as built, and scaled onto the 508 screen: 390 x 850.6 fills it exactly */
.app{position:absolute;left:0;top:0;width:390px;height:850.6px;transform:scale(1.302564);transform-origin:0 0;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#F4F4F6}
.fcam{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 50%}

/* ---- the merchant apps (Cowork's handover, unchanged except the home screen below) ---- */
.layer{position:absolute;inset:0;overflow:hidden}
.sb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600}
.sb .sig{display:flex;gap:4px;align-items:center}.sb .sig i{display:block;background:currentColor;border-radius:2px}
/* home screen */
.home{background:radial-gradient(360px 420px at 15% 8%, #3A3F31, transparent 70%),radial-gradient(420px 420px at 95% 95%, #2B2B36, transparent 70%),#17171C;color:#EDEDF2}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;padding:30px 22px 0}
.happ{display:flex;flex-direction:column;align-items:center;gap:8px;height:92px}
.hic{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.085);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);position:relative}
.hic.blank::after{content:"";position:absolute;inset:21px;border-radius:6px;border:2px solid rgba(255,255,255,.18)}
.hic.blank.c::after{border-radius:50%}
.hlbl{width:38px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.mic{width:64px;height:64px;border-radius:16px;overflow:hidden;display:grid;place-items:center;box-shadow:0 10px 22px rgba(0,0,0,.45)}
.mname{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap}
.hdock{position:absolute;left:18px;right:18px;bottom:22px;height:92px;border-radius:30px;background:rgba(255,255,255,.08);display:flex;justify-content:space-evenly;align-items:center}
.hpager{position:absolute;bottom:128px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.hpager i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}.hpager i:first-child{background:rgba(255,255,255,.8)}
#launch{position:absolute;background:#FCF9F4;z-index:30;opacity:0}

/* Sage & Co */
.sage{background:#FCF9F4;color:#2E3225}
.sage .bar{display:flex;align-items:center;gap:12px;padding:6px 22px 14px}
.sage .bar img{width:40px;height:40px;border-radius:11px}
.sage .bar b{font-family:Fraunces,serif;font-weight:600;font-size:25px;flex:1}
.sage .burger{width:24px;display:grid;gap:5px}.sage .burger i{height:2.5px;border-radius:2px;background:#2E3225}
.sage .hero{margin:0 16px;border-radius:26px;background:#74805C;color:#FCF9F4;padding:24px 22px 22px;position:relative;overflow:hidden}
.sage .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;border:2px solid rgba(252,249,244,.2)}
.sage .k{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:600}
.sage h2{font-family:Fraunces,serif;font-weight:500;font-size:40px;line-height:1.04;margin:8px 0 6px}
.sage h2 em{font-style:italic}
.sage .hero p{font-size:15px;opacity:.85}
.sage .sec{padding:22px 22px 0}
.sage h3{font-size:18px;font-weight:700}
.sage .item{display:flex;gap:14px;align-items:center;margin-top:14px}
.sage .th{width:56px;height:56px;border-radius:15px;background:#E7E4D6;display:grid;place-items:center}
.sage .th svg{width:32px;height:32px}
.sage .nm{flex:1;display:grid;gap:2px}.sage .nm b{font-size:16.5px;font-weight:600}.sage .nm small{font-size:13.5px;color:#7B7E6E}
.sage .pr{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.sage .add{width:38px;height:38px;border-radius:12px;background:#74805C;color:#FCF9F4;display:grid;place-items:center;font-size:24px;font-weight:500;line-height:1}
.sage .add.done{background:#2E3225}
.sage .basket{position:absolute;left:16px;right:16px;bottom:22px;border-radius:22px;background:#2E3225;color:#FCF9F4;display:flex;align-items:center;padding:16px 16px 16px 22px}
.sage .basket .q{font-size:14px;opacity:.72}.sage .basket .tot{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.sage .basket .go{margin-left:auto;background:#FCF9F4;color:#2E3225;font-size:16px;font-weight:700;padding:14px 18px;border-radius:14px}

/* Kestrel Barbers */
.kes{background:#16181C;color:#F2EFE8}
.kes .hd{padding:10px 24px 0;display:flex;align-items:flex-end;gap:10px}
.kes .hd b{font-family:Bebas;font-size:52px;letter-spacing:.04em;line-height:.9;color:#F2EFE8}
.kes .hd span{font-size:12px;letter-spacing:.3em;color:#C8A15A;font-weight:700;padding-bottom:6px}
.kes .rule{height:2px;background:#C8A15A;margin:14px 24px 0;width:56px}
.kes .svc{margin:22px 18px 0;border-radius:18px;background:#1F2228;box-shadow:inset 0 0 0 1.5px #C8A15A;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.kes .svc b{font-size:18px;font-weight:700}.kes .svc small{display:block;font-size:13.5px;color:#9B968A;margin-top:3px}
.kes .svc .p{font-size:17px;font-weight:700;color:#C8A15A;font-variant-numeric:tabular-nums}
.kes .lab{font-family:Bebas;font-size:24px;letter-spacing:.08em;color:#9B968A;padding:22px 24px 0}
.kes .days{display:flex;gap:10px;padding:10px 18px 0}
.kes .day{flex:1;border-radius:14px;background:#1F2228;text-align:center;padding:12px 0}
.kes .day small{display:block;font-size:12px;letter-spacing:.14em;color:#9B968A;font-weight:700}
.kes .day b{font-family:Bebas;font-size:32px;letter-spacing:.02em}
.kes .day.on{box-shadow:inset 0 0 0 2px #C8A15A}.kes .day.on small{color:#C8A15A}
.kes .times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 18px 0}
.kes .tm{border-radius:12px;background:#1F2228;text-align:center;padding:15px 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.kes .tm.x{color:#55524B;text-decoration:line-through}
.kes .tm.on{background:#C8A15A;color:#16181C}
.kes .toast{position:absolute;left:16px;right:16px;bottom:24px;border-radius:20px;background:#F2EFE8;color:#16181C;padding:18px 20px;display:flex;gap:14px;align-items:center}
.kes .toast .ck{width:42px;height:42px;border-radius:50%;background:#C8A15A;display:grid;place-items:center}
.kes .toast b{font-size:18px;font-weight:800;display:block}.kes .toast small{font-size:14px;color:#55524B}

/* Ironvale Studio */
.iro{background:#0B0D12;color:#fff}
.iro .hd{padding:10px 24px 0}
.iro .hd b{font-family:Archivo;font-weight:900;font-size:34px;letter-spacing:.08em;display:block;line-height:1}
.iro .hd span{font-family:Archivo;font-weight:700;font-size:13px;letter-spacing:.42em;color:#3D7BFF}
.iro .tabs{display:flex;gap:8px;padding:22px 20px 0}
.iro .tab{font-size:15px;font-weight:700;padding:10px 16px;border-radius:999px;background:#161A22;color:#8B93A7}
.iro .tab.on{background:#fff;color:#0B0D12}
.iro .cls{margin:14px 16px 0;border-radius:22px;background:#141821;padding:18px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.iro .cls .t{font-family:Archivo;font-weight:900;font-size:26px;letter-spacing:.03em}
.iro .cls .m{font-size:14px;color:#8B93A7;grid-column:1}
.iro .cls .sp{font-size:14px;font-weight:700;color:#3D7BFF;grid-column:1}
.iro .cls .j{grid-row:1/4;grid-column:2;font-size:16px;font-weight:800;padding:14px 20px;border-radius:14px;background:#3D7BFF;color:#fff;white-space:nowrap}
.iro .cls .j.in{background:#fff;color:#0B0D12}
.iro .cls .j.full{background:#1D2230;color:#5F667A}
.iro .cls.hi{box-shadow:inset 0 0 0 2px #3D7BFF}

/* Marigold Lane */
.mar{background:#FBF1EE;color:#4A2338}
.mar .hd{display:flex;align-items:center;justify-content:space-between;padding:8px 24px 0}
.mar .hd b{font-family:DMSerif;font-weight:400;font-size:32px}
.mar .hd b em{font-style:italic;color:#C9772A}
.mar .bag{width:26px;height:26px;border:2.5px solid #4A2338;border-radius:6px 6px 8px 8px}
.mar .art{margin:18px 16px 0;border-radius:28px;background:#F3DCD6;height:330px;position:relative;overflow:hidden}
.mar .art svg{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px}
.mar .info{padding:20px 24px 0}
.mar .info h2{font-family:DMSerif;font-weight:400;font-size:34px;line-height:1.05}
.mar .info p{font-size:15px;color:#8A6474;margin-top:6px}
.mar .row{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0}
.mar .row .p{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.mar .row .d{font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;background:#F3DCD6}
.mar .pay{position:absolute;left:16px;right:16px;bottom:24px;border-radius:20px;background:#4A2338;color:#FBF1EE;text-align:center;padding:21px 0;font-size:19px;font-weight:700}
.mar .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:14px 24px 34px;box-shadow:0 -20px 40px rgba(74,35,56,.18)}
.mar .sheet .grab{width:44px;height:5px;border-radius:3px;background:#E5D6DB;margin:0 auto 18px}
.mar .sheet .ttl{font-size:15px;color:#8A6474;font-weight:600}
.mar .sheet .amt{font-size:40px;font-weight:800;margin:4px 0 16px;font-variant-numeric:tabular-nums}
.mar .card{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:#FBF1EE;font-size:16px;font-weight:600}
.mar .card i{width:40px;height:27px;border-radius:5px;background:linear-gradient(135deg,#4A2338,#8A4C6C)}
.mar .confirm{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;border-radius:18px;padding:19px 0;font-size:19px;font-weight:800;background:#4A2338;color:#fff}
.mar .confirm .ok{width:30px;height:30px;border-radius:50%;background:#2F9E62;display:none;place-items:center}


/* ---- the home screen, re-lit for the light look ---- */
.home{background:radial-gradient(300px 300px at 88% 14%,rgba(255,207,36,.42),rgba(255,207,36,0) 70%),radial-gradient(340px 340px at 8% 92%,rgba(255,196,120,.30),rgba(255,196,120,0) 70%),linear-gradient(170deg,#F8F4EB,#EEE8DC);color:#1E1E24}
.home .hic{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 6px 14px -8px rgba(60,45,10,.25)}
.home .hic.blank::after{border-color:rgba(17,17,20,.14)}
.home .hlbl{background:rgba(17,17,20,.12)}
.home .mic{box-shadow:0 10px 20px -6px rgba(60,45,10,.35)}
.home .mname{color:#1E1E24}
.home .hdock{background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.home .hpager i{background:rgba(17,17,20,.2)}.home .hpager i:first-child{background:rgba(17,17,20,.7)}
#launch{position:absolute;z-index:30;opacity:0}
/* the touch: a press you can see on light and dark screens, and the yellow ring going out from under it */
.touch{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:60;opacity:0;pointer-events:none}
.touch i{position:absolute;inset:0;border-radius:50%;background:rgba(120,120,128,.34);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.touch b{position:absolute;inset:0;border-radius:50%;border:2.5px solid rgba(255,207,36,.95);box-shadow:0 0 0 2px rgba(255,207,36,.2)}

#fade{background:#FBF9F7;z-index:20;opacity:0}
</style>
</head>

    <div class="lset" id="lights" data-layout-allow-overflow></div>
    <div id="panes" data-layout-allow-overflow></div>
  </div>

  const done = t >= 2.55; q('[data-k=confirm]').style.background = done ? '#2F9E62' : '#4A2338';
  q('[data-k=ok]').style.display = done ? 'grid' : 'none'; q('[data-k=ctext]').textContent = done ? 'Payment confirmed' : 'Confirm payment';
  q('[data-k=confirm]').style.transform = `scale(${t >= 2.35 && t < 2.55 ? .96 : 1})`; }
const LAYERS = { sage:$('sage'), kes:$('kes'), iro:$('iro'), mar:$('mar') };
const STATE = { sage:sageState, kes:kesState, iro:iroState, mar:marState };

/* the three other phones for the reveal, each on its app's end state */
['sage', 'kes', 'iro'].forEach((id, i) => {
  const L = LAYERS[id].cloneNode(true); L.id = ''; L.style.transform = 'none'; L.style.opacity = 1;
  $('fc' + i).innerHTML = phone('fp' + i, `<div class="app" id="app${i}"></div>`, 'hb' + i);
  $('app' + i).appendChild(L); STATE[id](L, 9);
  $('hb' + i).style.background = id === 'sage' ? 'rgba(17,17,20,.82)' : 'rgba(255,255,255,.85)';
});

/* ── the poses: the phone, the camera's gentle push while each app is used, the three reveal phones ── */
const PH = {
  x: mono([[0,0],[T.reveal,0],[T.reveal+1.0,357.7],[T.fade,360],[29.9,362]]),
  y: mono([[0,1150],[1.0,40],[2.2,6],[4.0,0],[T.reveal,-6],[T.reveal+1.0,-10],[T.fade,-14],[29.9,-16]]),
  scale: mono([[0,1],[T.reveal,1],[T.reveal+1.0,0.4135],[T.fade,0.419],[29.9,0.423]]),
  rotationY: mono([[0,-22],[1.0,-9],[2.2,-4],[4.0,4],[6.6,-5],[8.6,-8],[10.5,5],[12.4,7],[14.3,-5],[16.2,-6],[18.2,5],[T.reveal,4],[T.reveal+1.0,-12],[T.fade,-10],[29.9,-9]]),
  rotationX: mono([[0,34],[1.0,10],[2.2,6],[T.reveal,4],[T.reveal+1.0,5],[29.9,4]]),
  rotationZ: mono([[0,7],[1.0,2],[2.2,0],[8.6,-1],[12.4,1],[16.2,-1],[T.reveal,0],[29.9,0]])
};
const CAM = mono([[0,1.04],[T.sage,1.04],[6.6,1.10],[T.kes,1.06],[10.4,1.11],[T.iro,1.06],[14.2,1.11],[T.mar,1.06],[18.2,1.11],[T.reveal,1.04],[29.9,1.04]]);
const ROW = [-372, -124, 124], RY = [12, 4, -4];   /* four phones 248 apart: 52px clear of each frame edge */
const FP = ROW.map((x, i) => { const t0 = T.reveal + 0.35 + i*0.14;
  return { t0, y: mono([[t0,1250],[t0+0.6,16],[t0+1.3,-10],[29.9,-16]]), x, ry: mono([[t0,RY[i]*2.2],[t0+1.3,RY[i]],[29.9,RY[i]*0.85]]) }; });
const PHE = $('ph'), RIG = $('rig'), FPE = [0,1,2].map(i => $('fp' + i));

/* ── the frame: everything that is a function of time ── */
const TAPS = [[T.tap1, () => at(document.querySelector('.mwrap[data-m=sage] .mic'))],
  [T.sage+1.0, () => at(LAYERS.sage.querySelector('[data-k=sageadd]'))], [T.sage+2.45, () => at(LAYERS.sage.querySelector('[data-k=checkout]'))],
  [T.kes+1.4, () => at(LAYERS.kes.querySelector('[data-k=slot]'))], [T.iro+1.4, () => at(LAYERS.iro.querySelector('[data-k=join]'))],
  [T.mar+1.15, () => at(LAYERS.mar.querySelector('[data-k=pay]'))], [T.mar+2.4, () => at(LAYERS.mar.querySelector('[data-k=confirm]'))]];
const ORDER = ['sage', 'kes', 'iro', 'mar'], STARTS = [T.sage, T.kes, T.iro, T.mar];
const frame = t => {
  /* the ground */
  LB.forEach(e => { const [fx, fy, d] = LP[+e.dataset.j]; e.style.transform = `translate(${(fx(t) - d/2).toFixed(1)}px,${(fy(t) - d/2).toFixed(1)}px)`; });
  GM.style.transform = `rotateY(${-16 + 5*Math.sin(t*0.19)}deg) rotateX(${9 + 2.5*Math.sin(t*0.13 + 1)}deg)`;
  const k = ((t*0.075) % 1.3) - 0.65; GSR.setAttribute('transform', `translate(${(k*200).toFixed(2)},${(k*80).toFixed(2)})`);

  /* the phones */
  gsap.set(PHE, { x:PH.x(t), y:PH.y(t), scale:PH.scale(t), rotationY:PH.rotationY(t), rotationX:PH.rotationX(t), rotationZ:PH.rotationZ(t) });
  gsap.set(RIG, { scale:CAM(t) });
  FP.forEach((f, i) => gsap.set(FPE[i], { x:f.x, y:f.y(t), scale:0.43, rotationY:f.ry(t), rotationX:5 }));

  /* the home screen's icons pop in */
  document.querySelectorAll('.mwrap').forEach((w, i) => { const p = lin(t, 1.0 + i*0.35, 1.5 + i*0.35);
    w.style.transform = `scale(${p <= 0 ? 0 : back(p)})`; w.style.opacity = p > 0 ? 1 : 0; });

  /* the Sage & Co icon opens into its app */
  const L = $('launch'), lp = eio(lin(t, T.launch, T.launch + 0.6));
  if (t >= T.launch && t < T.sage + 0.25) { const r = at(document.querySelector('.mwrap[data-m=sage] .mic'));
    Object.assign(L.style, { opacity:1, left:lerp(r.x, 0, lp)+'px', top:lerp(r.y, 0, lp)+'px', width:lerp(r.w, 390, lp)+'px',
      height:lerp(r.h, 850.6, lp)+'px', borderRadius:lerp(16, 50, lp)+'px', background: lp < .35 ? '#74805C' : '#FCF9F4' }); }
  else L.style.opacity = 0;
  $('home').style.opacity = t < T.sage + 0.1 ? 1 : 0;

  /* the apps slide in one after another, the way switching between them looks on a phone */
  ORDER.forEach((id, i) => { const el = LAYERS[id]; let x, o = 1;
    if (i === 0) { o = eo(lin(t, T.sage - 0.25, T.sage)); x = 0; }
    else x = lerp(390, 0, eio(lin(t, STARTS[i] - SL, STARTS[i])));
    if (i < 3) x -= eio(lin(t, STARTS[i+1] - SL, STARTS[i+1])) * 390;
    el.style.opacity = o; el.style.transform = `translateX(${x.toFixed(2)}px)`;
    STATE[id](el, t - STARTS[i]); });

  /* the home bar follows the screen: dark on the light apps, light on the dark ones */
  const cur = t < T.sage ? 'home' : ORDER[STARTS.filter(s => t >= s - SL/2).length - 1];
  $('hbar').style.background = (cur === 'kes' || cur === 'iro') ? 'rgba(255,255,255,.85)' : 'rgba(17,17,20,.82)';

  /* the touch: a press, then the ring going out */
  const tc = $('touch'); let shown = false;
  TAPS.forEach(([t0, where]) => { if (t >= t0 - 0.12 && t < t0 + 0.55) { const r = where(), p = lin(t, t0 - 0.12, t0 + 0.55);
    shown = true; tc.style.left = (r.x + r.w/2) + 'px'; tc.style.top = (r.y + r.h/2) + 'px';
    const press = p < .2 ? lerp(1.25, .85, p/.2) : lerp(.85, 1, (p-.2)/.8), ring = p < .2 ? 1 : lerp(1, 2.1, eo((p-.2)/.8));
    tc.style.opacity = p < .12 ? p/.12 : p > .55 ? (1 - p)/.45 : 1;
    tc.children[0].style.transform = `scale(${press})`; tc.children[1].style.transform = `scale(${ring})`;
    tc.children[1].style.opacity = p < .2 ? 0 : 1 - (p-.2)/.8; } });
  if (!shown) tc.style.opacity = 0;
};

/* ── the timeline ── */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const clock = { t:0 };
tl.to(clock, { t:29.9, duration:29.9, ease:'none', onUpdate:() => frame(clock.t) }, 0);
frame(0);

/* headlines: the lines rise in through a mask and the marker draws; they leave up before the next scene */
tl.fromTo('#scrim', { opacity:0 }, { opacity:1, duration:0.5 }, 0.1).to('#scrim', { opacity:0, duration:0.4 }, T.fade - 0.3);
HD.forEach((h, i) => {
  tl.fromTo(`#hk${i}`, { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:'power2.out' }, h.s)
    .fromTo(`#hb${i}`, { yPercent:115 }, { yPercent:0, duration:0.65, ease:'power3.out' }, h.s + (h.w ? 0.08 : 0.16))
    .fromTo(`#hm${i}`, { scaleX:0 }, { scaleX:1, duration:0.55, ease:'power2.out' }, h.s + 0.5)
    .to(`#hb${i}`, { yPercent:-115, duration:0.3, ease:'power2.in' }, h.e + 0.05)
    .to(`#hk${i}`, { opacity:0, duration:0.25 }, h.e);
  if (!h.w) tl.fromTo(`#ha${i}`, { yPercent:115 }, { yPercent:0, duration:0.65, ease:'power3.out' }, h.s + 0.05)
    .to(`#ha${i}`, { yPercent:-115, duration:0.3, ease:'power2.in' }, h.e);
});
/* the highlight: Available on Android & iOS, then where it is made */
tl.fromTo('#av1', { yPercent:120 }, { yPercent:0, duration:0.6, ease:'power3.out' }, T.reveal + 1.5)
  .fromTo('#av2', { yPercent:120 }, { yPercent:0, duration:0.65, ease:'power3.out' }, T.reveal + 1.62)
  .fromTo('#avm', { scaleX:0 }, { scaleX:1, duration:0.6, ease:'power2.out' }, T.reveal + 2.05)
  .fromTo('#dash', { opacity:0, y:14 }, { opacity:1, y:0, duration:0.5, ease:'power2.out' }, T.reveal + 2.4)
  .to(['#avail', '#dash'], { opacity:0, duration:0.3 }, T.fade - 0.1);

/* out: the row pulls back into the off-white, which is fully up before the phones' clips end */
tl.to(['#fc0', '#fc1', '#fc2', '#cam'], { scale:0.9, duration:0.7, ease:'power2.in', transformOrigin:'50% 54%' }, T.fade - 0.2)
  .fromTo('#fade', { opacity:0 }, { opacity:1, duration:0.5, ease:'power1.inOut' }, T.fade);

window.__timelines['main'] = tl;
</script>
