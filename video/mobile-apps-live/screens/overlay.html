<!doctype html>
<html><head><meta charset="utf-8">
<!-- Liquid-glass cards as sprites. render-sprites.cjs lays one card out and screenshots it three ways at 3x on a
     transparent page: its outer shadow, its shape (the mask the backdrop blur fills) and its face (fill, rim light,
     type). tools/glass_comp.py then does the glass per frame on the footage with sub-pixel placement. Chromium is kept
     out of the per-frame work because it snaps text to whole pixels, and a card drifting 0.4 px a frame then steps. -->
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../mobile-apps/merchant-fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../../mobile-apps/merchant-fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../../mobile-apps/merchant-fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../mobile-apps/merchant-fonts/inter-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
#stage{position:absolute;left:0;top:0;padding:100px}
.card{display:inline-block;font-family:Inter,sans-serif;color:#0b1220;-webkit-font-smoothing:antialiased}
.glass{position:relative;border-radius:30px;padding:20px 26px 20px 20px;display:flex;align-items:center;gap:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.50),rgba(255,255,255,.26))}
.face .glass{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.30)}
.face .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 64%,rgba(255,255,255,.22) 100%)}
.face .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 22px rgba(255,255,255,.35)}
.shadow .glass{background:transparent;box-shadow:0 34px 70px -28px rgba(10,14,24,.42),0 10px 24px -12px rgba(10,14,24,.22)}
.mask .glass{background:#fff}
.shadow .glass>*,.mask .glass>*{visibility:hidden}
.ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none;position:relative;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px -8px rgba(0,0,0,.35)}
.ic img{display:block}
.tx{position:relative;z-index:1;display:grid;gap:3px}
.k{font-size:14px;font-weight:600;letter-spacing:.02em;color:rgba(11,18,32,.58)}
.t{font-size:25px;font-weight:600;letter-spacing:-.015em;line-height:1.15;color:rgba(11,18,32,.94)}
.s{font-size:18px;font-weight:500;color:rgba(11,18,32,.62)}
.pr{position:relative;z-index:1;margin-left:14px;font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:rgba(11,18,32,.94)}
.ok{background:#34C759;color:#fff;font-size:30px;font-weight:700}
</style></head><body>
<div id="stage"></div>
<script>
// lay out one card in one mode; returns the screenshot box (card plus a 100 px margin for the shadow)
window.sprite = (html, mode) => {
  const st = document.getElementById('stage');
  st.innerHTML = `<div class="card ${mode}" id="c">${html}</div>`;
  const r = document.getElementById('c').getBoundingClientRect();
  return { x: r.left - 100, y: r.top - 100, w: r.width + 200, h: r.height + 200 };
};
</script></body></html>
