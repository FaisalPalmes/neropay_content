<!doctype html>
<html><head><meta charset="utf-8">
<!-- Liquid-glass cards over live footage. render-overlay.cjs loads a spec (frames + cards with per-frame x, y, scale,
     opacity), sets each composited frame as the backdrop and screenshots. The glass really blurs and bends the frame
     behind it, because the frame is in the same document. -->
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../mobile-apps/merchant-fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../../mobile-apps/merchant-fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../../mobile-apps/merchant-fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../mobile-apps/merchant-fonts/inter-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden}
#bg{position:absolute;left:0;top:0;display:block}
.card{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity;font-family:Inter,sans-serif;color:#0b1220}
.glass{position:relative;border-radius:30px;padding:20px 26px 20px 20px;display:flex;align-items:center;gap:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.52),rgba(255,255,255,.30));
  backdrop-filter:blur(18px) saturate(175%) brightness(1.06);-webkit-backdrop-filter:blur(18px) saturate(175%) brightness(1.06);
  box-shadow:0 34px 70px -28px rgba(10,14,24,.45),0 10px 24px -12px rgba(10,14,24,.25),
             inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 64%,rgba(255,255,255,.22) 100%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 22px rgba(255,255,255,.35)}
.ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none;position:relative;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px -8px rgba(0,0,0,.35)}
.tx{position:relative;z-index:1;display:grid;gap:3px}
.k{font-size:14px;font-weight:600;letter-spacing:.02em;color:rgba(11,18,32,.58)}
.t{font-size:25px;font-weight:600;letter-spacing:-.015em;line-height:1.15;color:rgba(11,18,32,.94)}
.s{font-size:18px;font-weight:500;color:rgba(11,18,32,.62)}
.pr{position:relative;z-index:1;margin-left:14px;font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:rgba(11,18,32,.94)}
.ok{background:#34C759;color:#fff;font-size:30px;font-weight:700}
</style></head><body>
<div id="stage"><img id="bg" alt=""></div>
<script>
let SPEC = null;
window.init = spec => {
  SPEC = spec; const st = document.getElementById('stage');
  st.style.width = spec.w + 'px'; st.style.height = spec.h + 'px';
  for (const c of spec.cards) { const d = document.createElement('div'); d.className = 'card'; d.id = 'c_' + c.id; d.innerHTML = c.html; st.appendChild(d); }
};
window.setFrame = async n => {
  const bg = document.getElementById('bg');
  await new Promise(r => { bg.onload = r; bg.src = SPEC.frames[n]; });
  for (const c of SPEC.cards) {
    const d = document.getElementById('c_' + c.id), [x, y, s, o, dy] = c.f[n];
    d.style.opacity = o; d.style.visibility = o > 0.001 ? 'visible' : 'hidden';
    const w = d.offsetWidth, h = d.offsetHeight;
    d.style.transform = `translate(${x - w / 2}px, ${y - h / 2 + dy}px) scale(${s})`;
  }
};
</script></body></html>
