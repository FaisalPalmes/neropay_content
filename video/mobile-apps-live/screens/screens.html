<div id="root"></div>
<script>
const APP = new URLSearchParams(location.search).get('app') || 'sage';
const root = document.getElementById('root');
const cl = (x, a, b) => Math.min(b, Math.max(a, x)), lin = (t, a, b) => cl((t - a) / (b - a), 0, 1);
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// iOS-style spring (critically damped-ish), used for the push, sheets and bars
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - (1 + 8 * x) * Math.exp(-8 * x)) / (1 - 9 * Math.exp(-8));
const $ = id => document.getElementById(id);
const SB = c => `<div class="sb" style="color:${c}">9:41<span class="ic">
  <svg width="19" height="12" viewBox="0 0 19 12" fill="${c}"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12" fill="${c}"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.8 10.8 0 0 0 8.5.5 10.8 10.8 0 0 0 1 3.5l1.2 1.3a9 9 0 0 1 6.3-2.5z"/><path d="M8.5 5.9c1.4 0 2.7.5 3.7 1.4l1.2-1.3a7.2 7.2 0 0 0-9.8 0l1.2 1.3c1-.9 2.3-1.4 3.7-1.4z"/><path d="M8.5 9.4 10.4 7.4a2.7 2.7 0 0 0-3.8 0z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="${c}" opacity=".4"/><rect x="2.2" y="2.2" width="19.6" height="8.6" rx="2.4" fill="${c}"/><path d="M25 4.3v4.4c.8-.3 1.4-1.2 1.4-2.2s-.6-1.9-1.4-2.2z" fill="${c}" opacity=".45"/></svg></span></div>`;
let F = null;                                    // fingers-*.json
window.setup = f => { F = f; build(); };
window.render = n => draw(n, n / 24);

// ───────────────────────── Sage & Co ─────────────────────────
function build() {
if (APP === 'sage') {
  const plus = '<svg width="16" height="16" viewBox="0 0 16 16" stroke="#23261C" stroke-width="2.2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>';
  const grid = [['latte', 'Flat white', 'Oat or whole milk', '£3.40'], ['painchoc', 'Pain au chocolat', 'Butter, dark chocolate', '£3.20'],
                ['muffin', 'Blueberry muffin', 'Baked this morning', '£3.10'], ['tart', 'Lemon tart', 'Sharp curd, crisp base', '£4.20']];
  root.innerHTML = `<div class="app sage">${SB('#23261C')}
   <div class="top" id="top"><b>Sage &amp; Co</b><div class="hair"></div></div>
   <div class="scroll" id="sc">
    <div class="hd"><img src="sage-icon.svg" alt=""><div class="nm"><b>Sage &amp; Co</b><small><i></i>Ancoats · Open until 5pm</small></div>
      <span class="rb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23261C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span></div>
    <div class="seg"><span class="on">Collect</span><span>Eat in</span></div>
    <div class="hero"><img class="ph" src="img/sage-hero.jpg" alt=""><div class="tx"><div class="k">BAKED IN-HOUSE FROM 6AM</div><h2>Sit. Stay. <em>Savour.</em></h2></div></div>
    <div class="chips"><span class="on">All</span><span>Coffee</span><span>Bakery</span><span>Brunch</span><span>Cold drinks</span></div>
    <div class="loy"><span class="st">${[1,1,1,0,0,0,0,0].map(x => `<i class="${x ? 'on' : ''}"></i>`).join('')}</span><span class="t"><b>3 of 8 stamps</b><small>Your 8th coffee is on us</small></span></div>
    <div id="sp" style="height:0"></div>
    <div class="sh"><b>Fresh this morning</b><span>6 left</span></div>
    <div class="feat"><div class="im"><img class="ph" src="img/croissant.jpg" alt=""><span class="badge">Baker's pick</span></div>
      <div class="bd"><h3>Almond croissant</h3><p>Twice-baked, frangipane filling, toasted flaked almonds.</p>
        <div class="tags"><span>Vegetarian</span><span>Contains nuts</span></div>

      <span class="rb"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2E1822" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>

function draw(n, t) {
if (APP === 'sage') {
  const s = F.scroll[n];
  $('sc').style.transform = `translateY(${-s}px)`;
  $('top').style.opacity = lin(s, 30, 70);                        // compact title once the header scrolls away
  const [p0, p1] = F.press, pressed = t >= p0 + 0.04 && t < p1;
  const b = $('btn'); b.style.transform = `scale(${pressed ? 0.965 : 1})`; b.style.filter = pressed ? 'brightness(1.35)' : 'none';
  const done = lin(t, p1, p1 + 0.18); $('bb').style.opacity = done; $('ba').style.opacity = 1 - done;
  const k = spring(lin(t, p1 + 0.08, p1 + 0.65)), bk = $('bk');
  bk.style.transform = `translateY(${(1 - k) * 120}px)`; bk.style.opacity = lin(t, p1 + 0.08, p1 + 0.2);
} else {
  const [a0, a1] = F.press1, [c0, c1] = F.press3;
  // tap 1: the row highlights while pressed, fades on lift; the next screen pushes in (iOS: 0.45 s, spring)
  const hl = t >= a0 + 0.03 && t < a1 ? 1 : 1 - lin(t, a1, a1 + 0.22); $('hl2').style.opacity = t >= a0 + 0.03 ? hl : 0;
  const p = spring(lin(t, a1 + 0.04, a1 + 0.56));
  $('s2').style.transform = `translateX(${(1 - p) * 390}px)`; $('s1').style.transform = `translateX(${-p * 110}px)`;
  $('dim').style.opacity = p * 0.08; $('s2').style.boxShadow = p > 0 && p < 1 ? '-10px 0 30px rgba(0,0,0,.08)' : 'none';
  $('sc2').style.transform = `translateY(${-F.scroll[n]}px)`;
  // tap 3: 11:30 presses in, fills on lift; the button wakes; then the confirmation sheet rises
  const pr = t >= c0 + 0.04 && t < c1, on = lin(t, c1, c1 + 0.14);
  $('slot').style.transform = `scale(${pr ? 0.94 : 1 + 0.03 * Math.sin(Math.PI * on)})`; $('slotf').style.opacity = on;
  $('ctaon').style.opacity = on;
  const sh = spring(lin(t, c1 + 0.12, c1 + 0.6));
  $('sheet').style.transform = `translateY(${(1 - sh) * 460}px)`; $('shdim').style.opacity = sh * 0.28;
}
}
