<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NeroPay social — quote</title>
<link rel="stylesheet" href="stage.css">
<style>
  .lglass .body{display:flex;flex-direction:column;gap:38px}
  .quote::before{content:"\201C";display:block;font-size:120px;line-height:.6;color:var(--y);margin-bottom:24px;font-family:"Source Serif 4",Georgia,serif}
</style></head>
<body data-post>
<div class="stage">
  <div class="bgd"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><i class="frost"></i></div>
  <div class="kick" data-f="kick">Statement</div>
  <div class="lglass"><i class="tint"></i><i class="sheen"></i>
    <div class="body">
      <div class="quote serif" data-f="text">We tell some merchants to stay put.</div>
      <div class="sub" data-f="sub">Most weeks. On purpose.</div>
    </div>
  <i class="rim"></i></div>
  <img class="wm" src="../../brand/logos/neropay-light-640.png" alt="NeroPay">
  <div class="src" data-f="src"></div>
</div>
<script>
/* fill({size, kick, text, sub, src}). The quote is Source Serif 4 — the one editorial secondary on this card. */
window.fill = function (d) {
  var R = document.documentElement.style, SZ = { sq: [1080, 1080, 90, 90, 90], pt: [1080, 1350, 90, 90, 90], st: [1080, 1920, 100, 270, 340] };
  var s = SZ[d.size] || SZ.sq;
  R.setProperty('--w', s[0] + 'px'); R.setProperty('--h', s[1] + 'px'); R.setProperty('--m', s[2] + 'px');
  R.setProperty('--top', s[3] + 'px'); R.setProperty('--bot', s[4] + 'px');
  var set = function (k, v) { var el = document.querySelector('[data-f="' + k + '"]'); if (el) el.textContent = v == null ? '' : String(v); };
  set('kick', d.kick || 'Statement'); set('text', d.text); set('sub', d.sub || ''); set('src', d.src || '');
  var q = document.querySelector('[data-f="text"]'), n = String(d.text || '').length;
  q.style.fontSize = n <= 60 ? '64px' : n <= 110 ? '54px' : n <= 170 ? '46px' : '40px';
  return document.fonts.ready;
};
</script>
</body></html>
