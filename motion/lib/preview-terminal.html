<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Chivo;src:url(../assets/fonts/chivo-latin-800-normal.woff2)format("woff2");font-weight:800}
@font-face{font-family:Chivo;src:url(../assets/fonts/chivo-latin-600-normal.woff2)format("woff2");font-weight:600}
@font-face{font-family:Chivo;src:url(../assets/fonts/chivo-latin-400-normal.woff2)format("woff2");font-weight:400}
@font-face{font-family:"Martian Mono";src:url(../assets/fonts/martian-mono-latin-700-normal.woff2)format("woff2");font-weight:700}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,#FDFCFA,#F1EFE8)} .row{display:flex;gap:0;padding:0}
canvas{display:block;width:640px;height:900px}
</style>
<div class="row"><canvas id="a"></canvas><canvas id="b"></canvas><canvas id="c"></canvas></div>
<script>window.READY = false;</script>
<script type="module">
import { view, neroTerminal } from './objects3d.js';
await document.fonts.ready;
await Promise.all(['800 84px Chivo','600 52px Chivo','400 26px Chivo','700 54px "Martian Mono"'].map(f => document.fonts.load(f)));
const va = view(document.getElementById('a'), { w:640, h:900, span:9.2, elev:14, azim:-30, ty:7.2 }); const t1 = va.add(neroTerminal()); t1.rotation.y = -.2;
const vb = view(document.getElementById('b'), { w:640, h:900, span:9.2, elev:12, azim:4, ty:7.2 });  const t2 = vb.add(neroTerminal()); t2.rotation.y = .05;
const vc = view(document.getElementById('c'), { w:640, h:900, span:4.6, elev:22, azim:-38, ty:12.4 }); const t3 = vc.add(neroTerminal()); t3.rotation.y = .35;
va.render(); vb.render(); vc.render();
window.READY = true;
</script>
