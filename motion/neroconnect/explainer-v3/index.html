<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NeroConnect explainer v3</title>
<style>
/* NeroConnect explainer v3 (24 Sep 2026), rebuilt on the new brand at Faisal's request.
   His notes on v2: "the motion graphics could be a lot better, a bit clumsy and too much going on on the screen,
   keep it more minimal; no pill-shaped overlays at all; more real, clear liquid glass; everything has a hard bevel
   edge, I don't want that." So: one idea per frame, a headline and one glass object, nothing cropped by the frame;
   clear glass with a hairline rim and a soft shadow, no thick inset rim, no pills anywhere; Poppins, ink and
   #FFCF24 on the warm off-white ground; one soft yellow light that moves to a new place for each scene, and two
   huge clear panes drifting behind. The take is the 18 Sep recording, unchanged; every reveal is pinned to the word
   that says it (data-at = seconds on the film's timeline, the take sits at 0.6 s). The film ends on the locked
   outro (brand/sting/outro.html, yellow), spliced in by render.cjs at OUTRO_AT.
   Figures: only the seven approved in the 18 Sep kit (claims in README.md), plus the dashboard's "2". No rate, no
   percentage, no date, no real company. */
@font-face{font-family:P;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
:root{--yel:#FFCF24;--ink:#111114;--mute:#6B6B73;--live:#2FBF71}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FBFAF7}   /* 1:1: the adapter at the foot narrows them to 1080 */
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

/* the world: paper, one light, two clear panes */
#ground{position:absolute;inset:0;background:radial-gradient(140% 120% at 50% 45%,#FBFAF7 55%,#F3F0E8 100%)}
#light{position:absolute;left:0;top:0;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,207,36,.34) 0%,rgba(255,207,36,.20) 22%,rgba(255,207,36,.08) 42%,rgba(255,207,36,.025) 58%,rgba(255,207,36,0) 70%)}
.pane{position:absolute;width:1700px;height:1700px;border-radius:120px;
  background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 45%,rgba(255,255,255,.18));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),inset 0 2px 0 rgba(255,255,255,.95),0 60px 120px -60px rgba(120,95,30,.16)}
.pane i{position:absolute;top:-20%;bottom:-20%;left:-60%;width:220%;background:linear-gradient(105deg,rgba(255,255,255,0) 45%,rgba(255,255,255,.55) 49.5%,rgba(255,255,255,.12) 51%,rgba(255,255,255,0) 55%)}

/* a scene: a layer the whole frame wide; its contents are placed absolutely */
.sc{position:absolute;inset:0;opacity:0}
.cam{position:absolute;inset:0;transform-origin:var(--ox,60%) var(--oy,50%)}

/* type */
.kick{position:absolute;display:flex;align-items:center;gap:14px;font:600 20px/1 P;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.kick b{display:block;width:34px;height:5px;border-radius:3px;background:var(--yel)}
.h{position:absolute;font:700 76px/1.04 P;letter-spacing:-.035em}
.h.xl{font-size:104px}
.h .ln{display:block}
.mk{position:relative;display:inline-block;isolation:isolate}
.mk::before{content:"";position:absolute;left:-6px;right:-8px;bottom:.07em;height:.36em;background:var(--yel);border-radius:3px;z-index:-1;
  transform:scaleX(var(--m,0));transform-origin:0 50%}
.sub{position:absolute;font:500 30px/1.35 P;color:var(--mute);letter-spacing:-.01em}
.lab{font:500 22px/1.2 P;color:var(--mute);letter-spacing:-.005em}
.big{font:600 58px/1 P;letter-spacing:-.03em}
.mid{font:600 34px/1.15 P;letter-spacing:-.02em}

/* clear glass: a translucent body, a hairline rim, a bright top edge, a soft shadow; no thick inset rim */
.g{position:absolute;border-radius:30px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.17) 52%,rgba(255,255,255,.30) 100%);
  box-shadow:0 50px 90px -46px rgba(70,56,20,.30),0 14px 30px -18px rgba(17,17,20,.10),
    inset 0 0 0 1px rgba(255,255,255,.95),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(120,96,30,.07),inset 0 0 60px rgba(255,255,255,.28);
  outline:1px solid rgba(17,17,20,.045);outline-offset:-1px}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(110% 55% at 20% 0%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,0) 18%)}
.g::after{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 60%);
  transform:translateX(var(--sh,-130%))}
.g > *{position:relative;z-index:1}
.row{display:flex;align-items:center;justify-content:space-between}
.rule{position:absolute;left:0;top:18%;bottom:18%;width:5px;border-radius:0 3px 3px 0;background:var(--yel);transform:scaleY(var(--r,0))}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--live);margin-right:12px;vertical-align:1px}
.ydot{background:var(--yel)}
.hair{height:1px;background:rgba(17,17,20,.08)}
/* the pointer (24 Sep 2026): whatever she names flashes a soft yellow wash as it lands, then lets go */
.hitfx{position:absolute;left:-14px;right:-14px;top:-10px;bottom:-10px;border-radius:14px;pointer-events:none;opacity:0;
  background:rgba(255,207,36,.26);box-shadow:0 0 0 2px rgba(255,207,36,.55),0 0 34px rgba(255,207,36,.35)}
.g > .hitfx{position:absolute;inset:0;border-radius:inherit;z-index:0}
[data-hit]:not(.g){position:relative}   /* never on a card: a .g is placed absolutely, and v3.4 knocked the flashed cards into page flow (Faisal's screenshots, 24 Sep) */
/* the mark, small, bottom right, the whole film: the locked sting's yellow glass tile (brand/sting), 78 px */
#bug{position:absolute;right:58px;bottom:50px;width:78px;height:74.6px;opacity:0;z-index:20}
#bug .t{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,224,104,.98) 0%,#FFCF24 50%,#F4BC08 100%);
  box-shadow:0 14px 26px -12px rgba(17,17,20,.30),0 4px 9px -5px rgba(17,17,20,.16),inset 0 0 0 3px rgba(255,255,255,.14),
    inset 0 0 10px rgba(160,110,0,.22),inset 0 -1px 2px rgba(120,80,0,.18),inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.7)}
#bug .t::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 58%)}

window.OUTRO_AT = 136.58;   /* the locked outro takes over here (render.cjs splices it in): the neroconnect wordmark is still whole as she says "NeroConnect" (137.34) and the line slides out on "are at" (139.17) */
window.DURATION = 144.88;   /* the outro holds its last frame 2.5 s longer (Faisal, 24 Sep) */

const film = document.getElementById('film'), L = document.getElementById('light');
const P1 = document.getElementById('p1'), P2 = document.getElementById('p2');
SC.forEach(s => { const d = document.createElement('div'); d.className = 'sc';
  d.innerHTML = `<div class="cam" style="--ox:${s.ox}">${s.html}</div>`; film.appendChild(d); s.el = d; s.cam = d.firstChild;
  s.items = [...d.querySelectorAll('[data-at]')]; s.marks = [...d.querySelectorAll('[data-mark]')];
  s.counts = [...d.querySelectorAll('[data-count]')]; s.rules = [...d.querySelectorAll('[data-rule]')];
  s.glass = [...d.querySelectorAll('.g')];
  s.hits = [...d.querySelectorAll('[data-hit]')].map(e => { const fx = document.createElement('i'); fx.className = 'hitfx'; e.prepend(fx); return [e, fx]; }); });

const XF = 0.4;
window.setTime = function (t) {
  /* the light glides to each scene's place over a second, starting as the scene arrives */
  let lx = SC[0].light[0], ly = SC[0].light[1];
  for (let i = 1; i < SC.length; i++) { const k = io(clamp((t - SC[i].t[0] + 0.6) / 2.4));
    lx += (SC[i].light[0] - lx) * k; ly += (SC[i].light[1] - ly) * k; }
  lx += 110 * Math.sin(t / 5.3) + 50 * Math.sin(t / 2.9); ly += 80 * Math.cos(t / 6.1) + 40 * Math.sin(t / 3.7);   /* it never stops moving */
  const endFade = 1 - clamp((t - (OUTRO_AT - 0.7)) / 0.6);
  L.style.transform = `translate(${lx}px,${ly}px)`; L.style.opacity = endFade;
  document.getElementById('ground').style.opacity = endFade;   /* plain #FBFAF7 underneath, the outro's own ground */
  P1.style.transform = `translate(${-700 + 60 * Math.sin(t / 19)}px,${-1150 + 40 * Math.cos(t / 23)}px) rotate(${38 + 1.5 * Math.sin(t / 17)}deg)`;
  P2.style.transform = `translate(${1150 + 50 * Math.cos(t / 21)}px,${250 + 40 * Math.sin(t / 25)}px) rotate(${38 + 1.2 * Math.cos(t / 15)}deg)`;
  P1.querySelector('i').style.transform = P2.querySelector('i').style.transform = `translateX(${((t * 6) % 140) - 70}%)`;
  P1.style.opacity = P2.style.opacity = endFade;
  document.getElementById('bug').style.opacity = 0.92 * outC(clamp((t - 0.60) / 0.8)) * (1 - clamp((t - (OUTRO_AT - 1.2)) / 0.5));
  /* the row she is pointing at: a yellow wash that pulses twice and stays faintly lit */
  document.querySelectorAll('[data-flash]').forEach(r => { const d = t - +r.dataset.flash;
    const a = d < 0 ? 0 : 0.10 + (d < 1.4 ? 0.22 * Math.max(0, Math.sin(d / 0.7 * 2 * Math.PI)) : 0);
    r.style.background = `rgba(255,207,36,${a.toFixed(3)})`; });

  for (const s of SC) {
    const [a, b] = s.t;
    if (t < a - 0.01 || t > b + XF) { s.el.style.display = 'none'; continue; }
    s.el.style.display = '';
    const vin = outC(clamp((t - a) / XF)), vout = 1 - io(clamp((t - b) / XF));
    s.el.style.opacity = Math.min(vin, vout);
    const push = (t - a) / (b - a);
    s.cam.style.transform = `translateY(${Math.round(-10 * io(clamp((t - b) / XF)))}px)`;
    for (const im of s.el.querySelectorAll('[data-push]')) im.style.scale = String(1 + 0.03 * push);
    for (const e of s.items) { const p = outE(clamp((t - +e.dataset.at) / 0.55));
      e.style.opacity = p; e.style.transform = e.dataset.slide !== undefined ? `translateX(${Math.round((1 - p) * 90)}px)` : (e.style.transform || '').replace(/translateY\([^)]*\)/, '') + ` translateY(${Math.round((1 - p) * 26)}px)`;
      if (e.classList.contains('g')) e.style.setProperty('--sh', `${-130 + 260 * io(clamp((t - +e.dataset.at - 0.15) / 1.0))}%`); }
    for (const [e, fx] of s.hits) { const d = t - +e.dataset.at - 0.12;
      fx.style.opacity = d < 0 ? 0 : d < 0.18 ? d / 0.18 : Math.max(0, 1 - (d - 0.18) / 1.0); }
    for (const m of s.marks) m.style.setProperty('--m', outC(clamp((t - +m.dataset.mark) / 0.35)));
    for (const r of s.rules) r.style.setProperty('--r', outC(clamp((t - +r.dataset.rule) / 0.35)));
    for (const c of s.counts) { const at = +c.closest('[data-at]').dataset.at, v = +c.dataset.count;
      const k = outC(clamp((t - at) / 0.9)); c.textContent = c.dataset.int ? String(Math.round(v * k)) : money(v * k); }
  }
  /* the swap plates (v3.6): a slow push, then the top plate is revealed behind a band of light on the word */
  const sweep = (el, at) => { const k = clamp((t - at) / 0.7); el.style.setProperty('--w', (-12 + 124 * io(k)).toFixed(2) + '%');
    el.style.setProperty('--bo', (k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0).toFixed(3)); };
  const hook = document.getElementById('hook');
  if (hook) { hook.style.scale = String(1 + 0.03 * clamp(t / 6.6)); hook.style.transformOrigin = '37% 75%'; sweep(hook, 5.80); }
  const sw = document.getElementById('swap'), swh = document.getElementById('swaph');
  if (sw) { sweep(sw, 85.16);
    /* on "domain" the camera pulls back: the plate shrinks to its place beside the login card */
    const k = io(clamp((t - 85.86) / 0.9)), L = (x, y) => x + (y - x) * k;
    const F = PL.swapFull, P = PL.swapSplit; sw.style.left = L(F[0], P[0]) + 'px'; sw.style.top = L(F[1], P[1]) + 'px'; sw.style.width = sw.style.height = L(F[2], P[2]) + 'px';
    swh.style.opacity = +swh.style.opacity * (1 - clamp((t - 85.81) / 0.3)); }
  /* scene-specific moves */
  const fill = document.getElementById('fill');
  /* the steps she names: details (1, 2) · NeroPay runs the checks (3, 4) · taking payments (5) */
  const STEP = [51.30, 51.78, 53.41, 53.84, 54.76];
  if (fill) { let f = 0; for (let i = 1; i < 5; i++) f += 0.25 * io(clamp((t - STEP[i] + 0.35) / 0.5)); fill.style.transform = `scaleX(${f})`; }
  document.querySelectorAll('[data-step]').forEach(n => { const i = +n.dataset.step, lit = t > STEP[i];
    n.style.background = lit ? (i === 4 ? 'linear-gradient(160deg,#FFE27A,#FFCF24)' : 'rgba(255,248,220,.95)') : ''; });
  const knob = document.getElementById('knob');
  if (knob) { const k = io(clamp((t - 77.28) / 1.4)); const bump = t > 78.75 ? Math.sin(clamp((t - 78.75) / 0.35) * Math.PI) * 1.2 : 0;
    knob.style.left = (78 - 44 * k + bump) + '%'; }
  const l1 = document.getElementById('l1'), l2 = document.getElementById('l2');
  if (l1) { for (const [p, at] of [[l1, 109.01], [l2, 111.22]]) { const len = p.getTotalLength(); p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len * (1 - io(clamp((t - at) / 1.8))); } }
  const res = document.getElementById('res');
  if (res) res.style.transform = `translateY(${Math.round((1 - outE(clamp((t - 115.83) / 0.7))) * -160)}px)`;
};
window.setFrame = (n, fps = 25) => window.setTime(n / fps);
/* for check-still.cjs: a moment in each scene after its last reveal and before it leaves */
window.SCENES_FOR_CHECK = () => SC.map((s, i) => {
  const h = s.el.querySelector('.h:not(#swaph)'); if (!h) return { i, t: null };   /* "Your logo." leaves before the scene settles */
  const own = [h, ...h.querySelectorAll('[data-at],[data-mark]')];
  const last = Math.max(s.t[0], ...own.map(e => +(e.dataset.at || e.dataset.mark || 0)));
  const t = last + 0.9; return { i, t: t < s.t[1] - 0.15 ? t : null }; });

/* ---- the 1:1 square (Faisal, 25 Sep 2026: "redo overlays and re layout so it all makes sense and nothing overlaps").
   Every scene is laid out at 16:9, measured, then re-placed for 1080 x 1080: its headline column (kickers, headlines, subs
   on the left) keeps its type size and moves to the top-left; everything else (the glass, the diagrams) moves as one block
   below it, scaled once and statically to fit what is left, centred; lines that sat at the foot stay at the foot. A static
   scale never shimmers (the v3 jitter came from animating a scale). The hook, the swap and the close are placed by hand. */
window.LAYOUT_READY = !SQ;   /* renderers and gates wait for it: the square is measured with the brand fonts loaded */
if (SQ) document.fonts.ready.then(() => {
  const M = 70, TOP = 80, GAP = 46;
  SC.forEach(sc => { sc.el.style.display = ''; });        /* hidden scenes measure as zero: show them all to measure */
  const HAND = {                                     /* scene index: hand placements, [left, top, width?] by selector */
    0: { '#hook': [330, 92, 900] },
    10: { '#swap': PL.swapFull },
  };
  SC.forEach((sc, i) => {
    sc.light = [sc.light[0] * W / 1920, sc.light[1]];
    const kids = [...sc.cam.children].filter(e => e.nodeType === 1);
    const box = e => ({ l: e.offsetLeft, t: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight });
    const B = new Map(kids.map(e => [e, box(e)]));
    const isText = e => /\b(h|kick|sub|mid)\b/.test(e.className) && !e.classList.contains('g');
    const hand = HAND[i] || {};
    const handEls = new Set(Object.keys(hand).map(q => sc.cam.querySelector(q)).filter(Boolean));
    if (i === 16) {                                   /* the close: the counter photo fills the square, the lines sit on it */
      const ph = sc.cam.querySelector('.ph'); ph.style.width = W + 'px'; ph.style.height = H + 'px';
      
    }
    const head = kids.filter(e => !handEls.has(e) && isText(e) && B.get(e).l <= 160 && B.get(e).t < 850 && !(i === 10 && e.id !== 'swaph' && false));
    const foot = kids.filter(e => !handEls.has(e) && isText(e) && B.get(e).t >= 850);
    const body = kids.filter(e => !handEls.has(e) && !head.includes(e) && !foot.includes(e) && !e.classList.contains('ph'));
    /* the swap scene: "Your logo." belongs with the full-frame plate; "Your brand." heads the square after the pull-back */
    let hy = TOP, headBottom = TOP;
    if (head.length) {
      const t0 = Math.min(...head.map(e => B.get(e).t));
      for (const e of head) { const b = B.get(e); e.style.left = M + 'px'; e.style.right = 'auto';
        if (e.classList.contains('h') || e.classList.contains('mid')) e.style.width = (W - 2 * M) + 'px';
        e.style.top = (hy + b.t - t0) + 'px'; }
      headBottom = Math.max(...head.map(e => e.offsetTop + e.offsetHeight));
    }
    for (const e of foot) { const b = B.get(e), right = !!e.style.right && e.style.right !== 'auto'; e.style.top = (H - 70 - b.h) + 'px';
      if (right) { e.style.left = 'auto'; e.style.right = '150px'; }   /* clear of the corner mark */ else { e.style.left = M + 'px'; e.style.right = 'auto'; } }
    const footTop = foot.length ? H - 70 - Math.max(...foot.map(e => B.get(e).h)) - 30 : 930;   /* clear of the corner mark */
    if (body.length && i !== 10) {
      const bx = Math.min(...body.map(e => B.get(e).l)), by = Math.min(...body.map(e => B.get(e).t));
      const bw = Math.max(...body.map(e => B.get(e).l + B.get(e).w)) - bx, bh = Math.max(...body.map(e => B.get(e).t + B.get(e).h)) - by;
      const y0 = (head.length ? headBottom + GAP : TOP), avail = footTop - y0;
      const k = Math.min(1, (W - 2 * M) / bw, avail / bh);
      const x0 = (W - bw * k) / 2, yy = y0 + Math.max(0, (avail - bh * k) / 2);
      for (const e of body) { const b = B.get(e); e.style.left = (x0 + (b.l - bx) * k) + 'px'; e.style.top = (yy + (b.t - by) * k) + 'px';
        e.style.right = 'auto'; e.style.transformOrigin = '0 0'; e.style.scale = String(k); }
    }
    for (const [q, g] of Object.entries(hand)) { const e = sc.cam.querySelector(q); if (!e) continue;
      e.style.left = g[0] + 'px'; e.style.top = g[1] + 'px'; if (g[2]) e.style.width = e.style.height = g[2] + 'px'; }
    const place = (e, l, t, k) => { e.style.left = l + 'px'; e.style.top = t + 'px'; e.style.right = 'auto'; e.style.transformOrigin = '0 0'; e.style.scale = String(k); };
    if (i === 1) {                                    /* the three businesses: two over one, larger than a row of three */
      const g = [...sc.cam.querySelectorAll(':scope > .g')], k = 0.62, y = headBottom + 40;
      place(g[0], 180, y, k); place(g[1], W - 180 - 500 * k, y, k); place(g[2], (W - 500 * k) / 2, y + 420 * k + 24, k);
    }
    if (i === 8) {                                    /* the maths: fee, minus cost, equals margin, down the square */
      const g = [...sc.cam.querySelectorAll(':scope > .g')], ops = [...sc.cam.querySelectorAll(':scope > .h')].slice(1);
      const h0 = sc.cam.querySelector(':scope > .h'), sub = sc.cam.querySelector(':scope > .sub');
      sub.style.top = (H - 70 - sub.offsetHeight) + 'px';           /* "On every payment." goes to the foot */
      const k = 0.74, cw = 470 * k, ch = 260 * k, x = (W - cw) / 2, y0 = h0.offsetTop + h0.offsetHeight + 40, step = ch + 58;
      g.forEach((e, j) => place(e, x, y0 + j * step, k));
      ops.forEach((e, j) => { e.style.width = '60px'; e.style.textAlign = 'center'; e.style.fontSize = '46px'; e.style.lineHeight = '46px'; e.style.scale = '1';
        e.style.left = (W / 2 - 30) + 'px'; e.style.top = (y0 + j * step + ch + 6) + 'px'; });
    }
    if (i === 16) {                                   /* the close: lines in a column on the left, clear of the terminal */
      const h = sc.cam.querySelector('.h'), q = sc.cam.querySelector('.mid');
      h.style.fontSize = '70px'; h.style.width = '620px'; h.style.top = '110px';
      q.style.width = '520px'; q.style.fontSize = '34px'; q.style.top = (h.offsetTop + h.offsetHeight + 34) + 'px';
      sc.cam.querySelector('.ph img').style.objectPosition = '60% 50%';
    }
    if (i === 0) {                                    /* the hook: the terminal right of centre, the lines in a column on the left, centred */
      const k = sc.cam.querySelector('.kick'), hs = [...sc.cam.querySelectorAll(':scope > .h')];
      hs.forEach(h => { h.style.fontSize = '60px'; h.style.width = '470px'; });
      k.style.top = '360px'; hs[0].style.top = '400px'; hs[1].style.top = (400 + hs[0].offsetHeight + 34) + 'px';
    }
    if (i === 10) {                                   /* after the pull-back: headline top, login card left, terminal right */
      const card = sc.cam.querySelector('.g'), brand = [...sc.cam.querySelectorAll('.h')].find(e => e.id !== 'swaph');
      const logo = sc.cam.querySelector('#swaph');
      brand.style.left = M + 'px'; brand.style.top = TOP + 'px'; brand.style.width = (W - 2 * M) + 'px';
      logo.style.left = M + 'px'; logo.style.top = '490px';   /* "Your logo." beside the full-frame terminal, at its middle */
      const k = 0.62; card.style.transformOrigin = '0 0'; card.style.scale = String(k);
      card.style.left = M + 'px'; card.style.top = (brand.offsetTop + brand.offsetHeight + GAP) + 'px';
    }
  });
  document.documentElement.style.width = document.body.style.width = W + 'px';
  window.LAYOUT_READY = true; window.setTime(0);
});
window.setTime(0);
</script></body></html>
