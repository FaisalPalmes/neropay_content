<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Partner Programme: The High Street</title>
<style>
/* Partner Programme advert, style C, "The High Street" (25 Sep 2026). Built by the CONTENT VIDEO session at Faisal's request for
   two new explainer styles. A drawn street of shopfronts the camera walks along: each shop lights on the word that names it,
   lines run from "You" to every business introduced, the bonus and the share land in the band above the roofs with their
   conditions, and the whole network lights up. Figures from motion/partner/BRIEF.md v4; every one sits with its condition. */
@font-face{font-family:P;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
:root{--yel:#FFCF24;--ink:#111114;--mute:#6B6B73;--live:#2FBF71}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FBFAF7}   /* 1:1: the adapter at the foot narrows them to 1080 */
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

/* the world: paper, one light, two clear panes */
#ground{position:absolute;inset:0;background:radial-gradient(140% 120% at 50% 45%,#FBFAF7 55%,#F3F0E8 100%)}
#light{position:absolute;left:0;top:0;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,207,36,.34) 0%,rgba(255,207,36,.20) 22%,rgba(255,207,36,.08) 42%,rgba(255,207,36,.025) 58%,rgba(255,207,36,0) 70%)}
.pane{position:absolute;width:1700px;height:1700px;border-radius:120px;
  background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 45%,rgba(255,255,255,.18));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),inset 0 2px 0 rgba(255,255,255,.95),0 60px 120px -60px rgba(120,95,30,.16)}
.pane i{position:absolute;top:-20%;bottom:-20%;left:-60%;width:220%;background:linear-gradient(105deg,rgba(255,255,255,0) 45%,rgba(255,255,255,.55) 49.5%,rgba(255,255,255,.12) 51%,rgba(255,255,255,0) 55%)}

/* a scene: a layer the whole frame wide; its contents are placed absolutely */
.sc{position:absolute;inset:0;opacity:0}
.cam{position:absolute;inset:0;transform-origin:var(--ox,60%) var(--oy,50%)}

/* type */
.kick{position:absolute;display:flex;align-items:center;gap:14px;font:600 20px/1 P;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.kick b{display:block;width:34px;height:5px;border-radius:3px;background:var(--yel)}
.h{position:absolute;font:700 76px/1.04 P;letter-spacing:-.035em}
.h.xl{font-size:104px}
.h .ln{display:block}
.mk{position:relative;display:inline-block;isolation:isolate}
.mk::before{content:"";position:absolute;left:-6px;right:-8px;bottom:.07em;height:.36em;background:var(--yel);border-radius:3px;z-index:-1;
  transform:scaleX(var(--m,0));transform-origin:0 50%}
.sub{position:absolute;font:500 30px/1.35 P;color:var(--mute);letter-spacing:-.01em}
.lab{font:500 22px/1.2 P;color:var(--mute);letter-spacing:-.005em}
.big{font:600 58px/1 P;letter-spacing:-.03em}
.mid{font:600 34px/1.15 P;letter-spacing:-.02em}

/* clear glass: a translucent body, a hairline rim, a bright top edge, a soft shadow; no thick inset rim */
.g{position:absolute;border-radius:30px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.17) 52%,rgba(255,255,255,.30) 100%);
  box-shadow:0 50px 90px -46px rgba(70,56,20,.30),0 14px 30px -18px rgba(17,17,20,.10),
    inset 0 0 0 1px rgba(255,255,255,.95),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(120,96,30,.07),inset 0 0 60px rgba(255,255,255,.28);
  outline:1px solid rgba(17,17,20,.045);outline-offset:-1px}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(110% 55% at 20% 0%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,0) 18%)}
.g::after{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 60%);
  transform:translateX(var(--sh,-130%))}
.g > *{position:relative;z-index:1}
.row{display:flex;align-items:center;justify-content:space-between}
.rule{position:absolute;left:0;top:18%;bottom:18%;width:5px;border-radius:0 3px 3px 0;background:var(--yel);transform:scaleY(var(--r,0))}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--live);margin-right:12px;vertical-align:1px}
.ydot{background:var(--yel)}
.hair{height:1px;background:rgba(17,17,20,.08)}
/* the pointer (24 Sep 2026): whatever she names flashes a soft yellow wash as it lands, then lets go */
.hitfx{position:absolute;left:-14px;right:-14px;top:-10px;bottom:-10px;border-radius:14px;pointer-events:none;opacity:0;
  background:rgba(255,207,36,.26);box-shadow:0 0 0 2px rgba(255,207,36,.55),0 0 34px rgba(255,207,36,.35)}
.g > .hitfx{position:absolute;inset:0;border-radius:inherit;z-index:0}
[data-hit]:not(.g){position:relative}   /* never on a card: a .g is placed absolutely, and v3.4 knocked the flashed cards into page flow (Faisal's screenshots, 24 Sep) */
/* the mark, small, bottom right, the whole film: the locked sting's yellow glass tile (brand/sting), 78 px */
#bug{position:absolute;right:58px;bottom:50px;width:78px;height:74.6px;opacity:0;z-index:20}
#bug .t{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,224,104,.98) 0%,#FFCF24 50%,#F4BC08 100%);
  box-shadow:0 14px 26px -12px rgba(17,17,20,.30),0 4px 9px -5px rgba(17,17,20,.16),inset 0 0 0 3px rgba(255,255,255,.14),
    inset 0 0 10px rgba(160,110,0,.22),inset 0 -1px 2px rgba(120,80,0,.18),inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.7)}
#bug .t::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 58%)}

/* photographs (Higgsfield, 24 Sep 2026): a photo fills its frame; a product shot sits on the glass with its studio
   ground multiplied away and its edges feathered, so there is no cut-out line. Only the bitmap is scaled for the
   slow push; type never is (the v3 jitter: scaling text re-snaps its glyphs to the pixel grid every frame). */
.ph{position:absolute;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
/* the swap plates (v3.6, 24 Sep 2026): Faisal's terminal photo in three pixel-aligned versions (NeroPay, YOUR LOGO,
   Keelstone Pay), their ground lifted to the paper so they sit on the page. The top plate is revealed through a moving
   gradient mask with a band of light riding its edge, so only the marks change. Only the bitmap is scaled, never type. */
.plate{position:absolute;-webkit-mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);mask-image:radial-gradient(closest-side,#000 80%,transparent 100%)}
.plate img{position:absolute;inset:0;width:100%;height:100%}
.plate .top{-webkit-mask-image:linear-gradient(115deg,#000 var(--w,0%),transparent calc(var(--w,0%) + 7%));mask-image:linear-gradient(115deg,#000 var(--w,0%),transparent calc(var(--w,0%) + 7%))}
.plate .band{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) calc(var(--w,0%) - 4%),rgba(255,255,255,.75) calc(var(--w,0%) + 3%),rgba(255,255,255,0) calc(var(--w,0%) + 10%));opacity:var(--bo,0)}
/* the two modules (brief Part 3): a big figure over its condition, and a line that climbs as the state moves */
.fig{position:absolute;left:0;width:1920px;text-align:center;font:700 176px/1 P;letter-spacing:-.045em}
.cond{position:absolute;left:0;width:1920px;text-align:center;font:500 34px/1.3 P;color:var(--ink);letter-spacing:-.015em}
.cond.dim{color:var(--mute);font-size:28px}
.center{position:absolute;left:0;width:1920px;text-align:center}
.track{position:absolute;height:6px;border-radius:3px;background:rgba(17,17,20,.10)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--yel)}
.tick{position:absolute;width:2px;height:26px;background:rgba(17,17,20,.28)}
.tl{position:absolute;font:600 24px/1 P;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.knob{position:absolute;width:44px;height:44px;border-radius:50%;margin:-19px 0 0 -22px;background:#fff;
  box-shadow:0 10px 24px -8px rgba(17,17,20,.35),inset 0 0 0 6px var(--yel)}
svg.climb{position:absolute;overflow:visible}
svg.climb .ln{fill:none;stroke:#111114;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
svg.climb .ar{fill:rgba(255,207,36,.28)}
svg.climb .dt{fill:#FFCF24;stroke:#111114;stroke-width:5}
.chip{display:inline-flex;align-items:center;gap:12px;padding:0 26px;height:62px;border-radius:14px;font:600 26px/1 P}
.cal{display:flex;gap:18px}
.cal b{width:92px;height:92px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 40px/1 P;
  background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px rgba(17,17,20,.10)}
.net{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.net i{height:46px;border-radius:12px;background:rgba(17,17,20,.07);transition:none}
.badge{display:inline-flex;align-items:center;gap:14px;height:66px;padding:0 28px;border-radius:16px;background:var(--yel);font:700 28px/1 P}
/* the capsule: slides up, a fill runs across as the business is set up, and on "live" the dot turns green with two ripples and
   the label flips up. The money moment: £100 lands, the bar runs to its first mark; on "three hundred" it runs on past £200 to
   £300, the "–£300" opens beside the £100 and the bar flashes with sparks. Only real tier values are ever on screen. */
.cap{position:relative;display:inline-flex;align-items:center;gap:16px;height:72px;padding:0 30px;border-radius:18px;overflow:visible;
  background:rgba(255,255,255,.62);box-shadow:0 18px 40px -22px rgba(17,17,20,.28),inset 0 0 0 1px rgba(255,255,255,.95),inset 0 1.5px 0 #fff;font:600 28px/1 P}
.capfill{position:absolute;left:0;top:0;bottom:0;border-radius:18px;background:linear-gradient(90deg,rgba(255,207,36,.28),rgba(255,207,36,.10));width:0}
.cap .dot{position:relative;margin:0;width:16px;height:16px;z-index:1}
.capw{position:relative;display:inline-block;height:34px;overflow:hidden;z-index:1;min-width:330px;text-align:left}
.capt{position:absolute;left:0;top:0;white-space:nowrap;line-height:34px}
.ring{position:absolute;left:38px;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--live);opacity:0;pointer-events:none}
.fig .grow{display:inline-block;overflow:hidden;vertical-align:top;white-space:nowrap}
.fig .hitfx{position:absolute;left:50%;width:900px;margin-left:-450px;top:-20px;bottom:-20px;border-radius:30px}
.mbar{position:absolute;height:14px;border-radius:7px;background:rgba(17,17,20,.08)}
.mbar > i#mfill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#FFE27A,#FFCF24)}
.mbar > b{position:absolute;left:0;top:-14px;bottom:-14px;border-radius:20px;background:radial-gradient(closest-side,rgba(255,207,36,.55),rgba(255,207,36,0));opacity:0}
.mt{position:absolute;top:-8px;width:3px;height:30px;margin-left:-1.5px;background:rgba(17,17,20,.25);border-radius:2px}
.ml{position:absolute;top:34px;transform:translateX(-50%);font:600 24px/1 P;color:var(--mute);white-space:nowrap}
.spark{position:absolute;left:900px;top:7px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#FFCF24;opacity:0}
/* the street */
#p1,#p2{display:none}
#light{opacity:.6 !important}
.kin{position:absolute;font:700 84px/1.02 P;letter-spacing:-.04em}
#street{position:absolute;left:0;top:0;width:4400px;height:1080px}
#pave{position:absolute;left:-200px;right:-200px;top:960px;height:120px;background:linear-gradient(180deg,#ECE7DC,#E4DED1)}
#pave::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#D6CFC0}
#pave i{position:absolute;top:44px;width:2px;height:76px;background:rgba(17,17,20,.06)}
.shop{position:absolute;bottom:120px;border-radius:10px 10px 0 0;box-shadow:0 30px 60px -40px rgba(17,17,20,.35),inset 0 0 0 1px rgba(17,17,20,.06)}
.shop .cor{position:absolute;left:-8px;right:-8px;top:-14px;height:18px;border-radius:6px;background:inherit;filter:brightness(.94);box-shadow:inset 0 0 0 1px rgba(17,17,20,.06)}
.shop .sign{position:absolute;left:18px;right:18px;top:22px;height:58px;border-radius:8px;background:#26262C;color:#FBFAF7;
  display:flex;align-items:center;justify-content:center;font:600 26px/1 P;letter-spacing:.02em;overflow:hidden}
.shop .sign b{position:absolute;inset:0;background:var(--yel);opacity:0}
.shop .sign span{position:relative}
.shop .awn{position:absolute;left:8px;right:8px;top:96px;height:44px;border-radius:0 0 12px 12px;
  background:repeating-linear-gradient(90deg,var(--a1) 0 30px,#F7F4EE 30px 60px);overflow:hidden}
.shop .awn b{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#FFCF24 0 30px,#FFF3C4 30px 60px);opacity:0}

/* for the render's sound: a soft tick as each shop lights, a thud on the badge */
const LIT = [ [1, 2.31, 10.45], [2, 3.20, 10.60], [3, 4.04, 10.75], [4, 4.93, 10.90], [5, 25.42, 25.42], [6, 25.82, 25.82], [7, 26.13, 26.13],

window.SFX_AT = [...new Set(LIT.map(l => l[1]))].sort((a, b) => a - b);
window.STAMP_AT = 27.61;
/* the camera along the street: [time, x], eased between keys; it walks, holds, pans to the new three, runs the street, settles */
const CAM = [[0, 0], [10, 120], [24.4, 200], [25.2, 760], [32.7, 820], [35.9, 2628], [36.4, 2628], [39.6, 1350], [46.2, 1420], [49.9, 1560]];
const camAt = t => { for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) { const [a, x0] = CAM[i - 1], [b, x1] = CAM[i];

SC.forEach(s => { const d = document.createElement('div'); d.className = 'sc';

    const ex = ax + (bx - ax) * k, ey = ay + (by - ay) * k;

    for (const [e, fx] of s.hits) { const d1 = t - +e.dataset.at - 0.12, d2 = e.dataset.hat ? t - +e.dataset.hat - 0.12 : -1;
      const f = d => d < 0 ? 0 : d < 0.18 ? d / 0.18 : Math.max(0, 1 - (d - 0.18) / 1.0); fx.style.opacity = Math.max(f(d1), f(d2)); }
    for (const m of s.marks) m.style.setProperty('--m', outC(clamp((t - +m.dataset.mark) / 0.35)));
    for (const r of s.rules) r.style.setProperty('--r', outC(clamp((t - +r.dataset.rule) / 0.35)));
  }
  /* ticks, calendar days and the badge */
  document.querySelectorAll('[data-tick]').forEach(e => { const on = t >= +e.dataset.tick; e.textContent = on ? '✓' : ''; e.style.background = on ? 'var(--yel)' : ''; });
  document.querySelectorAll('[data-lit]').forEach(e => { const on = t >= +e.dataset.lit; e.style.background = on ? 'var(--yel)' : ''; });
  document.querySelectorAll('[data-stamp]').forEach(e => { const d = t - +e.dataset.stamp, k = clamp(d / 0.2);
    e.style.opacity = d < 0 ? 0 : 1; e.style.transform = `scale(${(1.4 - 0.4 * outC(k)).toFixed(3)})`; e.style.transformOrigin = '0 50%'; });
  /* the bonus: £100 lands, then the range opens to £300 on "three hundred" */
  const g = document.getElementById('grow'); if (g) g.style.width = (g.scrollWidth * outC(clamp((t - 20.02) / 0.4))).toFixed(1) + 'px';
  /* the revenue share: rate and band move together, every band passed, never a count */
  const RB = [['20%', '3–20 new active merchants this month', 28.99], ['25%', '21–35 new active merchants this month', 38.23], ['30%', '36–60 new active merchants this month', 38.70],
    ['35%', '61–110 new active merchants this month', 39.05], ['40%', '111+ new active merchants in one month', 39.38]];
  const pc = document.getElementById('pct'); if (pc) { let cur = RB[0]; for (const r of RB) if (t >= r[2]) cur = r;
    pc.lastChild.nodeType === 3 ? pc.lastChild.textContent = cur[0] : pc.append(cur[0]); document.getElementById('pcond').textContent = cur[1];
    const since = t - cur[2]; pc.style.scale = cur !== RB[0] && since < 0.25 ? String(1 + 0.05 * Math.sin(since / 0.25 * Math.PI)) : '1';
    document.querySelectorAll('[data-lad]').forEach(b => { const on = t >= +b.dataset.lad; b.style.background = on ? 'var(--yel)' : ''; b.style.color = on ? '#111114' : ''; }); }
};
window.setFrame = (n, fps = 25) => window.setTime(n / fps);
window.SCENES_FOR_CHECK = () => SC.map((s, i) => {
  const h = s.el.querySelector('.h'); if (!h) return { i, t: null };
  const own = [h, ...h.querySelectorAll('[data-at],[data-mark]')];
  const last = Math.max(s.t[0], ...own.map(e => +(e.dataset.at || e.dataset.mark || 0)));
  const t = last + 0.9; return { i, t: t < s.t[1] - 0.15 ? t : null }; });
window.LAYOUT_READY = true;
window.setTime(0);
</script></body></html>
