<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Partner Programme explainer</title>
<style>
/* NeroPay Partner Programme explainer (25 Sep 2026), for docs.neropay.app, the partner page and anyone who asks how it
   works. Built by the CONTENT VIDEO session on the NeroConnect explainer v3.6 engine (clear glass, one moving light, two
   panes, Poppins, #FFCF24 on #FBFAF7), at Faisal's request: "keep a similar style ... break up the pattern: when you're
   explaining something, a full cut to the overlay in the middle, taking up the whole screen, and things dynamically moving;
   if it's numbers going up, a dynamic line and the numbers moving up; text only when she says it."
   Every figure is from motion/partner/BRIEF.md v4 (final, 17 Sep 2026) and figures.json (partner_bonus_tiers,
   partner_revenue_share_tiers, partner_active_gate), and every figure is on screen with its condition in the same frame:
   the Bonus Dial and the Rate Climb compute the figure and its condition from one state, so they can never part. claims.md
   lists every figure. No total, no pound figure for revenue share, none of the banned register, no lifestyle image. */
@font-face{font-family:P;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
:root{--yel:#FFCF24;--ink:#111114;--mute:#6B6B73;--live:#2FBF71}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FBFAF7}   /* 1:1: the adapter at the foot narrows them to 1080 */
body{font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

/* the world: paper, one light, two clear panes */
#ground{position:absolute;inset:0;background:radial-gradient(140% 120% at 50% 45%,#FBFAF7 55%,#F3F0E8 100%)}
#light{position:absolute;left:0;top:0;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,207,36,.34) 0%,rgba(255,207,36,.20) 22%,rgba(255,207,36,.08) 42%,rgba(255,207,36,.025) 58%,rgba(255,207,36,0) 70%)}
.pane{position:absolute;width:1700px;height:1700px;border-radius:120px;
  background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 45%,rgba(255,255,255,.18));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),inset 0 2px 0 rgba(255,255,255,.95),0 60px 120px -60px rgba(120,95,30,.16)}
.pane i{position:absolute;top:-20%;bottom:-20%;left:-60%;width:220%;background:linear-gradient(105deg,rgba(255,255,255,0) 45%,rgba(255,255,255,.55) 49.5%,rgba(255,255,255,.12) 51%,rgba(255,255,255,0) 55%)}

/* a scene: a layer the whole frame wide; its contents are placed absolutely */
.sc{position:absolute;inset:0;opacity:0}
.cam{position:absolute;inset:0;transform-origin:var(--ox,60%) var(--oy,50%)}

/* type */
.kick{position:absolute;display:flex;align-items:center;gap:14px;font:600 20px/1 P;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.kick b{display:block;width:34px;height:5px;border-radius:3px;background:var(--yel)}
.h{position:absolute;font:700 76px/1.04 P;letter-spacing:-.035em}
.h.xl{font-size:104px}
.h .ln{display:block}
.mk{position:relative;display:inline-block;isolation:isolate}
.mk::before{content:"";position:absolute;left:-6px;right:-8px;bottom:.07em;height:.36em;background:var(--yel);border-radius:3px;z-index:-1;
  transform:scaleX(var(--m,0));transform-origin:0 50%}
.sub{position:absolute;font:500 30px/1.35 P;color:var(--mute);letter-spacing:-.01em}
.lab{font:500 22px/1.2 P;color:var(--mute);letter-spacing:-.005em}
.big{font:600 58px/1 P;letter-spacing:-.03em}
.mid{font:600 34px/1.15 P;letter-spacing:-.02em}

/* clear glass: a translucent body, a hairline rim, a bright top edge, a soft shadow; no thick inset rim */
.g{position:absolute;border-radius:30px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.17) 52%,rgba(255,255,255,.30) 100%);
  box-shadow:0 50px 90px -46px rgba(70,56,20,.30),0 14px 30px -18px rgba(17,17,20,.10),
    inset 0 0 0 1px rgba(255,255,255,.95),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(120,96,30,.07),inset 0 0 60px rgba(255,255,255,.28);
  outline:1px solid rgba(17,17,20,.045);outline-offset:-1px}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(110% 55% at 20% 0%,rgba(255,255,255,.85),rgba(255,255,255,0) 58%),linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,0) 18%)}
.g::after{content:"";position:absolute;inset:-10%;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 60%);
  transform:translateX(var(--sh,-130%))}
.g > *{position:relative;z-index:1}
.row{display:flex;align-items:center;justify-content:space-between}
.rule{position:absolute;left:0;top:18%;bottom:18%;width:5px;border-radius:0 3px 3px 0;background:var(--yel);transform:scaleY(var(--r,0))}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--live);margin-right:12px;vertical-align:1px}
.ydot{background:var(--yel)}
.hair{height:1px;background:rgba(17,17,20,.08)}
/* the pointer (24 Sep 2026): whatever she names flashes a soft yellow wash as it lands, then lets go */
.hitfx{position:absolute;left:-14px;right:-14px;top:-10px;bottom:-10px;border-radius:14px;pointer-events:none;opacity:0;
  background:rgba(255,207,36,.26);box-shadow:0 0 0 2px rgba(255,207,36,.55),0 0 34px rgba(255,207,36,.35)}
.g > .hitfx{position:absolute;inset:0;border-radius:inherit;z-index:0}
[data-hit]:not(.g){position:relative}   /* never on a card: a .g is placed absolutely, and v3.4 knocked the flashed cards into page flow (Faisal's screenshots, 24 Sep) */
/* the mark, small, bottom right, the whole film: the locked sting's yellow glass tile (brand/sting), 78 px */
#bug{position:absolute;right:58px;bottom:50px;width:78px;height:74.6px;opacity:0;z-index:20}
#bug .t{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,224,104,.98) 0%,#FFCF24 50%,#F4BC08 100%);
  box-shadow:0 14px 26px -12px rgba(17,17,20,.30),0 4px 9px -5px rgba(17,17,20,.16),inset 0 0 0 3px rgba(255,255,255,.14),
    inset 0 0 10px rgba(160,110,0,.22),inset 0 -1px 2px rgba(120,80,0,.18),inset 0 0 0 1px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.7)}
#bug .t::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 58%)}

/* photographs (Higgsfield, 24 Sep 2026): a photo fills its frame; a product shot sits on the glass with its studio
   ground multiplied away and its edges feathered, so there is no cut-out line. Only the bitmap is scaled for the
   slow push; type never is (the v3 jitter: scaling text re-snaps its glyphs to the pixel grid every frame). */
.ph{position:absolute;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
/* the swap plates (v3.6, 24 Sep 2026): Faisal's terminal photo in three pixel-aligned versions (NeroPay, YOUR LOGO,
   Keelstone Pay), their ground lifted to the paper so they sit on the page. The top plate is revealed through a moving
   gradient mask with a band of light riding its edge, so only the marks change. Only the bitmap is scaled, never type. */
.plate{position:absolute;-webkit-mask-image:radial-gradient(closest-side,#000 80%,transparent 100%);mask-image:radial-gradient(closest-side,#000 80%,transparent 100%)}
.plate img{position:absolute;inset:0;width:100%;height:100%}
.plate .top{-webkit-mask-image:linear-gradient(115deg,#000 var(--w,0%),transparent calc(var(--w,0%) + 7%));mask-image:linear-gradient(115deg,#000 var(--w,0%),transparent calc(var(--w,0%) + 7%))}
.plate .band{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) calc(var(--w,0%) - 4%),rgba(255,255,255,.75) calc(var(--w,0%) + 3%),rgba(255,255,255,0) calc(var(--w,0%) + 10%));opacity:var(--bo,0)}
/* the two modules (brief Part 3): a big figure over its condition, and a line that climbs as the state moves */
.fig{position:absolute;left:0;width:1920px;text-align:center;font:700 176px/1 P;letter-spacing:-.045em}
.cond{position:absolute;left:0;width:1920px;text-align:center;font:500 34px/1.3 P;color:var(--ink);letter-spacing:-.015em}
.cond.dim{color:var(--mute);font-size:28px}
.center{position:absolute;left:0;width:1920px;text-align:center}
.track{position:absolute;height:6px;border-radius:3px;background:rgba(17,17,20,.10)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--yel)}
.tick{position:absolute;width:2px;height:26px;background:rgba(17,17,20,.28)}
.tl{position:absolute;font:600 24px/1 P;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.knob{position:absolute;width:44px;height:44px;border-radius:50%;margin:-19px 0 0 -22px;background:#fff;
  box-shadow:0 10px 24px -8px rgba(17,17,20,.35),inset 0 0 0 6px var(--yel)}
svg.climb{position:absolute;overflow:visible}
svg.climb .ln{fill:none;stroke:#111114;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
svg.climb .ar{fill:rgba(255,207,36,.28)}
svg.climb .dt{fill:#FFCF24;stroke:#111114;stroke-width:5}
.chip{display:inline-flex;align-items:center;gap:12px;padding:0 26px;height:62px;border-radius:14px;font:600 26px/1 P}
.cal{display:flex;gap:18px}
.cal b{width:92px;height:92px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 40px/1 P;
  background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1.5px rgba(17,17,20,.10)}
.net{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.net i{height:46px;border-radius:12px;background:rgba(17,17,20,.07);transition:none}
.badge{display:inline-flex;align-items:center;gap:14px;height:66px;padding:0 28px;border-radius:16px;background:var(--yel);font:700 28px/1 P}
/* the capsule: slides up, a fill runs across as the business is set up, and on "live" the dot turns green with two ripples and
   the label flips up. The money moment: £100 lands, the bar runs to its first mark; on "three hundred" it runs on past £200 to
   £300, the "–£300" opens beside the £100 and the bar flashes with sparks. Only real tier values are ever on screen. */
.cap{position:relative;display:inline-flex;align-items:center;gap:16px;height:72px;padding:0 30px;border-radius:18px;overflow:visible;

SC.forEach(s => { const d = document.createElement('div'); d.className = 'sc';
  d.innerHTML = `<div class="cam" style="--ox:${s.ox}">${s.html}</div>`; film.appendChild(d); s.el = d; s.cam = d.firstChild;
  s.items = [...d.querySelectorAll('[data-at]')]; s.marks = [...d.querySelectorAll('[data-mark]')];
  s.counts = [...d.querySelectorAll('[data-count]')]; s.rules = [...d.querySelectorAll('[data-rule]')];
  s.glass = [...d.querySelectorAll('.g')];
  s.hits = [...d.querySelectorAll('[data-hit]')].map(e => { const fx = document.createElement('i'); fx.className = 'hitfx'; e.prepend(fx); return [e, fx]; }); });

const XF = 0.4;
window.setTime = function (t) {
  /* the light glides to each scene's place over a second, starting as the scene arrives */
  let lx = SC[0].light[0], ly = SC[0].light[1];
  for (let i = 1; i < SC.length; i++) { const k = io(clamp((t - SC[i].t[0] + 0.6) / 2.4));
    lx += (SC[i].light[0] - lx) * k; ly += (SC[i].light[1] - ly) * k; }
  lx += 110 * Math.sin(t / 5.3) + 50 * Math.sin(t / 2.9); ly += 80 * Math.cos(t / 6.1) + 40 * Math.sin(t / 3.7);   /* it never stops moving */
  const endFade = 1 - clamp((t - (OUTRO_AT - 0.7)) / 0.6);
  L.style.transform = `translate(${lx}px,${ly}px)`; L.style.opacity = endFade;
  document.getElementById('ground').style.opacity = endFade;   /* plain #FBFAF7 underneath, the outro's own ground */
  P1.style.transform = `translate(${-700 + 60 * Math.sin(t / 19)}px,${-1150 + 40 * Math.cos(t / 23)}px) rotate(${38 + 1.5 * Math.sin(t / 17)}deg)`;
  P2.style.transform = `translate(${1150 + 50 * Math.cos(t / 21)}px,${250 + 40 * Math.sin(t / 25)}px) rotate(${38 + 1.2 * Math.cos(t / 15)}deg)`;
  P1.querySelector('i').style.transform = P2.querySelector('i').style.transform = `translateX(${((t * 6) % 140) - 70}%)`;
  P1.style.opacity = P2.style.opacity = endFade;
  document.getElementById('bug').style.opacity = 0.92 * outC(clamp((t - 0.60) / 0.8)) * (1 - clamp((t - (OUTRO_AT - 1.2)) / 0.5));
  /* the row she is pointing at: a yellow wash that pulses twice and stays faintly lit */
  document.querySelectorAll('[data-flash]').forEach(r => { const d = t - +r.dataset.flash;
    const a = d < 0 ? 0 : 0.10 + (d < 1.4 ? 0.22 * Math.max(0, Math.sin(d / 0.7 * 2 * Math.PI)) : 0);
    r.style.background = `rgba(255,207,36,${a.toFixed(3)})`; });

  for (const s of SC) {
    const [a, b] = s.t;
    if (t < a - 0.01 || t > b + XF) { s.el.style.display = 'none'; continue; }
    s.el.style.display = '';
    const vin = outC(clamp((t - a) / XF)), vout = 1 - io(clamp((t - b) / XF));
    s.el.style.opacity = Math.min(vin, vout);
    const push = (t - a) / (b - a);
    s.cam.style.transform = `translateY(${Math.round(-10 * io(clamp((t - b) / XF)))}px)`;
    for (const im of s.el.querySelectorAll('[data-push]')) im.style.scale = String(1 + 0.03 * push);
    for (const e of s.items) { const p = outE(clamp((t - +e.dataset.at) / 0.55)) * (e.dataset.out ? 1 - clamp((t - +e.dataset.out) / 0.3) : 1);   /* data-out: leaves */
      e.style.opacity = p; e.style.transform = e.dataset.slide !== undefined ? `translateX(${Math.round((1 - p) * 90)}px)` : (e.style.transform || '').replace(/translateY\([^)]*\)/, '') + ` translateY(${Math.round((1 - p) * 26)}px)`;
      if (e.classList.contains('g')) e.style.setProperty('--sh', `${-130 + 260 * io(clamp((t - +e.dataset.at - 0.15) / 1.0))}%`); }
    for (const [e, fx] of s.hits) { const d = t - +(e.dataset.hat || e.dataset.at) - 0.12;   /* data-hat: flash later than it arrives */
      fx.style.opacity = d < 0 ? 0 : d < 0.18 ? d / 0.18 : Math.max(0, 1 - (d - 0.18) / 1.0); }
    for (const m of s.marks) m.style.setProperty('--m', outC(clamp((t - +m.dataset.mark) / 0.35)));
    for (const r of s.rules) r.style.setProperty('--r', outC(clamp((t - +r.dataset.rule) / 0.35)));
    for (const c of s.counts) { const at = +c.closest('[data-at]').dataset.at, v = +c.dataset.count;
      const k = outC(clamp((t - at) / 0.9)); c.textContent = c.dataset.int ? String(Math.round(v * k)) : money(v * k); }
  }
  /* ---- the partner scenes */
  /* the capsule */
  const cap = document.getElementById('cap');
  if (cap) { const at = +cap.closest('[data-at]').dataset.at, live = +cap.dataset.live, k = io(clamp((t - at - 0.1) / Math.max(0.3, live - at - 0.1)));
    document.getElementById('capfill').style.width = Math.round(k * cap.offsetWidth) + 'px';
    const f = outC(clamp((t - live) / 0.35));
    document.getElementById('golive').style.background = t > live ? 'var(--live)' : '#C9C9CF';
    document.getElementById('capt1').style.transform = `translateY(${Math.round(-34 * f)}px)`; document.getElementById('capt1').style.opacity = 1 - f;
    document.getElementById('capt2').style.transform = `translateY(${Math.round(34 * (1 - f))}px)`; document.getElementById('capt2').style.opacity = f;
    document.getElementById('capfill').style.background = t > live ? `linear-gradient(90deg,rgba(47,191,113,${(0.22 * (1 - clamp((t - live - 0.4) / 1.2))).toFixed(3)}),rgba(47,191,113,0))` : '';
    [0, 0.35].forEach((d, i) => { const r = document.getElementById('ring' + (i + 1)), q = clamp((t - live - d) / 0.9);
      r.style.opacity = q > 0 && q < 1 ? (1 - q).toFixed(3) : 0; r.style.transform = `scale(${(1 + 3.2 * outC(q)).toFixed(3)})`; }); }
  /* the money moment */
  const mf = document.getElementById('mfig');
  if (mf) { const t1 = +mf.dataset.t100, t3 = +mf.dataset.t300;
    const g = mf.querySelector('.grow'), w = g.firstElementChild.offsetWidth, o = outC(clamp((t - t3) / 0.45));
    g.style.width = Math.round(w * o) + 'px';
    const fill = t < t1 ? 0 : t < t3 ? io(clamp((t - t1) / 0.55)) / 3 : 1 / 3 + (2 / 3) * io(clamp((t - t3) / 0.75));
    document.getElementById('mfill').style.width = Math.round(fill * 900) + 'px';
    [1 / 3, 2 / 3, 1].forEach((m, i) => { const on = fill >= m - 0.002; document.getElementById('ml' + i).style.color = on ? '#111114' : '';
      document.getElementById('mt' + i).style.background = on ? '#111114' : ''; });
    const hit = t - (t3 + 0.75), gl = hit < 0 ? 0 : hit < 0.15 ? hit / 0.15 : Math.max(0, 1 - (hit - 0.15) / 0.9);
    document.getElementById('mglow').style.opacity = gl.toFixed(3); document.getElementById('mflash').style.opacity = (0.8 * gl).toFixed(3);
    document.querySelectorAll('.spark').forEach(sp => { const q = clamp(hit / 0.8), a = +sp.dataset.a * Math.PI / 180, r = 90 * outC(q);
      sp.style.opacity = hit > 0 && q < 1 ? (1 - q).toFixed(3) : 0; sp.style.transform = `translate(${(Math.cos(a) * r).toFixed(1)}px,${(Math.sin(a) * r).toFixed(1)}px) scale(${(1 - 0.6 * q).toFixed(2)})`; }); }
  /* the network: the new three light first, then every active merchant */
  document.querySelectorAll('[data-lit]').forEach(n => { const k = clamp((t - +n.dataset.lit) / 0.3);
    n.style.background = k <= 0 ? 'rgba(17,17,20,.07)' : +n.dataset.new ? `rgba(255,207,36,${(0.07 + 0.93 * k).toFixed(3)})` : `rgba(255,207,36,${(0.07 + 0.38 * k).toFixed(3)})`; });
  /* a module: one state -> the figure, its condition, the knob, the filled track and the climbing line. The figure and the
     condition are computed from the same state on the same frame, so they cannot part (brief rule 1). A change counts up. */
  const module = (id, x, tiers, yOf, fmt) => {
    const fig = document.getElementById(id + 'fig'); if (!fig) return;
    const tierAt = tt => tiers(stateAt[id](tt));
    const now = tierAt(t);
    /* no count-up: a figure between two tiers ("37%" beside "111+") is a figure without its condition, a QA fail. The figure
       steps on the frame the state crosses the threshold; the knob, the fill and the line carry the motion. */
    fig.textContent = fmt(now.v, now); document.getElementById(id + 'cond').textContent = now.c;
    const cnt = document.getElementById(id + 'count'); if (cnt) cnt.textContent = now.n;
    const X = x(stateAt[id](t)) * 1300;
    document.getElementById(id + 'knob').style.left = (310 + X) + 'px'; document.getElementById(id + 'fill').style.width = X + 'px';
    /* the line: the tier staircase from 0 to the knob, drawn as the state travels */
    const svg = document.getElementById(id + 'svg'), pts = []; let lastY = null;
    for (let px = 0; px <= X; px += 4) { const y = yOf(px / 1300); if (lastY !== null && y !== lastY) pts.push([px, lastY]); pts.push([px, y]); lastY = y; }
    if (!pts.length) pts.push([0, yOf(0)]);
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    svg.querySelector('.ln').setAttribute('d', d);
    svg.querySelector('.ar').setAttribute('d', d + ` L${pts[pts.length - 1][0].toFixed(1)} 190 L0 190 Z`);
    const e = pts[pts.length - 1]; svg.querySelector('.dt').setAttribute('cx', e[0]); svg.querySelector('.dt').setAttribute('cy', e[1]);
  };
  const seg = (tt, keys) => { let v = keys[0][1]; for (let i = 1; i < keys.length; i++) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    if (tt >= t1) v = v1; else if (tt > t0) { v = v0 + (v1 - v0) * io((tt - t0) / (t1 - t0)); break; } else break; } return v; };
  /* the Bonus Dial: the business's first-30-day volume travels; the bonus steps on each threshold as she names it */
  const stateAt = {
    b: tt => seg(tt, [[55.45, 0], [56.47, 19800], [58.64, 19800], [58.96, 23000], [59.85, 23000], [61.38, 39800], [61.56, 39800], [62.03, 46000]]),
    /* the Rate Climb: new active merchants this month, 0 -> 3 -> 21 -> 36 -> 61 -> 111, every threshold passed, none skipped */
    r: tt => seg(tt, [[90.91, 0], [91.31, 3], [93.08, 3], [93.41, 21], [93.83, 21], [94.19, 36], [94.64, 36], [94.99, 61], [95.30, 61], [95.95, 111]]) };
  module('b', v => Math.min(v, 50000) / 50000,
    v => v >= 40000 ? { v: 300, c: '£40,000+ in their first 30 days' } : v >= 20000 ? { v: 200, c: '£20,000–£39,999 in their first 30 days' } : { v: 100, c: '£0–£20,000 in their first 30 days' },
    x => { const v = x * 50000; return v >= 40000 ? 20 : v >= 20000 ? 85 : 150; },
    v => '£' + Math.round(v));
  const RT = [[0, 0], [3, 1], [21, 2], [36, 3], [61, 4], [111, 5]];
  const rx = c => { for (let i = RT.length - 1; i >= 0; i--) if (c >= RT[i][0]) { const n = RT[i + 1]; return (n ? RT[i][1] + (c - RT[i][0]) / (n[0] - RT[i][0]) : RT[i][1]) / 5; } return 0; };
  module('r', c => rx(c),
    c => { const n = Math.round(c) + ' new active merchant' + (Math.round(c) === 1 ? '' : 's') + ' this month';
      return c >= 111 ? { v: 40, c: '111+ new active merchants in one month', n } : c >= 61 ? { v: 35, c: '61–110 new active merchants this month', n }
        : c >= 36 ? { v: 30, c: '36–60 new active merchants this month', n } : c >= 21 ? { v: 25, c: '21–35 new active merchants this month', n }
        : c >= 3 ? { v: 20, c: '3–20 new active merchants this month', n } : { v: 0, c: 'Under 3 this month: no revenue share', n }; },
    x => { const i = Math.floor(x * 5 + 1e-6); return [175, 150, 118, 86, 54, 20][Math.min(i, 5)]; },
    v => Math.round(v) + '%');
};
window.setFrame = (n, fps = 25) => window.setTime(n / fps);
/* for check-still.cjs: a moment in each scene after its last reveal and before it leaves */
window.SCENES_FOR_CHECK = () => SC.map((s, i) => {
  const h = s.el.querySelector('.h'); if (!h) return { i, t: null };
  const own = [h, ...h.querySelectorAll('[data-at],[data-mark]')];
  const last = Math.max(s.t[0], ...own.map(e => +(e.dataset.at || e.dataset.mark || 0)));
  const t = last + 0.9; return { i, t: t < s.t[1] - 0.15 ? t : null }; });

/* ---- the 1:1 square (Faisal, 25 Sep 2026: "redo overlays and re layout so it all makes sense and nothing overlaps").
   Every scene is laid out at 16:9, measured, then re-placed for 1080 x 1080: its headline column (kickers, headlines, subs
   on the left) keeps its type size and moves to the top-left; everything else (the glass, the diagrams) moves as one block
   below it, scaled once and statically to fit what is left, centred; lines that sat at the foot stay at the foot. A static
   scale never shimmers (the v3 jitter came from animating a scale). The hook, the swap and the close are placed by hand. */
window.LAYOUT_READY = true;   /* 16:9 only for now; the NeroConnect square adapter is not carried over */
window.setTime(0);
</script></body></html>
